      var already = allRows.find(function(r){ return (r.user_id===state.user.id&&r.friend_id===u.id)||(r.friend_id===state.user.id&&r.user_id===u.id); });
      var row = el('<div class="frow2"><div class="favatar">'+esc(u.username[0]||'?').toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(u.username)+'</div></div>'+
        (already ? '<span class="tag-pending">'+(already.status==='accepted'?'Déjà ami':'En attente')+'</span>' : '<button class="btn-gold" style="padding:7px 12px;font-size:12px;" data-add="'+u.id+'">Ajouter</button>')+
        '</div>');
      box.appendChild(row);
    });
    box.querySelectorAll('[data-add]').forEach(function(btn){
      btn.onclick = async function(){
        await apiInsert('trocdecartes_friends', [{ user_id: state.user.id, friend_id: btn.getAttribute('data-add'), status:'pending' }]);
        renderFriends();
      };
    });
  };

  if(incoming.length){
    var il = qs('incoming-list');
    incoming.forEach(function(r){
      var row = el('<div class="frow2"><div class="favatar">'+esc((usersMap[r.user_id]||'?')[0]).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(usersMap[r.user_id]||'—')+'</div><div class="fs">veut être ami</div></div><button class="btn-gold" style="padding:7px 12px;font-size:12px;" data-acc="'+r.id+'">Accepter</button></div>');
      il.appendChild(row);
    });
    il.querySelectorAll('[data-acc]').forEach(function(btn){
      btn.onclick = async function(){ await apiUpdate('trocdecartes_friends', 'id=eq.'+btn.getAttribute('data-acc'), { status:'accepted' }); renderFriends(); };
    });
  }
  if(outgoing.length){
    var ol = qs('outgoing-list');
    outgoing.forEach(function(r){
      var row = el('<div class="frow2"><div class="favatar">'+esc((usersMap[r.friend_id]||'?')[0]).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(usersMap[r.friend_id]||'—')+'</div><div class="fs">demande envoyée</div></div><span class="tag-pending">En attente</span></div>');
      ol.appendChild(row);
    });
  }
  var fl = qs('friends-list');
  if(!accepted.length){ fl.innerHTML = '<p class="muted">Aucun ami pour l\'instant.</p>'; }
  else{
    accepted.forEach(function(r){
      var otherId = r.user_id===state.user.id ? r.friend_id : r.user_id;
      var row = el('<div class="frow2" style="cursor:pointer;"><div class="favatar">'+esc((usersMap[otherId]||'?')[0]).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(usersMap[otherId]||'—')+'</div><div class="fs">voir les échanges possibles</div></div></div>');
      row.onclick = function(){ navigate('friend-detail', otherId); };
      fl.appendChild(row);
    });
  }

  var KM_STEPS = [5,10,50,100];
  var proxRange = qs('prox-range');
  if(proxRange){
    proxRange.oninput = function(){
      var km = KM_STEPS[parseInt(proxRange.value)];
      qs('prox-label').textContent = km+' km';
      loadProximityList(km, allRows);
    };
    loadProximityList(KM_STEPS[1], allRows);
  }
}

async function loadProximityList(km, existingRows){
  var box = qs('prox-list');
  if(!box) return;
  box.innerHTML = '<p class="muted">Chargement…</p>';
  var rows = await apiSelect('trocdecartes_users', 'is_public=eq.true&id=neq.'+state.user.id+'&select=id,username,city,city_lat,city_lng');
  var withDist = rows.filter(function(r){ return r.city_lat!=null && r.city_lng!=null; }).map(function(r){
    return { id:r.id, username:r.username, city:r.city, dist: haversineKm(state.user.city_lat, state.user.city_lng, r.city_lat, r.city_lng) };
  }).filter(function(r){ return r.dist<=km; }).sort(function(a,b){ return a.dist-b.dist; });

  var relatedStatus = {};
  existingRows.forEach(function(r){ relatedStatus[r.user_id===state.user.id?r.friend_id:r.user_id] = r.status; });

  if(!box) return;
  if(!withDist.length){ box.innerHTML = '<p class="muted">Personne dans ce rayon pour l\'instant.</p>'; return; }
  box.innerHTML = '';
  withDist.forEach(function(p){
    var status = relatedStatus[p.id];
    var row = el('<div class="frow2"><div class="favatar">'+esc((p.username[0]||'?')).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(p.username)+'</div><div class="fs">'+esc(p.city||'')+' · '+p.dist.toFixed(1)+' km</div></div>'+
      (status ? '<span class="tag-pending">'+(status==='accepted'?'Déjà ami':'En attente')+'</span>' : '<button class="btn-gold" style="padding:7px 12px;font-size:12px;" data-preq="'+p.id+'">Ajouter</button>')+
    '</div>');
    box.appendChild(row);
  });
  box.querySelectorAll('[data-preq]').forEach(function(btn){
    btn.onclick = async function(){
      await apiInsert('trocdecartes_friends', [{ user_id: state.user.id, friend_id: btn.getAttribute('data-preq'), status:'pending' }]);
      renderFriends();
    };
  });
}

/* ============ FRIEND DETAIL (trade view) ============ */

async function renderFriendDetail(friendId){
  var main = qs('main');
  main.innerHTML = '<button class="backlink" id="back-friends">← Amis</button><div class="section-head"><h2 id="fd-title">…</h2></div>'+
    '<div class="tabs"><button class="tab active" data-ftab="theirs">Ses doublons</button><button class="tab" data-ftab="mine">Tes doublons</button></div>'+
    '<div id="friend-detail-list"><p class="muted">Chargement…</p></div>';
  qs('back-friends').onclick = function(){ navigate('friends'); };

  await ensureFriends();
  var friend = state.friends.find(function(f){ return f.id===friendId; });
  if(!friend){
    var res = await apiSelect('trocdecartes_users', 'id=eq.'+friendId+'&select=id,username');
    friend = res[0] || { id: friendId, username: '—' };
  }
  qs('fd-title').textContent = friend.username;

  var collections = await apiSelect('trocdecartes_collections', 'select=*&order=created_at.asc');
  var collMap = {}; collections.forEach(function(c){ collMap[c.id]=c.name; });
  var cards = await apiSelect('trocdecartes_cards', 'select=*&order=number.asc');

  var myRows = await apiSelect('trocdecartes_user_cards', 'user_id=eq.'+state.user.id+'&select=card_id,variant,quantity,price,for_sale');
  var myMap = {}; myRows.forEach(function(r){ (myMap[r.card_id]=myMap[r.card_id]||{})[r.variant]=r; });

  var theirRows = await apiSelect('trocdecartes_user_cards', 'user_id=eq.'+friendId+'&select=card_id,variant,quantity,price,for_sale');
  var theirMap = {}; theirRows.forEach(function(r){ (theirMap[r.card_id]=theirMap[r.card_id]||{})[r.variant]=r; });

  var lockedMap = await getLockedMap();
  var theirsForMe = [], mineForThem = [];
  cards.forEach(function(card){
    VARIANTS.forEach(function(v){
      var theirRow = theirMap[card.id] && theirMap[card.id][v.key];
      var myRow = myMap[card.id] && myMap[card.id][v.key];
      var myQty = myRow ? myRow.quantity : 0;
      var theirQty = theirRow ? theirRow.quantity : 0;
      var theirLocked = lockedMap[friendId+'|'+card.id+'|'+v.key] || 0;
      var myLocked = lockedMap[state.user.id+'|'+card.id+'|'+v.key] || 0;
      var theirEff = sellableQty(theirRow) - theirLocked;
      var myEff = sellableQty(myRow) - myLocked;
      if(theirRow && theirEff>0 && myQty===0){
        theirsForMe.push({ card:card, variant:v.key, price: theirRow.price, quantity: theirEff, collectionName: collMap[card.collection_id]||'—' });
      }
      if(myRow && myEff>0 && theirQty===0){
        mineForThem.push({ card:card, variant:v.key, price: myRow.price, quantity: myEff, collectionName: collMap[card.collection_id]||'—' });
      }
    });
  });

  state.friendDetailData = { friend: friend, theirsForMe: theirsForMe, mineForThem: mineForThem };
  renderFriendDetailTab('theirs');

  main.querySelectorAll('[data-ftab]').forEach(function(b){
    b.onclick = function(){
      main.querySelectorAll('[data-ftab]').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      renderFriendDetailTab(b.getAttribute('data-ftab'));
    };
  });
}

function renderFriendDetailTab(tab){
  var data = state.friendDetailData;
  var list = tab==='theirs' ? data.theirsForMe : data.mineForThem;
  var box = qs('friend-detail-list');
  if(!list.length){
    box.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);">Rien ici</h3><p>'+
      (tab==='theirs' ? 'Aucun doublon chez '+esc(data.friend.username)+' qui te manque.' : 'Aucun de tes doublons ne lui manque.')+
      '</p></div>';
    return;
  }
  var groups = {};
  list.forEach(function(item){ (groups[item.collectionName]=groups[item.collectionName]||[]).push(item); });
  var html = '';
  Object.keys(groups).forEach(function(collName){
    html += '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">'+esc(collName)+'</h3>';
    groups[collName].forEach(function(item){
      var key = item.card.id+'|'+item.variant;
      var disabled = item.price==null;
      html += '<div class="frow">'+
        '<span class="fname">'+esc(item.card.name)+' <span class="muted">#'+esc(item.card.number)+' · '+variantLabel(item.variant)+' (x'+item.quantity+')</span></span>'+
        '<span class="fprice">'+(item.price!=null ? item.price.toFixed(2)+' €' : 'prix ?')+'</span>'+
        '<button class="fd-add" data-key="'+key+'" '+(disabled?'disabled':'')+'>Panier</button>'+
      '</div>';
    });
  });
  box.innerHTML = html;
  box.querySelectorAll('.fd-add').forEach(function(btn){
    btn.onclick = function(){
      var key = btn.getAttribute('data-key');
      var item = list.find(function(i){ return (i.card.id+'|'+i.variant)===key; });
      if(!item) return;
      var direction = tab==='theirs' ? 'buy' : 'sell';
      addToCart({
        cardId: item.card.id, cardName: item.card.name, cardImg: item.card.image_url,
        collectionName: item.collectionName, sellerId: data.friend.id, sellerUsername: data.friend.username,
        price: item.price, variant: item.variant, direction: direction
      });
      btn.textContent = 'Ajouté ✓'; btn.disabled = true;
    };
  });
}

/* ============ CART ============ */

function addToCart(item){
  var dup = state.cart.find(function(c){ return c.cardId===item.cardId && c.sellerId===item.sellerId && c.variant===item.variant && c.direction===item.direction; });
  if(dup) return;
  state.cart.push(item);
  saveCart();
  updateBadges();
}

async function renderCart(){
  var main = qs('main');
  main.innerHTML = '<div class="section-head"><h2>Panier</h2></div><div id="cart-items"><p class="muted">Chargement…</p></div>';
  var box = qs('cart-items');
  if(!state.cart.length){
    box.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);">Panier vide</h3><p>Ajoute des cartes en visitant les collections d\'un ami, ou la fiche d\'un ami pour proposer un échange.</p></div>';
    return;
  }

  var ownerIds = Array.from(new Set(state.cart.map(function(i){ return i.direction==='sell' ? state.user.id : i.sellerId; })));
  var cardIds = Array.from(new Set(state.cart.map(function(i){ return i.cardId; })));
  var ownRows = ownerIds.length && cardIds.length ? await apiSelect('trocdecartes_user_cards', 'user_id=in.('+ownerIds.join(',')+')&card_id=in.('+cardIds.join(',')+')&select=user_id,card_id,variant,quantity') : [];
  var qtyMap = {}; ownRows.forEach(function(r){ qtyMap[r.user_id+'|'+r.card_id+'|'+r.variant] = r.quantity; });
  var lockedMap = await getLockedMap();

  var anyUnavailable = false;
  state.cart.forEach(function(item){
    var ownerId = item.direction==='sell' ? state.user.id : item.sellerId;
    var key = ownerId+'|'+item.cardId+'|'+item.variant;
    var qty = qtyMap[key] || 0;
    var locked = lockedMap[key] || 0;
    var available = qty - 1 - locked;
    item._unavailable = available < 0;
    if(item._unavailable) anyUnavailable = true;
  });

  var groups = {};
  state.cart.forEach(function(item, idx){
    item._idx = idx;
    (groups[item.sellerId] = groups[item.sellerId] || { username: item.sellerUsername, items: [] }).items.push(item);
  });
  var html = '';
  var grandNet = 0;
  Object.keys(groups).forEach(function(sid){
    var g = groups[sid];
    var buyTotal=0, sellTotal=0;
    html += '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">'+esc(g.username)+'</h3>';
    g.items.forEach(function(item){
      var dir = item.direction||'buy';
      if(!item._unavailable){ if(dir==='buy') buyTotal += item.price; else sellTotal += item.price; }
      html += '<div class="cart-item'+(item._unavailable?' unavailable':'')+'">'+
        '<img src="'+(item.cardImg?esc(item.cardImg):PLACEHOLDER_IMG)+'" onerror="this.onerror=null;this.src=window.TROC_PLACEHOLDER;">'+
        '<div class="ci-main"><div class="cin">'+esc(item.cardName)+' <span class="muted">('+variantLabel(item.variant)+')</span></div>'+
          '<div class="cis">'+esc(item.collectionName)+' · '+(item._unavailable ? '<span style="color:var(--missing);font-weight:700;">Carte non disponible</span>' : (dir==='buy'?'tu achètes':'tu proposes en échange'))+'</div></div>'+
        '<div class="ciprice" style="color:'+(item._unavailable?'var(--text-dim)':(dir==='buy'?'var(--gold)':'var(--owned)'))+';'+(item._unavailable?'text-decoration:line-through;':'')+'">'+(dir==='buy'?'+':'−')+item.price.toFixed(2)+' €</div>'+
        '<button class="cirm" data-idx="'+item._idx+'">×</button>'+
      '</div>';
    });
    var net = buyTotal - sellTotal;
    grandNet += net;
    html += '<div class="cart-total" style="margin-top:2px;"><span>Solde avec '+esc(g.username)+'</span><span>'+(net>0?'tu dois ':net<0?'il/elle doit ':'')+Math.abs(net).toFixed(2)+' €'+(net===0?' (équilibré)':'')+'</span></div>';
  });
  box.innerHTML = html;
  box.querySelectorAll('.cirm').forEach(function(btn){
    btn.onclick = function(){ state.cart.splice(parseInt(btn.getAttribute('data-idx')),1); saveCart(); renderCart(); updateBadges(); };
  });
  var totalRow = el('<div class="cart-total" style="border-top:2px solid var(--line);margin-top:16px;padding-top:16px;"><span>Total net</span><span>'+(grandNet>0?'tu dois ':grandNet<0?'on te doit ':'')+Math.abs(grandNet).toFixed(2)+' €'+(grandNet===0?' (équilibré)':'')+'</span></div>');
  box.appendChild(totalRow);
  if(anyUnavailable){
    box.appendChild(el('<p class="muted" style="color:var(--missing);margin-top:10px;">Retire les cartes indisponibles pour pouvoir envoyer la commande.</p>'));
  }
  var discountRow = el('<div class="field" style="margin-top:14px;"><label>Demander une ristourne (%) — optionnel</label><input id="cart-discount" type="number" step="1" value="0" placeholder="ex : 10" '+(anyUnavailable?'disabled':'')+'></div>');
  box.appendChild(discountRow);
  var sendBtn = el('<button class="btn-primary" id="checkout-btn"'+(anyUnavailable?' disabled':'')+'>Envoyer les commandes</button>');
  box.appendChild(sendBtn);
  if(!anyUnavailable) qs('checkout-btn').onclick = checkout;
}

async function checkout(){
  if(!state.cart.length) return;
  var discountPct = parseFloat(qs('cart-discount') ? qs('cart-discount').value : 0) || 0;
  var bySeller = {};
  state.cart.forEach(function(item){
    (bySeller[item.sellerId] = bySeller[item.sellerId]||[]).push(item);
  });
  var rows = Object.keys(bySeller).map(function(sellerId){
    var items = bySeller[sellerId];
    var buyTotal = items.filter(function(i){return (i.direction||'buy')==='buy';}).reduce(function(s,i){return s+i.price;},0);
    var sellTotal = items.filter(function(i){return i.direction==='sell';}).reduce(function(s,i){return s+i.price;},0);
    var net = buyTotal - sellTotal;
    return {
      from_user_id: state.user.id,
      to_user_id: sellerId,
      items: items.map(function(i){ return { card_id:i.cardId, card_name:i.cardName, image:i.cardImg, collection:i.collectionName, variant:i.variant, price:i.price, direction: i.direction||'buy' }; }),
      total: net,
      status: 'pending',
      discount_percent: discountPct,
      last_actor_id: state.user.id,
      read: false
    };
  });
  await apiInsert('trocdecartes_messages', rows);
  state.cart = [];
  saveCart();
  updateBadges();
  navigate('inbox');
}

/* ============ INBOX ============ */

function isArchived(m){ return m._received ? !!m.archived_by_receiver : !!m.archived_by_sender; }
function dealColorClass(status){
  if(status==='completed') return 'mli-green';
  if(status==='cancelled' || status==='refused') return 'mli-red';
  return 'mli-orange';
}

async function renderInbox(){
  var received = await apiSelect('trocdecartes_messages', 'to_user_id=eq.'+state.user.id+'&select=*');
  var sent = await apiSelect('trocdecartes_messages', 'from_user_id=eq.'+state.user.id+'&select=*');
  received.forEach(function(m){ m._received = true; });
  sent.forEach(function(m){ m._received = false; });
  var all = received.concat(sent);
  all.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
  state.inbox = received;
  state.allDeals = all;

  var otherIds = Array.from(new Set(all.map(function(m){ return m._received ? m.from_user_id : m.to_user_id; })));
  var usersMap = {};
  if(otherIds.length){
    var users = await apiSelect('trocdecartes_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
    users.forEach(function(u){ usersMap[u.id]=u.username; });
  }
  state.dealUsersMap = usersMap;

  var shown = all.filter(function(m){ return state.messagesTab==='archived' ? isArchived(m) : !isArchived(m); });
  if(state.selectedDealId && !shown.find(function(m){ return m.id===state.selectedDealId; })) state.selectedDealId = null;

  var main = qs('main');
  main.innerHTML = '<div class="section-head"><h2>Messagerie</h2></div>'+
    '<div class="tabs"><button class="tab '+(state.messagesTab==='active'?'active':'')+'" data-mtab="active">Actives</button><button class="tab '+(state.messagesTab==='archived'?'active':'')+'" data-mtab="archived">Archives</button></div>'+
    (shown.length
      ? '<div id="messages-layout"><div class="msg-list" id="msg-list"></div><div class="msg-detail" id="msg-detail"><div class="msg-detail-empty">Sélectionne une commande à gauche.</div></div></div>'
      : '<p class="muted">'+(state.messagesTab==='archived' ? 'Aucune conversation archivée.' : 'Rien ici pour l\'instant.')+'</p>');

  main.querySelectorAll('[data-mtab]').forEach(function(b){
    b.onclick = function(){ state.messagesTab = b.getAttribute('data-mtab'); renderInbox(); };
  });
  if(!shown.length) return;

  var listEl = qs('msg-list');
  shown.forEach(function(m){
    var otherName = usersMap[m._received ? m.from_user_id : m.to_user_id] || '—';
    var unread = m._received && !m.read;
    var item = el('<div class="msg-list-item '+dealColorClass(m.status||'pending')+'" data-id="'+m.id+'">'+
      (unread ? '<span class="mli-dot"></span>' : '')+
      '<div class="mli-avatar">'+esc((otherName[0]||'?')).toUpperCase()+'</div>'+
      '<div class="mli-name">'+esc(otherName)+'</div>'+
    '</div>');
    item.onclick = function(){ state.selectedDealId = m.id; renderDealDetail(); };
    listEl.appendChild(item);
  });

  if(state.selectedDealId && shown.find(function(m){ return m.id===state.selectedDealId; })){
    renderDealDetail();
  }
}

function renderDealDetail(){
  var m = state.allDeals.find(function(x){ return x.id===state.selectedDealId; });
  var box = qs('msg-detail');
  if(!box) return;
  document.querySelectorAll('.msg-list-item').forEach(function(it){ it.classList.toggle('active', it.getAttribute('data-id')===state.selectedDealId); });
  if(!m){ box.innerHTML = '<div class="msg-detail-empty">Sélectionne une commande à gauche.</div>'; return; }

  var otherName = state.dealUsersMap[m._received ? m.from_user_id : m.to_user_id] || '—';
  var date = new Date(m.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
  var items = m.items||[];
  var byColl = {};
  items.forEach(function(it){ (byColl[it.collection||'—']=byColl[it.collection||'—']||[]).push(it); });
  var itemsHtml = Object.keys(byColl).map(function(cn){
    var thumbs = byColl[cn].map(function(it){
      var dir = it.direction||'buy';
      return '<div class="order-item">'+
        '<img src="'+(it.image?esc(it.image):PLACEHOLDER_IMG)+'" onerror="this.onerror=null;this.src=window.TROC_PLACEHOLDER;">'+
        '<div class="oi-name">'+esc(it.card_name)+' <span class="muted">('+variantLabel(it.variant)+')</span></div>'+
        '<div class="oi-tag '+(dir==='buy'?'tag-buy':'tag-sell')+'">'+(dir==='buy'?'Achat':'Échange')+' · '+it.price.toFixed(2)+' €</div>'+
      '</div>';
    }).join('');
    return '<div class="oi-collection"><b>'+esc(cn)+'</b><div class="oi-grid">'+thumbs+'</div></div>';
  }).join('');

  var status = m.status || 'pending';
  var discount = m.discount_percent || 0;
  var baseNet = m.total || 0;
  var net = baseNet - (baseNet*discount/100);
  var senderName = m._received ? otherName : 'Toi';
  var recipientName = m._received ? 'toi' : otherName;
  var balanceLine = net>0 ? (senderName+' doit '+net.toFixed(2)+' € à '+recipientName)
                   : net<0 ? (recipientName.charAt(0).toUpperCase()+recipientName.slice(1)+' doit '+Math.abs(net).toFixed(2)+' € à '+senderName)
                   : 'Échange équilibré';
  var discountLine = discount ? '<div class="muted" style="margin-top:2px;">Base '+baseNet.toFixed(2)+' € · ristourne '+discount+'%</div>' : '';
  var statusHtml = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;"><span class="status-badge status-'+status+'">'+STATUS_LABELS[status]+'</span><button class="btn-ghost" id="archive-toggle-btn" style="padding:4px 10px;font-size:11px;">'+(isArchived(m)?'Désarchiver':'Archiver')+'</button></div>';
  var itsMyTurn = (m.last_actor_id!==state.user.id);

  var actionsHtml = '';
  if((status==='pending' || status==='negotiating') && itsMyTurn){
    actionsHtml = '<div class="deal-actions"><button class="btn-danger" data-refuse>Refuser</button><button class="btn-ghost" data-negotiate>Négocier</button><button class="btn-gold" data-accept>Accepter le pokédeal</button></div>';
  } else if((status==='pending' || status==='negotiating') && !itsMyTurn){
    actionsHtml = '<p class="muted" style="margin-top:8px;">En attente de la réponse de '+esc(otherName)+'…</p>';
  } else if(status==='refused'){
    actionsHtml = '<p class="muted" style="margin-top:8px;">Refusé'+(m.refusal_reason?' — "'+esc(m.refusal_reason)+'"':'')+'</p>';
  } else if(status==='accepted'){
    actionsHtml = '<div class="deal-actions"><button class="btn-danger" data-cancel>Annuler le pokédeal</button><button class="btn-gold" data-validate>Valider le pokédeal</button></div>';
  } else if(status==='completed'){
    actionsHtml = '<p class="muted" style="margin-top:8px;">Échange finalisé, les cartes ont été transférées.</p>';
  } else if(status==='cancelled'){
    actionsHtml = '<p class="muted" style="margin-top:8px;">Pokédeal annulé.</p>';
  }

  var chatHtml = (status==='accepted' || status==='completed') ? '<div class="deal-chat" id="chat-'+m.id+'"><p class="muted" style="font-size:11px;">Chargement des messages…</p></div>' : '';

  box.innerHTML =
    '<div class="ohead"><span class="ofrom">'+(m._received?'De ':'À ')+esc(otherName)+'</span><span class="odate">'+date+'</span></div>'+
    statusHtml+
    '<div class="oitems" style="margin-top:8px;">'+itemsHtml+'</div>'+
    discountLine+
    '<div class="ototal">'+esc(balanceLine)+'</div>'+
    actionsHtml+
    chatHtml+
    (m._received && !m.read ? '<button class="btn-ghost" style="margin-top:10px;font-size:11.5px;padding:6px 10px;" data-read>Marquer comme lu</button>' : '');

  var readBtn = box.querySelector('[data-read]');
  if(readBtn) readBtn.onclick = async function(){ await apiUpdate('trocdecartes_messages', 'id=eq.'+m.id, { read:true }); m.read=true; renderDealDetail(); updateBadges(); };
  var archiveBtn = qs('archive-toggle-btn');
  if(archiveBtn) archiveBtn.onclick = async function(){
    var field = m._received ? 'archived_by_receiver' : 'archived_by_sender';
    var newVal = !isArchived(m);
    var patch = {}; patch[field] = newVal;
    await apiUpdate('trocdecartes_messages', 'id=eq.'+m.id, patch);
    m[field] = newVal;
    renderInbox();
  };
  var acceptBtn = box.querySelector('[data-accept]');
  if(acceptBtn) acceptBtn.onclick = async function(){ await apiUpdate('trocdecartes_messages', 'id=eq.'+m.id, { status:'accepted', last_actor_id: state.user.id }); m.status='accepted'; m.last_actor_id=state.user.id; renderDealDetail(); };
  var refuseBtn = box.querySelector('[data-refuse]');
  if(refuseBtn) refuseBtn.onclick = function(){ openRefuseModal(m.id); };
  var negotiateBtn = box.querySelector('[data-negotiate]');
  if(negotiateBtn) negotiateBtn.onclick = function(){ openNegotiateModal(m); };
  var cancelBtn = box.querySelector('[data-cancel]');
  if(cancelBtn) cancelBtn.onclick = async function(){ await apiUpdate('trocdecartes_messages', 'id=eq.'+m.id, { status:'cancelled', last_actor_id: state.user.id }); m.status='cancelled'; renderDealDetail(); };
  var validateBtn = box.querySelector('[data-validate]');
  if(validateBtn) validateBtn.onclick = function(){ validateDeal(m); };

  if(status==='accepted' || status==='completed') loadDealChat(m.id);
}

async function loadDealChat(dealId){
  var container = qs('chat-'+dealId);
  if(!container) return;
  var msgs;
  try{
    msgs = await apiSelect('trocdecartes_deal_messages', 'deal_id=eq.'+dealId+'&select=*&order=created_at.asc');
  }catch(e){
    container.innerHTML = '<h4 style="font-size:12px;color:var(--paper);margin-bottom:6px;">Discussion</h4><p class="muted" style="color:var(--missing);font-size:11px;word-break:break-word;">Erreur : '+esc(e.message)+'</p>';
    return;
  }
  var ids = Array.from(new Set(msgs.map(function(m){ return m.sender_id; })));
  var namesMap = {};
  if(ids.length){
    var us = await apiSelect('trocdecartes_users', 'id=in.('+ids.join(',')+')&select=id,username');
    us.forEach(function(u){ namesMap[u.id]=u.username; });
  }
  container = qs('chat-'+dealId);
  if(!container) return;
  var bubbles = msgs.length ? msgs.map(function(cm){
    var mine = cm.sender_id===state.user.id;
    return '<div class="chat-bubble'+(mine?' mine':'')+'"><span class="cb-name">'+(mine?'Toi':esc(namesMap[cm.sender_id]||'—'))+'</span>'+esc(cm.content)+'</div>';
  }).join('') : '<p class="muted" style="font-size:11px;">Aucun message. Dites-vous où et quand échanger !</p>';
  container.innerHTML =
    '<h4 style="font-size:12px;color:var(--paper);margin-bottom:8px;">Discussion</h4>'+
    '<div class="chat-messages">'+bubbles+'</div>'+
    '<div class="chat-input-row"><input type="text" maxlength="150" id="chat-input-'+dealId+'" placeholder="Message (150 caractères max)"><button id="chat-send-'+dealId+'">Envoyer</button></div>'+
    '<div class="chat-count" id="chat-count-'+dealId+'">0/150</div>';
  var inp = qs('chat-input-'+dealId);
  inp.oninput = function(){ qs('chat-count-'+dealId).textContent = inp.value.length+'/150'; };
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') sendDealChat(dealId); });
  qs('chat-send-'+dealId).onclick = function(){ sendDealChat(dealId); };
}

async function sendDealChat(dealId){
  var inp = qs('chat-input-'+dealId);
  if(!inp) return;
  var val = inp.value.trim().slice(0,150);
  if(!val) return;
  inp.disabled = true;
  try{
    await apiInsert('trocdecartes_deal_messages', [{ deal_id: dealId, sender_id: state.user.id, content: val }]);
    loadDealChat(dealId);
  }catch(e){
    inp.disabled = false;
    var countEl = qs('chat-count-'+dealId);
    if(countEl) countEl.innerHTML = '<span style="color:var(--missing);word-break:break-word;">Erreur : '+esc(e.message)+'</span>';
    console.error('Deal chat send failed:', e);
  }
}

var STATUS_LABELS = { pending:'En attente', negotiating:'Négociation en cours', refused:'Refusé', accepted:'Accepté', completed:'Terminé', cancelled:'Annulé' };

function openRefuseModal(msgId){
  openModal(
    '<h3>Refuser le pokédeal</h3>'+
    '<div class="field"><label>Message (optionnel)</label><input id="m-refuse-reason" placeholder="Pourquoi ?"></div>'+
    '<button class="btn-danger" style="width:100%;padding:12px;" id="m-refuse-save">Refuser</button>'
  );
  qs('m-refuse-save').onclick = async function(){
    var reason = (qs('m-refuse-reason').value||'').trim();
    await apiUpdate('trocdecartes_messages', 'id=eq.'+msgId, { status:'refused', refusal_reason: reason, last_actor_id: state.user.id });
    closeModal();
    renderInbox();
  };
}

function openNegotiateModal(msg){
  openModal(
    '<h3>Négocier</h3>'+
    '<p class="muted" style="margin-bottom:14px;">Choisis un pourcentage à appliquer sur le total (positif = remise, négatif = supplément).</p>'+
    '<div class="field"><label>Pourcentage (%)</label><input id="m-negotiate-pct" type="number" step="1" value="'+(msg.discount_percent||0)+'"></div>'+
    '<button class="btn-primary" id="m-negotiate-save">Envoyer la proposition</button>'
  );
  qs('m-negotiate-save').onclick = async function(){
    var pct = parseFloat(qs('m-negotiate-pct').value)||0;
    await apiUpdate('trocdecartes_messages', 'id=eq.'+msg.id, { status:'negotiating', discount_percent: pct, last_actor_id: state.user.id });
    closeModal();
    renderInbox();
  };
}

async function validateDeal(msg){
  var items = msg.items || [];
  for(var i=0;i<items.length;i++){
    var it = items[i];
    if(!it.card_id) continue;
    var ownerId = it.direction==='sell' ? msg.from_user_id : msg.to_user_id;
    var receiverId = it.direction==='sell' ? msg.to_user_id : msg.from_user_id;
    var ownerRows = await apiSelect('trocdecartes_user_cards', 'user_id=eq.'+ownerId+'&card_id=eq.'+it.card_id+'&variant=eq.'+it.variant+'&select=*');
    if(ownerRows[0]) await apiUpdate('trocdecartes_user_cards', 'id=eq.'+ownerRows[0].id, { quantity: Math.max(0, ownerRows[0].quantity-1) });
    var receiverRows = await apiSelect('trocdecartes_user_cards', 'user_id=eq.'+receiverId+'&card_id=eq.'+it.card_id+'&variant=eq.'+it.variant+'&select=*');
    if(receiverRows[0]) await apiUpdate('trocdecartes_user_cards', 'id=eq.'+receiverRows[0].id, { quantity: receiverRows[0].quantity+1 });
    else await apiInsert('trocdecartes_user_cards', [{ user_id: receiverId, card_id: it.card_id, variant: it.variant, quantity: 1, price: null }]);
  }
  await apiUpdate('trocdecartes_messages', 'id=eq.'+msg.id, { status:'completed' });
  renderInbox();
}

/* ============ MODAL ============ */

function openModal(html){
  qs('modal-box').innerHTML = '<button class="modal-close" onclick="TrocDeCartes.closeModal()">×</button>'+html;
  qs('modal-layer').classList.add('show');
}
function closeModal(){ qs('modal-layer').classList.remove('show'); qs('modal-box').innerHTML=''; }

/* ============ BOOT ============ */

async function boot(){
  var sess = state.user || loadSession();
  if(!sess){ renderAuth('login'); return; }
  state.user = sess;
  state.cart = loadCart();
  renderShell();
  try{
    var inb = await apiSelect('trocdecartes_messages', 'to_user_id=eq.'+state.user.id+'&read=eq.false&select=id');
    state.inbox = inb.map(function(r){ return {read:false}; });
  }catch(e){}
  refreshFriendPending();
  updateBadges();
  navigate('home');
}

window.TrocDeCartes = { closeModal: closeModal };
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
