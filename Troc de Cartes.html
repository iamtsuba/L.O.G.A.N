<style>
:root{
  --ink:#14161B;
  --panel:#1D2027;
  --panel-raised:#262A33;
  --paper:#F7F5EF;
  --paper-dim:#EAE6DA;
  --pokered:#E3350D;
  --pokered-dark:#B32A0B;
  --gold:#F4C430;
  --owned:#3FA96A;
  --owned-bg:#1D3327;
  --missing:#D9534F;
  --missing-bg:#33201F;
  --friend:#F2994A;
  --friend-bg:#3A2A16;
  --line:#333844;
  --text:#F1EFE7;
  --text-dim:#A6ABBA;
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);min-height:100%;overflow-x:hidden;}
body{padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3{font-family:'Rubik',sans-serif;margin:0;}
.brand{font-family:'Rubik Mono One',sans-serif;letter-spacing:0.5px;}
a{color:inherit;}
button{font-family:'Rubik',sans-serif;cursor:pointer;border:none;border-radius:10px;font-weight:700;}
input,select{font-family:'Inter',sans-serif;}
::selection{background:var(--gold);color:var(--ink);}

/* ---- topbar ---- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--ink) 0%,rgba(20,22,27,0.96) 100%);
  border-bottom:2px solid var(--pokered);
}
#topbar .ball{width:24px;height:24px;flex:0 0 auto;}
#topbar .logo{height:34px;width:auto;display:block;flex:0 0 auto;max-width:46vw;object-fit:contain;}
#topbar .logo-wrap{flex:1;min-width:0;display:flex;align-items:center;}
#topbar .title{font-size:15px;color:var(--paper);flex:1;min-width:0;}
#topbar .navbtn{
  background:none;color:var(--text-dim);padding:7px 9px;border-radius:8px;font-size:12.5px;flex:0 0 auto;
}
#topbar .navbtn:hover{background:var(--panel-raised);color:var(--paper);}
#userchip{font-size:11.5px;color:var(--text-dim);padding:6px 9px;background:var(--panel);border-radius:8px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto;}

main{max-width:1040px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px));}

/* ---- bottom nav ---- */
#bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  background:linear-gradient(0deg,var(--ink) 60%,rgba(20,22,27,0.97) 100%);

}
.tabbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;

}

.tabbtn .ticon svg{width:21px;height:21px;display:block;}
.tabbtn.active{color:var(--gold);}
.tabbtn:active{background:var(--panel-raised);}
.tbadge{
  position:absolute;top:-5px;right:-8px;background:var(--pokered);color:#fff;border-radius:20px;font-size:9.5px;
  min-width:15px;height:15px;padding:0 3px;font-family:'Inter',sans-serif;font-weight:700;
  align-items:center;justify-content:center;
}

/* ---- auth screen ---- */
#auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{

  border-radius:18px;padding:30px 26px;
}
.auth-card .ball-big{width:56px;height:56px;margin:0 auto 10px;display:block;}
.auth-card h1{text-align:center;font-size:24px;color:var(--paper);margin-bottom:2px;}
.auth-card p.sub{text-align:center;color:var(--text-dim);font-size:13px;margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.field input:focus{outline:none;border-color:var(--gold);}
.btn-primary{width:100%;padding:12px;background:var(--pokered);color:#fff;border-radius:10px;font-size:15px;margin-top:4px;}
.btn-primary:hover{background:var(--pokered-dark);}
.switch-mode{text-align:center;margin-top:16px;font-size:13px;color:var(--text-dim);}
.switch-mode button{background:none;color:var(--gold);font-size:13px;padding:0;}
.auth-error{background:var(--missing-bg);color:#ffb3af;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}

/* ---- home / collections ---- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.section-head h2{font-size:20px;color:var(--paper);}
.btn-gold{background:var(--gold);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--panel-raised);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-ghost:hover{background:var(--line);}
.btn-danger{background:var(--missing-bg);color:var(--missing);border:1.5px solid var(--missing);padding:9px 14px;border-radius:9px;font-size:13px;}

.coll-list{display:flex;flex-direction:column;gap:10px;}
.tile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.gtile{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;text-align:center;min-width:0;transition:transform .1s;}

.gtile .gph svg{width:46%;height:auto;opacity:.5;}
.gtile .gname{font-size:12.5px;font-weight:700;color:var(--paper);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.gtile .gsub{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
.gtile .gbar{height:5px;border-radius:4px;background:var(--panel-raised);overflow:hidden;margin-top:6px;}
.gtile .gbar>div{height:100%;background:linear-gradient(90deg,var(--pokered),var(--gold));border-radius:4px;}
.gtile .gedit{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:rgba(20,22,27,.85);color:var(--paper);border:1px solid var(--line);font-size:12px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;}
.gtile .gedit:hover{background:var(--gold);color:var(--ink);}
.photo-field{display:flex;gap:12px;align-items:center;}
.photo-field img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--panel-raised);flex:0 0 auto;}
.photo-field .pf-empty{width:64px;height:64px;border-radius:10px;background:var(--panel-raised);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);}
.coll-row{
  display:flex;align-items:center;gap:16px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s;
}
.coll-row:hover{border-color:var(--gold);}
.coll-row .cnum{
  width:40px;height:40px;border-radius:50%;background:var(--panel-raised);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:'Rubik',sans-serif;font-weight:700;font-size:14px;flex:0 0 auto;
}
.coll-row .cinfo{flex:1;min-width:0;}
.coll-row .cinfo h3{font-size:16px;color:var(--paper);}
.coll-row .cinfo .csub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.coll-row .cprog{width:120px;flex:0 0 auto;}
.progress-track{height:8px;border-radius:6px;background:var(--panel-raised);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pokered),var(--gold));border-radius:6px;}
.cprog .pct{font-size:12px;color:var(--text-dim);text-align:right;margin-top:4px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .ball-big{width:44px;height:44px;margin:0 auto 14px;opacity:.6;}

/* ---- collection detail ---- */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:10px;background:none;padding:0;}
.backlink:hover{color:var(--paper);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;
}
.tile{
  border-radius:12px;padding:8px;cursor:pointer;position:relative;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .1s;
}
.tile:hover{transform:translateY(-2px);}
.tile.owned{background:var(--owned-bg);border-color:var(--owned);}
.tile.missing{background:var(--missing-bg);border-color:var(--missing);}
.tile.friend{background:var(--friend-bg);border-color:var(--friend);}
.tile.complete-gold{background:#4a3d0e;border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold);}
.card-grid.only-missing .tile.owned{display:none;}
.tile-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--missing-bg);color:var(--missing);border:1px solid var(--missing);font-size:12px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;}
.tile-del:hover{background:var(--missing);color:#fff;}
.tile img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:7px;background:var(--panel-raised);margin-bottom:6px;}
.tile .tnum{font-size:10px;color:var(--text-dim);}
.tile .tprice{font-size:11px;color:var(--gold);margin-top:2px;min-height:14px;font-weight:600;}
.tile .tprice a{color:var(--text-dim);font-weight:400;font-size:10.5px;text-decoration:underline;}
.tile .tname{font-size:11.5px;color:var(--text);line-height:1.25;margin-top:1px;}
.tile-variants{display:flex;gap:3px;margin-top:5px;}
.vchip{font-size:8.5px;padding:2px 5px;border-radius:5px;background:var(--panel-raised);color:var(--text-dim);font-weight:700;letter-spacing:.3px;}
.vchip.owned{background:var(--owned);color:#0c1f14;}
.quick-row{display:flex;justify-content:space-between;gap:12px;margin:10px 0 0;}
.quick-add{
  flex:0 0 auto;width:44px;height:44px;padding:0;border-radius:50%;font-size:14px;font-weight:800;
  background:#fff;color:#14161B;display:flex;align-items:center;justify-content:center;
}
.quick-add:active{background:var(--gold);}
.quick-add:hover{background:var(--gold);}

/* ---- modal ---- */
#modal-layer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;}
#modal-layer.show{display:flex;}
#modal-backdrop{position:absolute;inset:0;background:rgba(10,11,14,0.72);}
.modal-box{
  position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;
}
.modal-box h3{font-size:18px;color:var(--paper);margin-bottom:16px;}
.modal-close{position:absolute;top:14px;right:14px;background:none;color:var(--text-dim);width:28px;height:28px;border-radius:8px;font-size:16px;}

.qty-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0;}

.qty-row button:hover{background:var(--line);}
.qty-row .qtyval{font-size:22px;font-weight:700;min-width:34px;text-align:center;}
.variant-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
.variant-block:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
.variant-block .variant-head{font-size:13px;color:var(--paper);font-weight:700;text-align:center;}
.variant-block .qty-row{margin:10px 0;}
.variant-block .qty-row button{width:32px;height:32px;font-size:16px;}
.force-sale-row{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;color:var(--text-dim);margin-bottom:8px;}
.force-sale-row input{width:15px;height:15px;accent-color:var(--gold);}
.variant-block .qtyval{font-size:18px;}
.card-preview{width:120px;margin:0 auto 12px;display:block;}
.card-preview img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:10px;background:var(--panel-raised);}
.friendlist{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;}
.friendlist h4{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;font-weight:600;}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.frow:last-child{border-bottom:none;}
.frow .fname{flex:1;font-size:13.5px;}
.frow .fprice{font-size:13px;color:var(--gold);font-weight:700;}
.frow button{padding:6px 10px;font-size:11.5px;background:var(--pokered);color:#fff;border-radius:7px;}
.frow button:disabled{background:var(--line);color:var(--text-dim);cursor:default;}
.muted{color:var(--text-dim);font-size:12.5px;}

/* ---- friends page ---- */
.searchbar{display:flex;gap:8px;margin-bottom:22px;}
.searchbar input{flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.searchbar input:focus{outline:none;border-color:var(--gold);}
.frow2{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.frow2 .favatar{width:34px;height:34px;border-radius:50%;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);flex:0 0 auto;}
.frow2 .fmain{flex:1;}
.frow2 .fmain .fu{font-size:14px;color:var(--paper);}
.frow2 .fmain .fs{font-size:11.5px;color:var(--text-dim);}
.tag-pending{font-size:11px;color:var(--gold);background:var(--panel-raised);padding:3px 8px;border-radius:20px;}
.city-suggestions{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:9px;margin-top:4px;max-height:180px;overflow-y:auto;z-index:20;display:none;}
.city-sugg-item{padding:9px 12px;font-size:13px;cursor:pointer;}
.city-sugg-item:hover{background:var(--panel-raised);}
.city-sugg-empty{padding:9px 12px;font-size:12px;color:var(--text-dim);}
.proximity-gauge{margin-bottom:16px;}
.proximity-gauge input[type=range]{width:100%;accent-color:var(--gold);}
.prox-label{text-align:center;font-size:13px;color:var(--gold);font-weight:700;margin-top:6px;}

/* ---- cart / inbox ---- */
.cart-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.cart-item img{width:38px;aspect-ratio:5/7;object-fit:cover;border-radius:6px;background:var(--panel-raised);}
.cart-item .ci-main{flex:1;}
.cart-item .ci-main .cin{font-size:13.5px;color:var(--paper);}
.cart-item .ci-main .cis{font-size:11.5px;color:var(--text-dim);}
.cart-item .ciprice{font-size:14px;color:var(--gold);font-weight:700;}
.cart-item .cirm{background:none;color:var(--missing);font-size:18px;padding:4px 8px;}
.cart-item.unavailable{opacity:.7;border:1.5px solid var(--missing);}
.btn-primary:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:15px;color:var(--paper);border-top:1px solid var(--line);padding-top:14px;}
.order-card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.order-card .ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .ohead .ofrom{font-size:14px;color:var(--paper);font-weight:600;}
.order-card .ohead .odate{font-size:11.5px;color:var(--text-dim);}
.order-card .oitems{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.order-card .ototal{margin-top:8px;font-size:14px;color:var(--gold);font-weight:700;}
.oi-collection{margin-bottom:12px;}
.oi-collection:last-child{margin-bottom:0;}
.oi-collection b{font-size:11px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:700;}
.oi-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.order-item{flex:0 0 auto;width:66px;text-align:center;}
.order-item img{width:66px;aspect-ratio:5/7;object-fit:cover;border-radius:8px;background:var(--panel-raised);}
.order-item .oi-name{font-size:10px;color:var(--text);line-height:1.2;margin-top:4px;}
.order-item .oi-tag{font-size:9px;font-weight:700;margin-top:3px;padding:2px 5px;border-radius:5px;display:inline-block;}
.tag-buy{background:var(--owned-bg);color:var(--owned);}
.tag-sell{background:var(--friend-bg);color:var(--friend);}
.deal-chat{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.chat-messages{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin-bottom:8px;}
.chat-bubble{background:var(--panel-raised);border-radius:10px;padding:7px 10px;font-size:12.5px;max-width:82%;align-self:flex-start;}
.chat-bubble.mine{background:var(--gold);color:var(--ink);align-self:flex-end;}
.chat-bubble .cb-name{display:block;font-size:9.5px;opacity:.7;margin-bottom:2px;font-weight:700;}
.chat-input-row{display:flex;flex-wrap:wrap;gap:6px;}
.chat-input-row input{min-width:0;}
.chat-input-row input{flex:1;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:12.5px;}
.chat-input-row button{padding:9px 13px;background:var(--pokered);color:#fff;border-radius:9px;font-size:12px;}
.chat-count{text-align:right;font-size:10px;color:var(--text-dim);margin-top:3px;}
#messages-layout{display:flex;gap:8px;align-items:flex-start;max-width:100%;}
.msg-list{width:74px;flex:0 0 74px;display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow-y:auto;overflow-x:hidden;padding-right:2px;}
.msg-list-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 3px;border-radius:10px;background:var(--panel-raised);border:1.5px solid var(--line);cursor:pointer;}
.msg-list-item.mli-green{background:var(--owned-bg);border-color:var(--owned);}
.msg-list-item.mli-orange{background:var(--friend-bg);border-color:var(--friend);}
.msg-list-item.mli-red{background:var(--missing-bg);border-color:var(--missing);}
.msg-list-item.active{box-shadow:0 0 0 2px var(--gold);}
.msg-list-item .mli-avatar{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--paper);font-size:12px;flex:0 0 auto;}
.msg-list-item .mli-name{font-size:9px;color:var(--paper);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-list-item .mli-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--pokered);border:1.5px solid var(--ink);}
.msg-detail{flex:1;min-width:0;max-width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;max-height:72vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;}
.msg-detail-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 10px;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pokered);display:inline-block;margin-right:6px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;}
.tab{background:var(--panel);color:var(--text-dim);padding:8px 14px;border-radius:9px;font-size:13px;}
.tab.active{background:var(--gold);color:var(--ink);}
.status-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.status-pending{background:var(--panel-raised);color:var(--text-dim);}
.status-negotiating{background:var(--friend-bg);color:var(--friend);}
.status-refused{background:var(--missing-bg);color:var(--missing);}
.status-accepted{background:var(--owned-bg);color:var(--owned);}
.status-completed{background:var(--gold);color:var(--ink);}
.status-cancelled{background:var(--panel-raised);color:var(--text-dim);}
.deal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.deal-actions button{flex:1;min-width:100px;padding:9px 6px;font-size:12px;}

/* ---- csv/import modal helpers ---- */
textarea{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}
.filepick{display:block;width:100%;padding:14px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;margin-bottom:14px;}
.filepick:hover{border-color:var(--gold);color:var(--paper);}

@media (max-width:480px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
}

function setupCityAutocomplete(inputEl, suggEl, onSelect){
  var debounceTimer;
  inputEl.addEventListener('input', function(){
    clearTimeout(debounceTimer);
    var q = inputEl.value.trim();
    if(q.length<2){ suggEl.innerHTML=''; suggEl.style.display='none'; return; }
    debounceTimer = setTimeout(async function(){
      try{
        var res = await fetch('https://geo.api.gouv.fr/communes?nom='+encodeURIComponent(q)+'&fields=nom,code,centre&boost=population&limit=8');
        var data = await res.json();
        if(!data.length){ suggEl.innerHTML='<div class="city-sugg-empty">Aucune ville trouvée</div>'; suggEl.style.display='block'; return; }
        suggEl.innerHTML = data.map(function(c){
          var lng = c.centre && c.centre.coordinates ? c.centre.coordinates[0] : '';
          var lat = c.centre && c.centre.coordinates ? c.centre.coordinates[1] : '';
          return '<div class="city-sugg-item" data-name="'+esc(c.nom)+'" data-lat="'+lat+'" data-lng="'+lng+'">'+esc(c.nom)+'</div>';
        }).join('');
        suggEl.style.display='block';
        suggEl.querySelectorAll('.city-sugg-item').forEach(function(item){
          item.onclick = function(){
            var name = item.getAttribute('data-name');
            var lat = parseFloat(item.getAttribute('data-lat'));
            var lng = parseFloat(item.getAttribute('data-lng'));
            inputEl.value = name;
            suggEl.innerHTML=''; suggEl.style.display='none';
            onSelect({ name:name, lat:lat, lng:lng });
          };
        });
      }catch(e){
        suggEl.innerHTML='<div class="city-sugg-empty">Erreur de recherche</div>';
        suggEl.style.display='block';
      }
    }, 300);
  });
  document.addEventListener('click', function(e){
    if(e.target!==inputEl && !suggEl.contains(e.target)) suggEl.style.display='none';
  });
}

function haversineKm(lat1, lng1, lat2, lng2){
  var R = 6371;
  var dLat = (lat2-lat1)*Math.PI/180;
  var dLng = (lng2-lng1)*Math.PI/180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}

async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pokeshop::'+str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

/* ============ DATA LAYER ============ */

async function apiSelect(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiInsert(table, rows, opts){
  opts = opts || {};
  var url = SUPABASE_URL + '/rest/v1/' + table + (opts.upsertOn ? '?on_conflict='+opts.upsertOn : '');
  var headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer: 'return=representation' + (opts.upsertOn ? ',resolution=merge-duplicates' : '') };
  var res = await fetch(url, { method:'POST', headers: headers, body: JSON.stringify(rows) });
  if(!res.ok){ var t = await res.text(); if(res.status!==409) throw new Error(t); return null; }
  return res.json();
}
async function apiUpdate(table, query, patch){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'PATCH', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'return=representation' }, body: JSON.stringify(patch) });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiDelete(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'DELETE', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return true;
}

async function doRegister(){
  var username = (qs('f-username').value||'').trim();
  var email = (qs('f-email').value||'').trim().toLowerCase();
  var password = qs('f-password').value||'';
  if(!username || !email || !password){ renderAuth('register','Remplis tous les champs.'); return; }
  if(password.length < 4){ renderAuth('register','Mot de passe trop court (4 caractères min).'); return; }
  if(!registerSelectedCity){ renderAuth('register','Choisis une ville dans la liste de suggestions.'); return; }
  try{
    var existing = await apiSelect('trocdecartes_users', 'or=(username.eq.'+encodeURIComponent(username)+',email.eq.'+encodeURIComponent(email)+')&select=id');
    if(existing.length){ renderAuth('register','Ce pseudo ou cet email est déjà pris.'); return; }
    var hash = await sha256(password);
    var rows = await apiInsert('trocdecartes_users', [{ username: username, email: email, password_hash: hash, city: registerSelectedCity.name, city_lat: registerSelectedCity.lat, city_lng: registerSelectedCity.lng, is_public: false }]);
    if(!rows || !rows.length){ renderAuth('register','Inscription impossible, réessaie.'); return; }
    var u = rows[0];
    var sess = { id: u.id, username: u.username, email: u.email, city: u.city, city_lat: u.city_lat, city_lng: u.city_lng, is_public: u.is_public };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('register','Erreur : '+e.message); }
}

async function doLogin(){
  var identifier = (qs('f-identifier').value||'').trim();
  var password = qs('f-password').value||'';
  if(!identifier || !password){ renderAuth('login','Remplis tous les champs.'); return; }
  try{
    var hash = await sha256(password);
    var idEnc = encodeURIComponent(identifier.toLowerCase());
    var rows = await apiSelect('trocdecartes_users', 'or=(username.ilike.'+encodeURIComponent(identifier)+',email.eq.'+idEnc+')&select=*');
    var u = rows.find(function(r){ return r.password_hash === hash; });
    if(!u){ renderAuth('login','Identifiants incorrects.'); return; }
    var sess = { id: u.id, username: u.username, email: u.email, city: u.city, city_lat: u.city_lat, city_lng: u.city_lng, is_public: u.is_public };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('login','Erreur : '+e.message); }
}

function updateAdminBtn(){
  var btn = qs('admin-btn');
  if(!btn) return;
  btn.textContent = state.isAdmin ? 'Admin ✓' : 'Admin';
  btn.style.color = state.isAdmin ? 'var(--gold)' : '';
}

function openAdminModal(){
  openModal(
    '<h3>Mode admin</h3>'+
    '<p class="muted" style="margin-bottom:14px;">Entre le code admin pour gérer les collections et les cartes.</p>'+
    '<div class="field"><label>Code admin</label><input id="m-admin-code" type="password" autocomplete="off"></div>'+
    '<div id="admin-err" class="auth-error" style="display:none;">Code incorrect.</div>'+
    '<button class="btn-primary" id="m-admin-save">Valider</button>'
  );
  function submit(){
    var val = qs('m-admin-code').value||'';
    if(val === ADMIN_CODE){
      localStorage.setItem('trocdecartes_admin','1');
      state.isAdmin = true;
      closeModal();
      updateAdminBtn();
      navigate(state.view, state.currentCollectionId);
    } else {
      qs('admin-err').style.display='block';
    }
  }
  qs('m-admin-save').onclick = submit;
  qs('m-admin-code').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  qs('m-admin-code').focus();
}

function updateBadges(){
  var cb = qs('cart-badge'); if(cb){ if(state.cart.length){ cb.style.display='flex'; cb.textContent = state.cart.length; } else cb.style.display='none'; }
  var ib = qs('inbox-badge');
  if(ib){
    var unread = state.inbox.filter(function(m){ return !m.read; }).length;
    if(unread){ ib.style.display='flex'; ib.textContent = unread; } else ib.style.display='none';
  }
  var fb = qs('friends-badge');
  if(fb){ if(state.friendPendingCount){ fb.style.display='flex'; fb.textContent = state.friendPendingCount; } else fb.style.display='none'; }
  document.querySelectorAll('.tabbtn[data-nav]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav')===state.view);
  });
}

async function refreshFriendPending(){
  try{
    var rows = await apiSelect('trocdecartes_friends', 'friend_id=eq.'+state.user.id+'&status=eq.pending&select=id');
    state.friendPendingCount = rows.length;
    updateBadges();
  }catch(e){}
}

async function navigate(view, arg){
  state.view = view;
  if(view==='home') await renderHome();
  else if(view==='collection') await renderCollection(arg);
  else if(view==='friends') await renderFriends();
  else if(view==='friend-detail') await renderFriendDetail(arg);
  else if(view==='cart') await renderCart();
  else if(view==='inbox') await renderInbox();
  else if(view==='profile') await renderProfile();
  updateBadges();
}

var SQL_IMAGES = "alter table trocdecartes_themes add column if not exists image text;\nalter table trocdecartes_collections add column if not exists image text;";

function resizeImageFile(file, maxSize){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('Lecture du fichier impossible')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('Image illisible')); };
      img.onload = function(){
        var side = Math.min(img.width, img.height);           // recadrage carré centré
        var sx = (img.width - side)/2, sy = (img.height - side)/2;
        var out = Math.min(maxSize, side);
        var cv = document.createElement('canvas'); cv.width = out; cv.height = out;
        cv.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, out, out);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function photoFieldHtml(id, cur){
  return '<div class="field"><label>Photo</label><div class="photo-field">'+
    (cur ? '<img id="'+id+'-prev" src="'+esc(cur)+'">' : '<div class="pf-empty" id="'+id+'-prev">Aucune</div>')+
    '<div style="display:flex;flex-direction:column;gap:6px;min-width:0;"><input type="file" accept="image/*" id="'+id+'-file" style="font-size:12px;max-width:100%;">'+
    '<button type="button" class="btn-ghost" id="'+id+'-clear" style="font-size:11px;padding:4px 8px;align-self:flex-start;">Retirer la photo</button></div></div></div>';
}
// ctl.value : undefined = inchangé, null = retirer, chaîne = nouvelle photo
function bindPhotoField(id){
  var ctl = { value: undefined };
  function setPrev(url){
    var old = qs(id+'-prev');
    var node = url ? el('<img id="'+id+'-prev" src="'+url+'">') : el('<div class="pf-empty" id="'+id+'-prev">Aucune</div>');
    old.parentNode.replaceChild(node, old);
  }
  qs(id+'-file').onchange = async function(){
    var f = this.files && this.files[0];
    if(!f) return;
    try{ ctl.value = await resizeImageFile(f, 480); setPrev(ctl.value); }
    catch(e){ alert('Photo : '+e.message); }
  };
  qs(id+'-clear').onclick = function(){ ctl.value = null; setPrev(null); qs(id+'-file').value = ''; };
  return ctl;
}
function imageErrHint(e){
  var m = (e && e.message) ? e.message : String(e);
  return /image/i.test(m) ? m+'\n\nLa colonne "image" existe-t-elle ? Exécute dans Supabase :\n'+SQL_IMAGES : m;
}
function tileImgHtml(img){
  return img ? '<img class="gimg" loading="lazy" src="'+esc(img)+'" alt="">' : '<div class="gph">'+BALL_SVG+'</div>';
}

var SQL_THEMES = "create table if not exists trocdecartes_themes (id uuid primary key default gen_random_uuid(), name text not null, created_at timestamptz default now());\nalter table trocdecartes_themes disable row level security;\nalter table trocdecartes_collections add column if not exists theme_id uuid references trocdecartes_themes(id) on delete set null;";

async function loadThemes(){
  try{ state.themes = await apiSelect('trocdecartes_themes', 'select=*&order=name.asc'); state.themesAvailable = true; }
  catch(e){ state.themes = []; state.themesAvailable = false; }
  return state.themes;
}

function themeOptionsHtml(selectedId){
  var opts = '<option value="">Sans thème</option>';
  (state.themes||[]).forEach(function(t){ opts += '<option value="'+esc(t.id)+'"'+(t.id===selectedId?' selected':'')+'>'+esc(t.name)+'</option>'; });
  return opts;
}

async function renderHome(){
  var main = qs('main');
  main.innerHTML = '<p class="muted">Chargement…</p>';
  var themes = await loadThemes();
  var collections = await apiSelect('trocdecartes_collections', 'select=*&order=created_at.asc');
  state.collections = collections;

  var noThemeColls = collections.filter(function(c){ return !c.theme_id; });
  var themeMode = state.themesAvailable && themes.length > 0;

  // ----- Écran de choix du thème -----
  if(themeMode && !state.currentThemeId){

/* ============ PRIX MOYEN CARDMARKET (TCGdex en priorité, pokemontcg.io en secours) ============ */
var CM_TTL = 12*3600*1000;
var TCGDEX = 'https://api.tcgdex.net/v2/fr/';
var TCGDEX_SET_MAP = { pgo:'swsh10.5', sv3pt5:'sv03.5', cel25:'cel25', svp:'svp', swshp:'swshp' };
var tcgdexSetCache = {};

function cardApiRef(card){
  var u = card.image_url || '';
  var m = u.match(/images\.pokemontcg\.io\/([^\/]+)\/([^_\/]+)_hires/);
  if(!m) m = u.match(/images\.pokemoncard\.io\/images\/([^\/]+)\/[^\/]*?-([^\/.]+)\.png/);
  return m ? { code:m[1], num:m[2], id:m[1]+'-'+m[2] } : null;
}
function normNum(n){ return String(n||'').replace(/^0+(?=\d)/,'').toUpperCase(); }
function fmtEur(v){ return v.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}); }
function cmCacheGet(key){
  try{ var r = JSON.parse(localStorage.getItem('trocdecartes_cm2_'+key)||'null'); if(r && Date.now()-r.t < (r.p==null ? 3600*1000 : CM_TTL)) return r; }catch(e){}
  return null;
}
function cmCacheSet(key, p){ try{ localStorage.setItem('trocdecartes_cm2_'+key, JSON.stringify({p:p,t:Date.now()})); }catch(e){} }
function paintPrice(cardId, price){
  var t = document.querySelector('.tile[data-card-id="'+cardId+'"] .tprice');
  if(t) t.textContent = (price!=null) ? ('Moy. '+fmtEur(price)) : '';
}
var CM_EXP = { pgo:'PGO', sv3pt5:'MEW', cel25:'CEL', me55:'' };
function paintMissing(card){
  var t = document.querySelector('.tile[data-card-id="'+card.id+'"] .tprice');
  if(!t) return;
  var ref = cardApiRef(card);
  var num = String((ref && ref.num) || card.number || '').replace(/\D/g,'').padStart(3,'0');
  var exp = (ref && CM_EXP[ref.code]) || '';
  var q = (card.name||'') + ' ' + (exp ? exp+num : num);
  t.innerHTML = '<a href="https://www.cardmarket.com/fr/Pokemon/Products/Search?searchString='+encodeURIComponent(q.trim())+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Prix indisponible ici : chercher sur Cardmarket">Voir Cardmarket ↗</a>';
}
function pickCmPrice(cm){
  if(!cm) return null;
  var keys = ['avg','avg-holo','trend','trend-holo','avg30','avg30-holo'];
  for(var i=0;i<keys.length;i++){ var v = cm[keys[i]]; if(typeof v==='number' && v>0) return v; }
  return null;
}
async function fetchJson(url, ms){
  try{
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, ms||12000);
    var res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(to);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function tcgdexSetCards(code){
  if(tcgdexSetCache[code]) return tcgdexSetCache[code];
  var set = null;
  if(TCGDEX_SET_MAP[code]) set = await fetchJson(TCGDEX+'sets/'+TCGDEX_SET_MAP[code]);
  if(!set){
    // recherche par nom dans la liste des sets (ex. set des 30 ans)
    var re = null;
    if(code==='me55') re = function(n){ return /30/.test(n) && /c[ée]l[ée]bration/i.test(n) && !/classi/i.test(n); };
    if(re){
      var list = await fetchJson(TCGDEX+'sets', 20000);
      var found = (list||[]).find(function(x){ return re(x.name||''); });
      if(found) set = await fetchJson(TCGDEX+'sets/'+found.id);
    }
  }
  var cards = (set && set.cards) ? set.cards : [];
  tcgdexSetCache[code] = cards;
  return cards;
}
async function runPool(items, worker, size){
  var i = 0;
  async function next(){ while(i<items.length){ var it = items[i++]; await worker(it); } }
  var ws = []; for(var k=0;k<Math.min(size,items.length);k++) ws.push(next());
  await Promise.all(ws);
}
async function loadCardmarketPrices(cards){
  var pending = [];
  cards.forEach(function(c){
    var ref = cardApiRef(c);
    if(!ref){ paintMissing(c); return; }
    var cached = cmCacheGet(ref.id);
    if(cached){ if(cached.p!=null) paintPrice(c.id, cached.p); else paintMissing(c); return; }
    pending.push({ cardId:c.id, card:c, ref:ref, price:null });
  });
  if(!pending.length) return;

  // 1) TCGdex : prix Cardmarket (moyen) carte par carte
  var byCode = {};
  pending.forEach(function(w){ (byCode[w.ref.code] = byCode[w.ref.code]||[]).push(w); });
  for(var code in byCode){
    var setCards = await tcgdexSetCards(code);
    if(!setCards.length) continue;
    var idx = {};
    setCards.forEach(function(sc){ idx[normNum(sc.localId)] = sc.id; });
    await runPool(byCode[code], async function(w){
      var tid = idx[normNum(w.ref.num)];
      if(!tid) return;
      var d = await fetchJson(TCGDEX+'cards/'+encodeURIComponent(tid));
      var v = pickCmPrice(d && d.pricing && d.pricing.cardmarket);
      if(v!=null){ w.price = v; cmCacheSet(w.ref.id, v); paintPrice(w.cardId, v); }
    }, 6);
  }

  // 2) Secours : pokemontcg.io pour ce qui n'a pas de prix
  var rest = pending.filter(function(w){ return w.price==null; });
  for(var i=0; i<rest.length; i+=40){
    var chunk = rest.slice(i, i+40);
    var q = chunk.map(function(w){ return 'id:"'+w.ref.id+'"'; }).join(' OR ');
    var json = await fetchJson('https://api.pokemontcg.io/v2/cards?pageSize=250&select=id,cardmarket&q='+encodeURIComponent(q), 15000);
    var byId = {};
    ((json && json.data)||[]).forEach(function(d){
      var pr = d.cardmarket && d.cardmarket.prices;
      var v = pr ? (pr.averageSellPrice!=null ? pr.averageSellPrice : (pr.trendPrice!=null ? pr.trendPrice : null)) : null;
      byId[d.id] = (typeof v==='number' && v>0) ? v : null;
    });
    chunk.forEach(function(w){
      var v = byId.hasOwnProperty(w.ref.id) ? byId[w.ref.id] : null;
      if(json) cmCacheSet(w.ref.id, v);   // on ne mémorise l'absence que si l'API a répondu
      if(v!=null){ w.price = v; paintPrice(w.cardId, v); }
    });
  }
  // Toujours sans prix : lien direct vers Cardmarket
  pending.forEach(function(w){ if(w.price==null) paintMissing(w.card); });
}

function updateMissingFilter(){
  var grid = qs('card-grid'), btn = qs('filter-missing-btn'), msg = qs('no-missing');
  if(!grid || !btn) return;
  if(state.onlyMissing === undefined){
    try{ state.onlyMissing = localStorage.getItem('trocdecartes_only_missing')==='1'; }catch(e){ state.onlyMissing = false; }
  }
  var on = !!state.onlyMissing;
  grid.classList.toggle('only-missing', on);
  var total = grid.querySelectorAll('.tile').length;

function compareCardNumbers(a, b){
  var na = String(a.number||'').trim(), nb = String(b.number||'').trim();
  var da = /^\d/.test(na), db = /^\d/.test(nb);
  if(da !== db) return da ? -1 : 1; // les numéros commençant par un chiffre d'abord, puis ceux à lettres
  return na.localeCompare(nb, 'fr', { numeric:true, sensitivity:'base' });
}

async function quickAdd(card, variantKey){
  var tileEl = document.querySelector('.tile[data-card-id="'+card.id+'"]');
  var mine = state.userCardMap[card.id] = state.userCardMap[card.id] || {};
  var existing = mine[variantKey];
  var newQty = (existing ? existing.quantity : 0) + 1;
  var newPrice = existing ? existing.price : null;
  if(newQty>1 && newPrice==null) newPrice = DEFAULT_PRICES[variantKey];
  if(existing){
    await apiUpdate('trocdecartes_user_cards', 'id=eq.'+existing.id, { quantity: newQty, price: newPrice });
    existing.quantity = newQty; existing.price = newPrice;
  } else {
    var inserted = await apiInsert('trocdecartes_user_cards', [{ user_id: state.user.id, card_id: card.id, variant:variantKey, quantity: newQty, price: newPrice }]);
    var newId = inserted && inserted[0] ? inserted[0].id : null;
    mine[variantKey] = { id: newId, variant:variantKey, quantity: newQty, price: newPrice };
  }
  if(!tileEl) return;
  var relevant = relevantVariantKeys(card.rarity);
  var totalQty = relevant.reduce(function(s,k){ return s + (mine[k] ? mine[k].quantity : 0); }, 0);
  var complete = relevant.every(function(k){ return mine[k] && mine[k].quantity>0; });
  var hasFriendDup = !!(state.friendDupMap[card.id] && state.friendDupMap[card.id].length);
  tileEl.className = 'tile ' + (totalQty>0 ? 'owned' : (hasFriendDup ? 'friend' : 'missing')) + (complete?' complete-gold':'');
  var chipsEl = tileEl.querySelector('.tile-variants');
  if(chipsEl) chipsEl.innerHTML = variantChips(mine, relevant);
  updateMissingFilter();
}

async function getLockedMap(){

function openCsvImportModal(collectionId){
  openModal(
    '<h3>Importer un CSV</h3>'+
    '<p class="muted" style="margin-bottom:12px;">Colonnes attendues : <b>number,name,image_url,rarity</b> (avec en-tête). Rareté : Normal, Reverse ou Holo. Les cartes dont le numéro existe déjà dans cette collection sont mises à jour ; les autres sont ajoutées.</p>'+
    '<label class="filepick" id="csv-pick">Choisir un fichier CSV<input type="file" id="csv-file" accept=".csv" style="display:none;"></label>'+
    '<div id="csv-status" class="muted"></div>'+
    '<button class="btn-primary" id="csv-save" disabled>Importer</button>'
  );
  var parsed = null;
  qs('csv-file').onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete: function(res){
        var fields = res.meta.fields || [];
        function findField(candidates){
          for(var i=0;i<fields.length;i++){
            var norm = fields[i].toLowerCase().replace(/[\s_-]/g,'');
            if(candidates.indexOf(norm)!==-1) return fields[i];
          }
          return null;
        }
        var fNum = findField(['number','no','num','numero','cardnumber']);
        var fName = findField(['name','nom','cardname']);
        var fImg = findField(['imageurl','image','img','imgurl','url','picture','photo','lien']);
        var fRarity = findField(['rarity','rarete','rareté','rare']);
        parsed = res.data.map(function(r){
          var rawRarity = fRarity ? String(r[fRarity]||'').trim().toLowerCase() : '';
          var rarity = RARITIES.find(function(rr){ return rr.toLowerCase()===rawRarity; }) || 'Normal';
          return {
            collection_id: collectionId,
            number: fNum ? String(r[fNum]||'').trim() : '',
            name: fName ? String(r[fName]||'').trim() : '',
            image_url: fImg ? String(r[fImg]||'').trim() : '',
            rarity: rarity
          };
        }).filter(function(r){ return r.number && r.name; });
        var withImg = parsed.filter(function(r){ return r.image_url; }).length;
        var statusHtml = parsed.length + ' cartes détectées, ' + withImg + ' avec image.';
        if(!fImg) statusHtml += '<br><span style="color:var(--missing);">Colonne image non reconnue dans le CSV — les cartes seront importées sans image.</span>';
        else if(withImg < parsed.length) statusHtml += '<br><span style="color:var(--friend);">'+(parsed.length-withImg)+' carte(s) sans lien image dans le fichier.</span>';
        if(!fRarity) statusHtml += '<br><span style="color:var(--friend);">Colonne rareté non reconnue — toutes les cartes seront en "Normal".</span>';
        qs('csv-status').innerHTML = statusHtml;
        qs('csv-save').disabled = !parsed.length;
      }
    });
  };
  qs('csv-save').onclick = async function(){
    if(!parsed || !parsed.length) return;
    qs('csv-save').disabled = true; qs('csv-save').textContent = 'Import en cours…';
    var existingCards = await apiSelect('trocdecartes_cards', 'collection_id=eq.'+collectionId+'&select=id,number');
    var existingMap = {}; existingCards.forEach(function(c){ existingMap[c.number] = c.id; });
    var toInsert = [];
    for(var i=0;i<parsed.length;i++){
      var row = parsed[i];
      var existingId = existingMap[row.number];
      if(existingId){
        await apiUpdate('trocdecartes_cards', 'id=eq.'+existingId, { name: row.name, image_url: row.image_url, rarity: row.rarity });
      } else {
        toInsert.push(row);
      }
    }
    var chunk = 200;
    for(var j=0;j<toInsert.length;j+=chunk){
      await apiInsert('trocdecartes_cards', toInsert.slice(j,j+chunk));
    }
    closeModal();
    renderCollection(collectionId);
  };
}

async function openCardModal(card){
  var mineAll = state.userCardMap[card.id] || {};
  var dupFriends = state.friendDupMap[card.id] || [];
  var relevantKeys = relevantVariantKeys(card.rarity);
  var relevantVariants = VARIANTS.filter(function(v){ return relevantKeys.indexOf(v.key)!==-1; });

  var qtyState = {}, forceState = {};
  relevantVariants.forEach(function(v){
    qtyState[v.key] = mineAll[v.key] ? mineAll[v.key].quantity : 0;
    forceState[v.key] = mineAll[v.key] ? !!mineAll[v.key].for_sale : false;
  });

  var variantRows = relevantVariants.map(function(v){
    var row = mineAll[v.key] || { quantity:0, price:null, for_sale:false };
    var priceVisible = row.quantity>1 || (row.quantity>=1 && row.for_sale);
    return '<div class="variant-block">'+
      '<div class="variant-head">'+v.label+'</div>'+
      '<div class="qty-row"><button data-vminus="'+v.key+'">−</button><span class="qtyval" id="qty-val-'+v.key+'">'+row.quantity+'</span><button data-vplus="'+v.key+'">+</button></div>'+
      '<label class="force-sale-row" id="force-row-'+v.key+'" style="'+(row.quantity>=1?'':'display:none;')+'"><input type="checkbox" id="m-force-'+v.key+'" '+(row.for_sale?'checked':'')+'> Forcer la mise en vente (même sans doublon)</label>'+
      '<div class="field price-field-'+v.key+'" style="'+(priceVisible?'':'display:none;')+'"><label>Prix par exemplaire en vente ('+v.label+')</label><input type="number" min="0" step="0.5" id="m-price-'+v.key+'" value="'+(row.price!=null?row.price:'')+'" placeholder="2.50"></div>'+
    '</div>';
  }).join('');

  openModal(
    '<h3 style="text-align:center;">'+esc(card.name)+' <span class="muted">#'+esc(card.number)+'</span></h3>'+
    '<p class="muted" style="text-align:center;margin-bottom:10px;">Rareté : '+esc(card.rarity||'Normal')+'</p>'+
    '<div class="card-preview"><img src="'+(card.image_url?esc(card.image_url):PLACEHOLDER_IMG)+'" onerror="this.onerror=null;this.src=window.TROC_PLACEHOLDER;"></div>'+
    (state.isAdmin ? '<button class="btn-ghost" id="edit-card-btn" style="width:100%;margin-bottom:14px;font-size:12px;">✎ Modifier nom / numéro / image / rareté</button><button class="btn-danger" id="delete-card-btn" style="width:100%;margin-bottom:14px;font-size:12px;">🗑 Supprimer cette carte</button>' : '')+
    variantRows+
    '<button class="btn-primary" id="qty-save">Enregistrer</button>'+
    '<div class="friendlist">'+
      '<h4>Chez tes amis (doublons)</h4>'+
      (dupFriends.length ? dupFriends.map(function(f){
        return '<div class="frow"><span class="fname">'+esc(f.username)+' <span class="muted">'+variantLabel(f.variant)+' (x'+f.quantity+')</span></span>'+
          '<span class="fprice">'+(f.price!=null ? f.price+' €' : 'prix ?')+'</span>'+
          '<button data-fid="'+f.friend_id+'" data-variant="'+f.variant+'" data-price="'+(f.price!=null?f.price:0)+'" class="add-cart-btn" '+(f.price==null?'disabled':'')+'>Panier</button></div>';
      }).join('') : '<p class="muted">Aucun ami n\'a de doublon de cette carte.</p>')+
    '</div>'
  );

  if(qs('edit-card-btn')) qs('edit-card-btn').onclick = function(){ openEditCardModal(card); };
  if(qs('delete-card-btn')) qs('delete-card-btn').onclick = function(){ openDeleteCardModal(card); };

  function refresh(v){
    qs('qty-val-'+v).textContent = qtyState[v];
    var fr = qs('force-row-'+v);
    if(fr) fr.style.display = qtyState[v]>=1 ? '' : 'none';
    var pf = document.querySelector('.price-field-'+v);
    var priceVisible = qtyState[v]>1 || (qtyState[v]>=1 && forceState[v]);
    if(pf) pf.style.display = priceVisible ? '' : 'none';
    var priceInput = qs('m-price-'+v);
    if(priceInput && priceVisible && priceInput.value===''){ priceInput.value = DEFAULT_PRICES[v]; }
  }
  document.querySelectorAll('[data-vminus]').forEach(function(btn){
    btn.onclick = function(){ var v=btn.getAttribute('data-vminus'); if(qtyState[v]>0){ qtyState[v]--; if(qtyState[v]===0) forceState[v]=false; refresh(v); } };
  });
  document.querySelectorAll('[data-vplus]').forEach(function(btn){
    btn.onclick = function(){ var v=btn.getAttribute('data-vplus'); qtyState[v]++; refresh(v); };
  });
  relevantVariants.forEach(function(v){
    var cb = qs('m-force-'+v.key);
    if(cb) cb.onchange = function(){ forceState[v.key] = cb.checked; refresh(v.key); };
  });

  qs('qty-save').onclick = async function(){
    var existing = await apiSelect('trocdecartes_user_cards', 'user_id=eq.'+state.user.id+'&card_id=eq.'+card.id+'&select=id,variant');
    for(var i=0;i<relevantVariants.length;i++){
      var v = relevantVariants[i].key;
      var priceVisible = qtyState[v]>1 || (qtyState[v]>=1 && forceState[v]);
      var priceInput = qs('m-price-'+v);
      var price = priceInput && priceVisible && priceInput.value!=='' ? parseFloat(priceInput.value) : null;
      var forSale = qtyState[v]>=1 ? forceState[v] : false;
      var row = existing.find(function(r){ return r.variant===v; });
      if(row){
        await apiUpdate('trocdecartes_user_cards', 'id=eq.'+row.id, { quantity: qtyState[v], price: price, for_sale: forSale });
      } else if(qtyState[v]>0) {
        await apiInsert('trocdecartes_user_cards', [{ user_id: state.user.id, card_id: card.id, variant: v, quantity: qtyState[v], price: price, for_sale: forSale }]);
      }
    }
    closeModal();
    refreshKeepScroll();
  };

  document.querySelectorAll('.add-cart-btn').forEach(function(btn){
    btn.onclick = function(){
      var fid = btn.getAttribute('data-fid');
      var variant = btn.getAttribute('data-variant');
      var price = parseFloat(btn.getAttribute('data-price'))||0;
      var friend = dupFriends.find(function(f){ return f.friend_id===fid && f.variant===variant; });
      addToCart({ cardId: card.id, cardName: card.name, cardImg: card.image_url, collectionName: (state.collections.find(function(c){return c.id===state.currentCollectionId;})||{}).name||'', sellerId: fid, sellerUsername: friend?friend.username:'', price: price, variant: variant });
      btn.textContent = 'Ajouté ✓'; btn.disabled = true;
    };
  });
}
