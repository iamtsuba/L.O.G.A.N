<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pokeshop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23E3350D' stroke='%2314161B' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%2314161B' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%2314161B' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23F7F5EF' stroke='%2314161B' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ink:#14161B;
  --panel:#1D2027;
  --panel-raised:#262A33;
  --paper:#F7F5EF;
  --paper-dim:#EAE6DA;
  --pokered:#E3350D;
  --pokered-dark:#B32A0B;
  --gold:#F4C430;
  --owned:#3FA96A;
  --owned-bg:#1D3327;
  --missing:#D9534F;
  --missing-bg:#33201F;
  --friend:#F2994A;
  --friend-bg:#3A2A16;
  --line:#333844;
  --text:#F1EFE7;
  --text-dim:#A6ABBA;
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);min-height:100%;}
body{padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3{font-family:'Rubik',sans-serif;margin:0;}
.brand{font-family:'Rubik Mono One',sans-serif;letter-spacing:0.5px;}
a{color:inherit;}
button{font-family:'Rubik',sans-serif;cursor:pointer;border:none;border-radius:10px;font-weight:700;}
input,select{font-family:'Inter',sans-serif;}
::selection{background:var(--gold);color:var(--ink);}

/* ---- topbar ---- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--ink) 0%,rgba(20,22,27,0.96) 100%);
  border-bottom:2px solid var(--pokered);
}
#topbar .ball{width:26px;height:26px;flex:0 0 auto;}
#topbar .title{font-size:17px;color:var(--paper);flex:1;}
#topbar .navbtn{
  background:none;color:var(--text-dim);padding:8px 10px;border-radius:8px;font-size:13px;
  display:flex;align-items:center;gap:6px;
}
#topbar .navbtn.active,#topbar .navbtn:hover{background:var(--panel-raised);color:var(--paper);}
#topbar .badge{
  background:var(--pokered);color:#fff;border-radius:20px;font-size:11px;padding:1px 6px;
  font-family:'Inter',sans-serif;font-weight:700;
}
#userchip{font-size:12px;color:var(--text-dim);padding:6px 10px;background:var(--panel);border-radius:8px;}

main{max-width:1040px;margin:0 auto;padding:22px 16px 60px;}

/* ---- auth screen ---- */
#auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);border:2px solid var(--line);
  border-radius:18px;padding:30px 26px;
}
.auth-card .ball-big{width:56px;height:56px;margin:0 auto 10px;display:block;}
.auth-card h1{text-align:center;font-size:24px;color:var(--paper);margin-bottom:2px;}
.auth-card p.sub{text-align:center;color:var(--text-dim);font-size:13px;margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.field input:focus{outline:none;border-color:var(--gold);}
.btn-primary{width:100%;padding:12px;background:var(--pokered);color:#fff;border-radius:10px;font-size:15px;margin-top:4px;}
.btn-primary:hover{background:var(--pokered-dark);}
.switch-mode{text-align:center;margin-top:16px;font-size:13px;color:var(--text-dim);}
.switch-mode button{background:none;color:var(--gold);font-size:13px;padding:0;}
.auth-error{background:var(--missing-bg);color:#ffb3af;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}

/* ---- home / collections ---- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.section-head h2{font-size:20px;color:var(--paper);}
.btn-gold{background:var(--gold);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--panel-raised);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-ghost:hover{background:var(--line);}

.coll-list{display:flex;flex-direction:column;gap:10px;}
.coll-row{
  display:flex;align-items:center;gap:16px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s;
}
.coll-row:hover{border-color:var(--gold);}
.coll-row .cnum{
  width:40px;height:40px;border-radius:50%;background:var(--panel-raised);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:'Rubik',sans-serif;font-weight:700;font-size:14px;flex:0 0 auto;
}
.coll-row .cinfo{flex:1;min-width:0;}
.coll-row .cinfo h3{font-size:16px;color:var(--paper);}
.coll-row .cinfo .csub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.coll-row .cprog{width:120px;flex:0 0 auto;}
.progress-track{height:8px;border-radius:6px;background:var(--panel-raised);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pokered),var(--gold));border-radius:6px;}
.cprog .pct{font-size:12px;color:var(--text-dim);text-align:right;margin-top:4px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .ball-big{width:44px;height:44px;margin:0 auto 14px;opacity:.6;}

/* ---- collection detail ---- */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:10px;background:none;padding:0;}
.backlink:hover{color:var(--paper);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;
}
.tile{
  border-radius:12px;padding:8px;cursor:pointer;position:relative;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .1s;
}
.tile:hover{transform:translateY(-2px);}
.tile.owned{background:var(--owned-bg);border-color:var(--owned);}
.tile.missing{background:var(--missing-bg);border-color:var(--missing);}
.tile.friend{background:var(--friend-bg);border-color:var(--friend);}
.tile img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:7px;background:var(--panel-raised);margin-bottom:6px;}
.tile .tnum{font-size:10px;color:var(--text-dim);}
.tile .tname{font-size:11.5px;color:var(--text);line-height:1.25;margin-top:1px;}
.tile .dupbadge{
  position:absolute;top:4px;right:4px;background:var(--ink);color:var(--gold);font-size:10px;
  border-radius:20px;padding:1px 6px;font-weight:700;
}

/* ---- modal ---- */
#modal-layer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;}
#modal-layer.show{display:flex;}
#modal-backdrop{position:absolute;inset:0;background:rgba(10,11,14,0.72);}
.modal-box{
  position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;
}
.modal-box h3{font-size:18px;color:var(--paper);margin-bottom:16px;}
.modal-close{position:absolute;top:14px;right:14px;background:none;color:var(--text-dim);width:28px;height:28px;border-radius:8px;font-size:16px;}
.modal-close:hover{background:var(--panel-raised);color:var(--paper);}
.qty-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0;}
.qty-row button{width:38px;height:38px;border-radius:10px;background:var(--panel-raised);color:var(--paper);font-size:18px;}
.qty-row button:hover{background:var(--line);}
.qty-row .qtyval{font-size:22px;font-weight:700;min-width:34px;text-align:center;}
.card-preview{width:120px;margin:0 auto 12px;display:block;}
.card-preview img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:10px;background:var(--panel-raised);}
.friendlist{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;}
.friendlist h4{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;font-weight:600;}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.frow:last-child{border-bottom:none;}
.frow .fname{flex:1;font-size:13.5px;}
.frow .fprice{font-size:13px;color:var(--gold);font-weight:700;}
.frow button{padding:6px 10px;font-size:11.5px;background:var(--pokered);color:#fff;border-radius:7px;}
.frow button:disabled{background:var(--line);color:var(--text-dim);cursor:default;}
.muted{color:var(--text-dim);font-size:12.5px;}

/* ---- friends page ---- */
.searchbar{display:flex;gap:8px;margin-bottom:22px;}
.searchbar input{flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.searchbar input:focus{outline:none;border-color:var(--gold);}
.frow2{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.frow2 .favatar{width:34px;height:34px;border-radius:50%;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);flex:0 0 auto;}
.frow2 .fmain{flex:1;}
.frow2 .fmain .fu{font-size:14px;color:var(--paper);}
.frow2 .fmain .fs{font-size:11.5px;color:var(--text-dim);}
.tag-pending{font-size:11px;color:var(--gold);background:var(--panel-raised);padding:3px 8px;border-radius:20px;}

/* ---- cart / inbox ---- */
.cart-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.cart-item img{width:38px;aspect-ratio:5/7;object-fit:cover;border-radius:6px;background:var(--panel-raised);}
.cart-item .ci-main{flex:1;}
.cart-item .ci-main .cin{font-size:13.5px;color:var(--paper);}
.cart-item .ci-main .cis{font-size:11.5px;color:var(--text-dim);}
.cart-item .ciprice{font-size:14px;color:var(--gold);font-weight:700;}
.cart-item .cirm{background:none;color:var(--missing);font-size:18px;padding:4px 8px;}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:15px;color:var(--paper);border-top:1px solid var(--line);padding-top:14px;}
.order-card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.order-card .ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .ohead .ofrom{font-size:14px;color:var(--paper);font-weight:600;}
.order-card .ohead .odate{font-size:11.5px;color:var(--text-dim);}
.order-card .oitems{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.order-card .ototal{margin-top:8px;font-size:14px;color:var(--gold);font-weight:700;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pokered);display:inline-block;margin-right:6px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;}
.tab{background:var(--panel);color:var(--text-dim);padding:8px 14px;border-radius:9px;font-size:13px;}
.tab.active{background:var(--gold);color:var(--ink);}

/* ---- csv/import modal helpers ---- */
textarea{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}
.filepick{display:block;width:100%;padding:14px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;margin-bottom:14px;}
.filepick:hover{border-color:var(--gold);color:var(--paper);}

@media (max-width:480px){
  #topbar .navbtn span.lbl{display:none;}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));}
}
</style>
</head>

<script>
(function(){
"use strict";

var SUPABASE_URL = "https://tkimdlsokrqdfpkfapgc.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRraW1kbHNva3JxZGZwa2ZhcGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODAwMjIsImV4cCI6MjA5NTk1NjAyMn0.WRHXtuRXkcgqJuUqrfVAHlk6grSJzo13sJ7101yPLl8";
var DB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var BALL_SVG = '<svg class="ball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="44" fill="#E3350D" stroke="#14161B" stroke-width="5"/><path d="M6 50h88" stroke="#14161B" stroke-width="5"/><path d="M50 6a44 44 0 0 1 44 44H50z" fill="#E3350D"/><path d="M50 94a44 44 0 0 1-44-44h44z" fill="#F7F5EF"/><circle cx="50" cy="50" r="14" fill="#F7F5EF" stroke="#14161B" stroke-width="5"/><circle cx="50" cy="50" r="6" fill="#F7F5EF"/></svg>';

var state = {
  user: null,
  view: 'home',        // home | collection | friends | cart | inbox
  collections: [],
  currentCollectionId: null,
  currentCollectionCards: [],
  userCardMap: {},      // card_id -> {quantity, price}
  friendDupMap: {},      // card_id -> [{friend_id, username, price}]
  friends: [],           // accepted friends [{id, username}]
  friendRows: [],        // raw pokeshop_friends rows involving me
  cart: [],
  inbox: [],
  sent: [],
  inboxTab: 'received'
};

function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function qs(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function sha256(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('pokeshop::'+str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

function loadSession(){
  try{
    var raw = localStorage.getItem('pokeshop_session');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveSession(u){ localStorage.setItem('pokeshop_session', JSON.stringify(u)); }
function clearSession(){ localStorage.removeItem('pokeshop_session'); }
function loadCart(){
  try{ var raw = localStorage.getItem('pokeshop_cart'); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
}
function saveCart(){ localStorage.setItem('pokeshop_cart', JSON.stringify(state.cart)); }

/* ============ DATA LAYER ============ */

async function apiSelect(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiInsert(table, rows, opts){
  opts = opts || {};
  var url = SUPABASE_URL + '/rest/v1/' + table + (opts.upsertOn ? '?on_conflict='+opts.upsertOn : '');
  var headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer: 'return=representation' + (opts.upsertOn ? ',resolution=merge-duplicates' : '') };
  var res = await fetch(url, { method:'POST', headers: headers, body: JSON.stringify(rows) });
  if(!res.ok){ var t = await res.text(); if(res.status!==409) throw new Error(t); return null; }
  return res.json();
}
async function apiUpdate(table, query, patch){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'PATCH', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'return=representation' }, body: JSON.stringify(patch) });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiDelete(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'DELETE', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return true;
}

/* ============ AUTH ============ */

function renderAuth(mode, error){
  mode = mode || 'login';
  var app = qs('app');
  app.innerHTML = '';
  var wrap = el('<div id="auth-wrap"></div>');
  var card = el(
    '<div class="auth-card">'+
      '<div class="ball-big">'+BALL_SVG+'</div>'+
      '<h1 class="brand" style="font-size:20px;">THE POKESHOP</h1>'+
      '<p class="sub">'+(mode==='login' ? 'Connecte-toi à ta collection' : 'Crée ton compte de dresseur')+'</p>'+
      (error ? '<div class="auth-error">'+esc(error)+'</div>' : '')+
      '<div id="auth-fields"></div>'+
      '<button class="btn-primary" id="auth-submit">'+(mode==='login'?'Se connecter':"S'inscrire")+'</button>'+
      '<div class="switch-mode">'+
        (mode==='login' ? "Pas encore de compte ? " : "Déjà un compte ? ")+
        '<button id="auth-switch">'+(mode==='login' ? "S'inscrire" : 'Se connecter')+'</button>'+
      '</div>'+
    '</div>'
  );
  wrap.appendChild(card);
  app.appendChild(wrap);

  var fields = qs('auth-fields');
  if(mode==='register'){
    fields.innerHTML =
      '<div class="field"><label>Pseudo</label><input id="f-username" autocomplete="username" placeholder="Sacha"></div>'+
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" placeholder="toi@exemple.com"></div>'+
      '<div class="field"><label>Mot de passe</label><input id="f-password" type="password" autocomplete="new-password" placeholder="••••••••"></div>';
  } else {
    fields.innerHTML =
      '<div class="field"><label>Pseudo ou email</label><input id="f-identifier" autocomplete="username" placeholder="Sacha"></div>'+
      '<div class="field"><label>Mot de passe</label><input id="f-password" type="password" autocomplete="current-password" placeholder="••••••••"></div>';
  }

  qs('auth-switch').onclick = function(){ renderAuth(mode==='login'?'register':'login'); };
  qs('auth-submit').onclick = function(){ mode==='login' ? doLogin() : doRegister(); };
  card.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ mode==='login' ? doLogin() : doRegister(); } });
  });
}

async function doRegister(){
  var username = (qs('f-username').value||'').trim();
  var email = (qs('f-email').value||'').trim().toLowerCase();
  var password = qs('f-password').value||'';
  if(!username || !email || !password){ renderAuth('register','Remplis tous les champs.'); return; }
  if(password.length < 4){ renderAuth('register','Mot de passe trop court (4 caractères min).'); return; }
  try{
    var existing = await apiSelect('pokeshop_users', 'or=(username.eq.'+encodeURIComponent(username)+',email.eq.'+encodeURIComponent(email)+')&select=id');
    if(existing.length){ renderAuth('register','Ce pseudo ou cet email est déjà pris.'); return; }
    var hash = await sha256(password);
    var rows = await apiInsert('pokeshop_users', [{ username: username, email: email, password_hash: hash }]);
    if(!rows || !rows.length){ renderAuth('register','Inscription impossible, réessaie.'); return; }
    var u = rows[0];
    var sess = { id: u.id, username: u.username, email: u.email };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('register','Erreur : '+e.message); }
}

async function doLogin(){
  var identifier = (qs('f-identifier').value||'').trim();
  var password = qs('f-password').value||'';
  if(!identifier || !password){ renderAuth('login','Remplis tous les champs.'); return; }
  try{
    var hash = await sha256(password);
    var idEnc = encodeURIComponent(identifier.toLowerCase());
    var rows = await apiSelect('pokeshop_users', 'or=(username.ilike.'+encodeURIComponent(identifier)+',email.eq.'+idEnc+')&select=*');
    var u = rows.find(function(r){ return r.password_hash === hash; });
    if(!u){ renderAuth('login','Identifiants incorrects.'); return; }
    var sess = { id: u.id, username: u.username, email: u.email };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('login','Erreur : '+e.message); }
}

function doLogout(){ clearSession(); state.user = null; state.cart=[]; saveCart(); renderAuth('login'); }

function updateBadges(){
  var cb = qs('cart-badge'); if(cb){ if(state.cart.length){ cb.style.display='inline-block'; cb.textContent = state.cart.length; } else cb.style.display='none'; }
  var ib = qs('inbox-badge');
  if(ib){
    var unread = state.inbox.filter(function(m){ return !m.read; }).length;
    if(unread){ ib.style.display='inline-block'; ib.textContent = unread; } else ib.style.display='none';
  }
  document.querySelectorAll('.navbtn[data-nav]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav')===state.view);
  });
}

async function navigate(view, arg){
  state.view = view;
  if(view==='home') await renderHome();
  else if(view==='collection') await renderCollection(arg);
  else if(view==='friends') await renderFriends();
  else if(view==='cart') await renderCart();
  else if(view==='inbox') await renderInbox();
  updateBadges();
}

  main.innerHTML = '<div class="section-head"><h2>Tes collections</h2><button class="btn-gold" id="new-coll-btn">+ Nouvelle collection</button></div><div id="coll-list" class="coll-list"><p class="muted">Chargement…</p></div>';

  }

  var myCards = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&quantity=gt.0&select=card_id');
  var ownedSet = {}; myCards.forEach(function(r){ ownedSet[r.card_id]=true; });
  var cardIdToColl = {};
  var totalsByColl = {};

  var ownedByColl = {};
  cardCounts.forEach(function(c){ if(ownedSet[c.id]) ownedByColl[c.collection_id]=(ownedByColl[c.collection_id]||0)+1; });

  list.innerHTML = '';
  collections.forEach(function(c, idx){
    var total = totalsByColl[c.id]||0;
    var owned = ownedByColl[c.id]||0;

        '<div class="cnum">'+(idx+1)+'</div>'+

      '</div>'

/* ============ COLLECTION DETAIL ============ */

async function renderCollection(collectionId){
  state.currentCollectionId = collectionId;
  var coll = state.collections.find(function(c){ return c.id===collectionId; });
  var main = qs('main');
  main.innerHTML =
    '<button class="backlink" id="back-home">← Toutes les collections</button>'+
    '<div class="section-head"><h2>'+esc(coll ? coll.name : '')+'</h2>'+
      '<div style="display:flex;gap:8px;"><button class="btn-ghost" id="import-csv-btn">Importer CSV</button><button class="btn-gold" id="add-card-btn">+ Ajouter une carte</button></div>'+
    '</div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--owned);"></i>Possédée</span>'+
      '<span><i style="background:var(--friend);"></i>Un ami a un doublon</span>'+
      '<span><i style="background:var(--missing);"></i>Manquante</span>'+
    '</div>'+
    '<div id="card-grid" class="card-grid"><p class="muted">Chargement…</p></div>';

  qs('back-home').onclick = function(){ navigate('home'); };
  qs('add-card-btn').onclick = function(){ openAddCardModal(collectionId); };
  qs('import-csv-btn').onclick = function(){ openCsvImportModal(collectionId); };

  var cards = await apiSelect('pokeshop_cards', 'collection_id=eq.'+collectionId+'&select=*&order=number.asc');
  state.currentCollectionCards = cards;

  var myRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&select=card_id,quantity,price');
  var myMap = {}; myRows.forEach(function(r){ myMap[r.card_id] = r; });
  state.userCardMap = myMap;

  await ensureFriends();
  var friendDup = {};
  if(state.friends.length){
    var friendIds = state.friends.map(function(f){ return f.id; });
    var cardIds = cards.map(function(c){ return c.id; });
    if(cardIds.length){
      var dupRows = await apiSelect('pokeshop_user_cards',
        'user_id=in.('+friendIds.join(',')+')&card_id=in.('+cardIds.join(',')+')&quantity=gt.1&select=*');
      dupRows.forEach(function(r){
        var f = state.friends.find(function(ff){ return ff.id===r.user_id; });
        if(!f) return;
        (friendDup[r.card_id] = friendDup[r.card_id]||[]).push({ friend_id: r.user_id, username: f.username, price: r.price, quantity: r.quantity });
      });
    }
  }
  state.friendDupMap = friendDup;

  var grid = qs('card-grid');
  if(!cards.length){
    grid.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);margin-bottom:6px;">Aucune carte pour l\'instant</h3><p>Ajoute des cartes une par une ou importe un CSV (colonnes : number, name, image_url).</p></div>';
    return;
  }
  grid.innerHTML = '';
  cards.forEach(function(card){
    var mine = myMap[card.id];
    var qty = mine ? mine.quantity : 0;
    var hasFriendDup = !!(friendDup[card.id] && friendDup[card.id].length);
    var cls = qty>0 ? 'owned' : (hasFriendDup ? 'friend' : 'missing');
    var tile = el(
      '<div class="tile '+cls+'">'+
        (qty>1 ? '<span class="dupbadge">x'+qty+'</span>' : '')+
        '<img src="'+esc(card.image_url||'')+'" alt="" loading="lazy" onerror="this.style.opacity=0.25;">'+
        '<div class="tnum">#'+esc(card.number)+'</div>'+
        '<div class="tname">'+esc(card.name)+'</div>'+
      '</div>'
    );
    tile.onclick = function(){ openCardModal(card); };
    grid.appendChild(tile);
  });
}

async function ensureFriends(){
  var rows = await apiSelect('pokeshop_friends',
    'or=(user_id.eq.'+state.user.id+',friend_id.eq.'+state.user.id+')&status=eq.accepted&select=*');
  state.friendRows = rows;
  var otherIds = rows.map(function(r){ return r.user_id===state.user.id ? r.friend_id : r.user_id; });
  if(!otherIds.length){ state.friends = []; return; }
  var users = await apiSelect('pokeshop_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
  state.friends = users;
}

function openCsvImportModal(collectionId){
  openModal(
    '<h3>Importer un CSV</h3>'+
    '<p class="muted" style="margin-bottom:12px;">Colonnes attendues : <b>number,name,image_url</b> (avec en-tête).</p>'+
    '<label class="filepick" id="csv-pick">Choisir un fichier CSV<input type="file" id="csv-file" accept=".csv" style="display:none;"></label>'+
    '<div id="csv-status" class="muted"></div>'+
    '<button class="btn-primary" id="csv-save" disabled>Importer</button>'
  );
  var parsed = null;
  qs('csv-file').onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete: function(res){
        parsed = res.data.filter(function(r){ return r.number && r.name; }).map(function(r){
          return { collection_id: collectionId, number: String(r.number).trim(), name: String(r.name).trim(), image_url: (r.image_url||'').trim() };
        });
        qs('csv-status').textContent = parsed.length + ' cartes détectées.';
        qs('csv-save').disabled = !parsed.length;
      }
    });
  };
  qs('csv-save').onclick = async function(){
    if(!parsed || !parsed.length) return;
    qs('csv-save').disabled = true; qs('csv-save').textContent = 'Import en cours…';
    var chunk = 200;
    for(var i=0;i<parsed.length;i+=chunk){
      await apiInsert('pokeshop_cards', parsed.slice(i,i+chunk));
    }
    closeModal();
    renderCollection(collectionId);
  };
}

async function openCardModal(card){
  var mine = state.userCardMap[card.id] || { quantity:0, price:null };
  var dupFriends = state.friendDupMap[card.id] || [];
  var qty = mine.quantity||0;

  openModal(
    '<h3 style="text-align:center;">'+esc(card.name)+' <span class="muted">#'+esc(card.number)+'</span></h3>'+
    '<div class="card-preview"><img src="'+esc(card.image_url||'')+'" onerror="this.style.opacity=0.25;"></div>'+
    '<p class="muted" style="text-align:center;">Ta quantité</p>'+
    '<div class="qty-row"><button id="qty-minus">−</button><span class="qtyval" id="qty-val">'+qty+'</span><button id="qty-plus">+</button></div>'+
    '<div id="price-field" style="'+(qty>1?'':'display:none;')+'">'+
      '<div class="field"><label>Prix de revente (par doublon)</label><input id="m-dup-price" type="number" min="0" step="0.5" value="'+(mine.price!=null?mine.price:'')+'" placeholder="2.50"></div>'+
    '</div>'+
    '<button class="btn-primary" id="qty-save">Enregistrer</button>'+
    '<div class="friendlist">'+
      '<h4>Chez tes amis (doublons)</h4>'+
      (dupFriends.length ? dupFriends.map(function(f){
        return '<div class="frow"><span class="fname">'+esc(f.username)+' <span class="muted">(x'+f.quantity+')</span></span>'+
          '<span class="fprice">'+(f.price!=null ? f.price+' €' : 'prix ?')+'</span>'+
          '<button data-fid="'+f.friend_id+'" data-price="'+(f.price!=null?f.price:0)+'" class="add-cart-btn" '+(f.price==null?'disabled':'')+'>Panier</button></div>';
      }).join('') : '<p class="muted">Aucun ami n\'a de doublon de cette carte.</p>')+
    '</div>'
  );

  var qtyVal = qty;
  function refreshQty(){
    qs('qty-val').textContent = qtyVal;
    qs('price-field').style.display = qtyVal>1 ? '' : 'none';
  }
  qs('qty-minus').onclick = function(){ if(qtyVal>0){ qtyVal--; refreshQty(); } };
  qs('qty-plus').onclick = function(){ qtyVal++; refreshQty(); };

  qs('qty-save').onclick = async function(){
    var priceInput = qs('m-dup-price');
    var price = priceInput && qtyVal>1 && priceInput.value!=='' ? parseFloat(priceInput.value) : null;
    var existing = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&card_id=eq.'+card.id+'&select=id');
    if(existing.length){
      await apiUpdate('pokeshop_user_cards', 'id=eq.'+existing[0].id, { quantity: qtyVal, price: price });
    } else if(qtyVal>0) {
      await apiInsert('pokeshop_user_cards', [{ user_id: state.user.id, card_id: card.id, quantity: qtyVal, price: price }]);
    }
    closeModal();
    renderCollection(state.currentCollectionId);
  };

  document.querySelectorAll('.add-cart-btn').forEach(function(btn){
    btn.onclick = function(){
      var fid = btn.getAttribute('data-fid');
      var price = parseFloat(btn.getAttribute('data-price'))||0;
      var friend = dupFriends.find(function(f){ return f.friend_id===fid; });
      addToCart({ cardId: card.id, cardName: card.name, cardImg: card.image_url, collectionName: (state.collections.find(function(c){return c.id===state.currentCollectionId;})||{}).name||'', sellerId: fid, sellerUsername: friend?friend.username:'', price: price });
      btn.textContent = 'Ajouté ✓'; btn.disabled = true;
    };
  });
}

/* ============ FRIENDS ============ */

async function renderFriends(){
  await ensureFriends();
  var pendingIncoming = state.friendRows.length; // recomputed below with full set
  var allRows = await apiSelect('pokeshop_friends', 'or=(user_id.eq.'+state.user.id+',friend_id.eq.'+state.user.id+')&select=*');
  var otherIds = Array.from(new Set(allRows.map(function(r){ return r.user_id===state.user.id?r.friend_id:r.user_id; })));
  var usersMap = {};
  if(otherIds.length){
    var users = await apiSelect('pokeshop_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
    users.forEach(function(u){ usersMap[u.id]=u.username; });
  }

  var incoming = allRows.filter(function(r){ return r.friend_id===state.user.id && r.status==='pending'; });
  var outgoing = allRows.filter(function(r){ return r.user_id===state.user.id && r.status==='pending'; });
  var accepted = allRows.filter(function(r){ return r.status==='accepted'; });

  var main = qs('main');
  main.innerHTML =
    '<div class="section-head"><h2>Amis</h2></div>'+
    '<div class="searchbar"><input id="friend-search" placeholder="Chercher un pseudo…"><button class="btn-gold" id="friend-search-btn">Ajouter</button></div>'+
    '<div id="friend-search-results"></div>'+
    (incoming.length ? '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">Demandes reçues</h3><div id="incoming-list"></div>' : '')+
    (outgoing.length ? '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">Demandes envoyées</h3><div id="outgoing-list"></div>' : '')+
    '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">Tes amis</h3><div id="friends-list"></div>';

  qs('friend-search-btn').onclick = async function(){
    var term = (qs('friend-search').value||'').trim();
    if(!term) return;
    var found = await apiSelect('pokeshop_users', 'username=ilike.*'+encodeURIComponent(term)+'*&select=id,username&limit=8');
    found = found.filter(function(u){ return u.id!==state.user.id; });
    var box = qs('friend-search-results');
    if(!found.length){ box.innerHTML = '<p class="muted">Aucun dresseur trouvé.</p>'; return; }
    box.innerHTML = '';
    found.forEach(function(u){
      var already = allRows.find(function(r){ return (r.user_id===state.user.id&&r.friend_id===u.id)||(r.friend_id===state.user.id&&r.user_id===u.id); });
      var row = el('<div class="frow2"><div class="favatar">'+esc(u.username[0]||'?').toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(u.username)+'</div></div>'+
        (already ? '<span class="tag-pending">'+(already.status==='accepted'?'Déjà ami':'En attente')+'</span>' : '<button class="btn-gold" style="padding:7px 12px;font-size:12px;" data-add="'+u.id+'">Ajouter</button>')+
        '</div>');
      box.appendChild(row);
    });
    box.querySelectorAll('[data-add]').forEach(function(btn){
      btn.onclick = async function(){
        await apiInsert('pokeshop_friends', [{ user_id: state.user.id, friend_id: btn.getAttribute('data-add'), status:'pending' }]);
        renderFriends();
      };
    });
  };

  if(incoming.length){
    var il = qs('incoming-list');
    incoming.forEach(function(r){
      var row = el('<div class="frow2"><div class="favatar">'+esc((usersMap[r.user_id]||'?')[0]).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(usersMap[r.user_id]||'—')+'</div><div class="fs">veut être ami</div></div><button class="btn-gold" style="padding:7px 12px;font-size:12px;" data-acc="'+r.id+'">Accepter</button></div>');
      il.appendChild(row);
    });
    il.querySelectorAll('[data-acc]').forEach(function(btn){

      var row = el('<div class="frow2"><div class="favatar">'+esc((usersMap[otherId]||'?')[0]).toUpperCase()+'</div><div class="fmain"><div class="fu">'+esc(usersMap[otherId]||'—')+'</div></div></div>');
      fl.appendChild(row);
    });
  }
}

/* ============ CART ============ */

function addToCart(item){
  var dup = state.cart.find(function(c){ return c.cardId===item.cardId && c.sellerId===item.sellerId; });
  if(dup) return;
  state.cart.push(item);
  saveCart();
  updateBadges();
}

async function renderCart(){
  var main = qs('main');
  main.innerHTML = '<div class="section-head"><h2>Panier</h2></div><div id="cart-items"></div>';
  var box = qs('cart-items');
  if(!state.cart.length){
    box.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);">Panier vide</h3><p>Ajoute des cartes en visitant les collections d\'un ami.</p></div>';
    return;
  }
  state.cart.forEach(function(item, idx){
    var row = el(
      '<div class="cart-item">'+
        '<img src="'+esc(item.cardImg||'')+'" onerror="this.style.opacity=0.25;">'+
        '<div class="ci-main"><div class="cin">'+esc(item.cardName)+'</div><div class="cis">'+esc(item.collectionName)+' · vendeur : '+esc(item.sellerUsername)+'</div></div>'+
        '<div class="ciprice">'+item.price.toFixed(2)+' €</div>'+
        '<button class="cirm" data-idx="'+idx+'">×</button>'+
      '</div>'
    );
    box.appendChild(row);
  });
  box.querySelectorAll('.cirm').forEach(function(btn){
    btn.onclick = function(){ state.cart.splice(parseInt(btn.getAttribute('data-idx')),1); saveCart(); renderCart(); updateBadges(); };
  });
  var total = state.cart.reduce(function(s,i){ return s+i.price; },0);
  var totalRow = el('<div class="cart-total"><span>Total</span><span>'+total.toFixed(2)+' €</span></div>');
  box.appendChild(totalRow);
  var sendBtn = el('<button class="btn-primary" id="checkout-btn">Envoyer les commandes</button>');
  box.appendChild(sendBtn);
  qs('checkout-btn').onclick = checkout;
}

async function checkout(){
  if(!state.cart.length) return;
  var bySeller = {};
  state.cart.forEach(function(item){
    (bySeller[item.sellerId] = bySeller[item.sellerId]||[]).push(item);
  });
  var rows = Object.keys(bySeller).map(function(sellerId){
    var items = bySeller[sellerId];
    var total = items.reduce(function(s,i){return s+i.price;},0);
    return {
      from_user_id: state.user.id,
      to_user_id: sellerId,
      items: items.map(function(i){ return { card_name:i.cardName, collection:i.collectionName, price:i.price }; }),
      total: total,
      read: false
    };
  });
  await apiInsert('pokeshop_messages', rows);
  state.cart = [];
  saveCart();
  updateBadges();
  navigate('inbox');
}

/* ============ INBOX ============ */

async function renderInbox(){
  var received = await apiSelect('pokeshop_messages', 'to_user_id=eq.'+state.user.id+'&select=*&order=created_at.desc');
  var sent = await apiSelect('pokeshop_messages', 'from_user_id=eq.'+state.user.id+'&select=*&order=created_at.desc');
  state.inbox = received; state.sent = sent;

  var otherIds = Array.from(new Set(received.map(function(m){return m.from_user_id;}).concat(sent.map(function(m){return m.to_user_id;}))));
  var usersMap = {};
  if(otherIds.length){
    var users = await apiSelect('pokeshop_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
    users.forEach(function(u){ usersMap[u.id]=u.username; });
  }

  var main = qs('main');
  main.innerHTML =
    '<div class="section-head"><h2>Messagerie</h2></div>'+
    '<div class="tabs"><button class="tab '+(state.inboxTab==='received'?'active':'')+'" data-tab="received">Reçues</button><button class="tab '+(state.inboxTab==='sent'?'active':'')+'" data-tab="sent">Envoyées</button></div>'+
    '<div id="inbox-list"></div>';

  main.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ state.inboxTab = b.getAttribute('data-tab'); renderInbox(); };
  });

  var list = qs('inbox-list');
  var data = state.inboxTab==='received' ? received : sent;
  if(!data.length){ list.innerHTML = '<p class="muted">Rien ici pour l\'instant.</p>'; return; }
  data.forEach(function(m){
    var otherName = state.inboxTab==='received' ? (usersMap[m.from_user_id]||'—') : (usersMap[m.to_user_id]||'—');
    var date = new Date(m.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
    var itemsHtml = (m.items||[]).map(function(it){ return esc(it.card_name)+' ('+esc(it.collection)+') — '+it.price.toFixed(2)+' €'; }).join('<br>');
    var card = el(
      '<div class="order-card">'+
        '<div class="ohead"><span class="ofrom">'+(state.inboxTab==='received' && !m.read ? '<span class="unread-dot"></span>' : '')+(state.inboxTab==='received'?'De ':'À ')+esc(otherName)+'</span><span class="odate">'+date+'</span></div>'+
        '<div class="oitems">'+itemsHtml+'</div>'+
        '<div class="ototal">Total : '+m.total.toFixed(2)+' €</div>'+
        (state.inboxTab==='received' && !m.read ? '<button class="btn-ghost" style="margin-top:10px;font-size:11.5px;padding:6px 10px;" data-read="'+m.id+'">Marquer comme lu</button>' : '')+
      '</div>'
    );
    list.appendChild(card);
  });
  list.querySelectorAll('[data-read]').forEach(function(btn){
    btn.onclick = async function(){ await apiUpdate('pokeshop_messages', 'id=eq.'+btn.getAttribute('data-read'), { read:true }); renderInbox(); };
  });
}

/* ============ MODAL ============ */

function openModal(html){
  qs('modal-box').innerHTML = '<button class="modal-close" onclick="Pokeshop.closeModal()">×</button>'+html;
  qs('modal-layer').classList.add('show');
}
function closeModal(){ qs('modal-layer').classList.remove('show'); qs('modal-box').innerHTML=''; }

/* ============ BOOT ============ */

async function boot(){
  var sess = state.user || loadSession();
  if(!sess){ renderAuth('login'); return; }
  state.user = sess;
  state.cart = loadCart();
  renderShell();
  try{
    var inb = await apiSelect('pokeshop_messages', 'to_user_id=eq.'+state.user.id+'&read=eq.false&select=id');
    state.inbox = inb.map(function(r){ return {read:false}; });
  }catch(e){}
  updateBadges();
  navigate('home');
}

window.Pokeshop = { closeModal: closeModal };
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
