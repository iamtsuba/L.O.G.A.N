<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pokeshop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23E3350D' stroke='%2314161B' stroke-width='6'/%3E%3Cpath d='M4 50h92' stroke='%2314161B' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%2314161B' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23F7F5EF' stroke='%2314161B' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ink:#14161B;
  --panel:#1D2027;
  --panel-raised:#262A33;
  --paper:#F7F5EF;
  --paper-dim:#EAE6DA;
  --pokered:#E3350D;
  --pokered-dark:#B32A0B;
  --gold:#F4C430;
  --owned:#3FA96A;
  --owned-bg:#1D3327;
  --missing:#D9534F;
  --missing-bg:#33201F;
  --friend:#F2994A;
  --friend-bg:#3A2A16;
  --line:#333844;
  --text:#F1EFE7;
  --text-dim:#A6ABBA;
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);min-height:100%;}
body{padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px);}
h1,h2,h3{font-family:'Rubik',sans-serif;margin:0;}
.brand{font-family:'Rubik Mono One',sans-serif;letter-spacing:0.5px;}
a{color:inherit;}
button{font-family:'Rubik',sans-serif;cursor:pointer;border:none;border-radius:10px;font-weight:700;}
input,select{font-family:'Inter',sans-serif;}
::selection{background:var(--gold);color:var(--ink);}

/* ---- topbar ---- */
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--ink) 0%,rgba(20,22,27,0.96) 100%);
  border-bottom:2px solid var(--pokered);
}
#topbar .ball{width:24px;height:24px;flex:0 0 auto;}
#topbar .title{font-size:15px;color:var(--paper);flex:1;min-width:0;}
#topbar .navbtn{
  background:none;color:var(--text-dim);padding:7px 9px;border-radius:8px;font-size:12.5px;flex:0 0 auto;
}
#topbar .navbtn:hover{background:var(--panel-raised);color:var(--paper);}
#userchip{font-size:11.5px;color:var(--text-dim);padding:6px 9px;background:var(--panel);border-radius:8px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto;}

main{max-width:1040px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom,0px));}

/* ---- bottom nav ---- */
#bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  background:linear-gradient(0deg,var(--ink) 60%,rgba(20,22,27,0.97) 100%);
  border-top:2px solid var(--pokered);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border-radius:0;padding:9px 2px 8px;color:var(--text-dim);font-size:10.5px;font-weight:600;
}
.tabbtn .ticon{position:relative;width:23px;height:23px;}
.tabbtn .ticon svg{width:23px;height:23px;display:block;}
.tabbtn.active{color:var(--gold);}
.tabbtn:active{background:var(--panel-raised);}
.tbadge{
  position:absolute;top:-5px;right:-8px;background:var(--pokered);color:#fff;border-radius:20px;font-size:9.5px;
  min-width:15px;height:15px;padding:0 3px;font-family:'Inter',sans-serif;font-weight:700;
  align-items:center;justify-content:center;
}

/* ---- auth screen ---- */
#auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{
  width:100%;max-width:380px;background:var(--panel);border:2px solid var(--line);
  border-radius:18px;padding:30px 26px;
}
.auth-card .ball-big{width:56px;height:56px;margin:0 auto 10px;display:block;}
.auth-card h1{text-align:center;font-size:24px;color:var(--paper);margin-bottom:2px;}
.auth-card p.sub{text-align:center;color:var(--text-dim);font-size:13px;margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
.field input{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.field input:focus{outline:none;border-color:var(--gold);}
.btn-primary{width:100%;padding:12px;background:var(--pokered);color:#fff;border-radius:10px;font-size:15px;margin-top:4px;}
.btn-primary:hover{background:var(--pokered-dark);}
.switch-mode{text-align:center;margin-top:16px;font-size:13px;color:var(--text-dim);}
.switch-mode button{background:none;color:var(--gold);font-size:13px;padding:0;}
.auth-error{background:var(--missing-bg);color:#ffb3af;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}

/* ---- home / collections ---- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.section-head h2{font-size:20px;color:var(--paper);}
.btn-gold{background:var(--gold);color:var(--ink);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--panel-raised);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-ghost:hover{background:var(--line);}
.btn-danger{background:var(--missing-bg);color:var(--missing);border:1.5px solid var(--missing);padding:9px 14px;border-radius:9px;font-size:13px;}
.btn-danger:hover{background:var(--missing);color:#fff;}

.coll-list{display:flex;flex-direction:column;gap:10px;}
.coll-row{
  display:flex;align-items:center;gap:16px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s;
}
.coll-row:hover{border-color:var(--gold);}
.coll-row .cnum{
  width:40px;height:40px;border-radius:50%;background:var(--panel-raised);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:'Rubik',sans-serif;font-weight:700;font-size:14px;flex:0 0 auto;
}
.coll-row .cinfo{flex:1;min-width:0;}
.coll-row .cinfo h3{font-size:16px;color:var(--paper);}
.coll-row .cinfo .csub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.coll-row .cprog{width:120px;flex:0 0 auto;}
.progress-track{height:8px;border-radius:6px;background:var(--panel-raised);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pokered),var(--gold));border-radius:6px;}
.cprog .pct{font-size:12px;color:var(--text-dim);text-align:right;margin-top:4px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state .ball-big{width:44px;height:44px;margin:0 auto 14px;opacity:.6;}

/* ---- collection detail ---- */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:10px;background:none;padding:0;}
.backlink:hover{color:var(--paper);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:16px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;
}
.tile{
  border-radius:12px;padding:8px;cursor:pointer;position:relative;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .1s;
}
.tile:hover{transform:translateY(-2px);}
.tile.owned{background:var(--owned-bg);border-color:var(--owned);}
.tile.missing{background:var(--missing-bg);border-color:var(--missing);}
.tile.friend{background:var(--friend-bg);border-color:var(--friend);}
.tile img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:7px;background:var(--panel-raised);margin-bottom:6px;}
.tile .tnum{font-size:10px;color:var(--text-dim);}
.tile .tname{font-size:11.5px;color:var(--text);line-height:1.25;margin-top:1px;}
.tile-variants{display:flex;gap:3px;margin-top:5px;}
.vchip{font-size:8.5px;padding:2px 5px;border-radius:5px;background:var(--panel-raised);color:var(--text-dim);font-weight:700;letter-spacing:.3px;}
.vchip.owned{background:var(--owned);color:#0c1f14;}
.quick-row{display:flex;justify-content:space-between;gap:12px;margin:10px 0 0;}
.quick-add{
  flex:0 0 auto;width:44px;height:44px;padding:0;border-radius:50%;font-size:14px;font-weight:800;
  background:#fff;color:#14161B;display:flex;align-items:center;justify-content:center;
}
.quick-add:active{background:var(--gold);}
.quick-add:hover{background:var(--gold);}

/* ---- modal ---- */
#modal-layer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;}
#modal-layer.show{display:flex;}
#modal-backdrop{position:absolute;inset:0;background:rgba(10,11,14,0.72);}
.modal-box{
  position:relative;background:var(--panel);border:2px solid var(--line);border-radius:16px;
  width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:22px;
}
.modal-box h3{font-size:18px;color:var(--paper);margin-bottom:16px;}
.modal-close{position:absolute;top:14px;right:14px;background:none;color:var(--text-dim);width:28px;height:28px;border-radius:8px;font-size:16px;}
.modal-close:hover{background:var(--panel-raised);color:var(--paper);}
.qty-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0;}
.qty-row button{width:38px;height:38px;border-radius:10px;background:var(--panel-raised);color:var(--paper);font-size:18px;}
.qty-row button:hover{background:var(--line);}
.qty-row .qtyval{font-size:22px;font-weight:700;min-width:34px;text-align:center;}
.variant-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
.variant-block:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
.variant-block .variant-head{font-size:13px;color:var(--paper);font-weight:700;text-align:center;}
.variant-block .qty-row{margin:10px 0;}
.variant-block .qty-row button{width:32px;height:32px;font-size:16px;}
.variant-block .qtyval{font-size:18px;}
.card-preview{width:120px;margin:0 auto 12px;display:block;}
.card-preview img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:10px;background:var(--panel-raised);}
.friendlist{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;}
.friendlist h4{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;font-weight:600;}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.frow:last-child{border-bottom:none;}
.frow .fname{flex:1;font-size:13.5px;}
.frow .fprice{font-size:13px;color:var(--gold);font-weight:700;}
.frow button{padding:6px 10px;font-size:11.5px;background:var(--pokered);color:#fff;border-radius:7px;}
.frow button:disabled{background:var(--line);color:var(--text-dim);cursor:default;}
.muted{color:var(--text-dim);font-size:12.5px;}

/* ---- friends page ---- */
.searchbar{display:flex;gap:8px;margin-bottom:22px;}
.searchbar input{flex:1;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-size:14px;}
.searchbar input:focus{outline:none;border-color:var(--gold);}
.frow2{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.frow2 .favatar{width:34px;height:34px;border-radius:50%;background:var(--panel-raised);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);flex:0 0 auto;}
.frow2 .fmain{flex:1;}
.frow2 .fmain .fu{font-size:14px;color:var(--paper);}
.frow2 .fmain .fs{font-size:11.5px;color:var(--text-dim);}
.tag-pending{font-size:11px;color:var(--gold);background:var(--panel-raised);padding:3px 8px;border-radius:20px;}

/* ---- cart / inbox ---- */
.cart-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.cart-item img{width:38px;aspect-ratio:5/7;object-fit:cover;border-radius:6px;background:var(--panel-raised);}
.cart-item .ci-main{flex:1;}
.cart-item .ci-main .cin{font-size:13.5px;color:var(--paper);}
.cart-item .ci-main .cis{font-size:11.5px;color:var(--text-dim);}
.cart-item .ciprice{font-size:14px;color:var(--gold);font-weight:700;}
.cart-item .cirm{background:none;color:var(--missing);font-size:18px;padding:4px 8px;}
.cart-item.unavailable{opacity:.7;border:1.5px solid var(--missing);}
.btn-primary:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:15px;color:var(--paper);border-top:1px solid var(--line);padding-top:14px;}
.order-card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.order-card .ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .ohead .ofrom{font-size:14px;color:var(--paper);font-weight:600;}
.order-card .ohead .odate{font-size:11.5px;color:var(--text-dim);}
.order-card .oitems{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.order-card .ototal{margin-top:8px;font-size:14px;color:var(--gold);font-weight:700;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pokered);display:inline-block;margin-right:6px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;}
.tab{background:var(--panel);color:var(--text-dim);padding:8px 14px;border-radius:9px;font-size:13px;}
.tab.active{background:var(--gold);color:var(--ink);}
.status-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.status-pending{background:var(--panel-raised);color:var(--text-dim);}
.status-negotiating{background:var(--friend-bg);color:var(--friend);}
.status-refused{background:var(--missing-bg);color:var(--missing);}
.status-accepted{background:var(--owned-bg);color:var(--owned);}
.status-completed{background:var(--gold);color:var(--ink);}
.status-cancelled{background:var(--panel-raised);color:var(--text-dim);}
.deal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.deal-actions button{flex:1;min-width:100px;padding:9px 6px;font-size:12px;}

/* ---- csv/import modal helpers ---- */
textarea{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;}
.filepick{display:block;width:100%;padding:14px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;margin-bottom:14px;}
.filepick:hover{border-color:var(--gold);color:var(--paper);}

@media (max-width:480px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
}
</style>
</head>

/* ============ DATA LAYER ============ */

async function apiSelect(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiInsert(table, rows, opts){
  opts = opts || {};
  var url = SUPABASE_URL + '/rest/v1/' + table + (opts.upsertOn ? '?on_conflict='+opts.upsertOn : '');
  var headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer: 'return=representation' + (opts.upsertOn ? ',resolution=merge-duplicates' : '') };
  var res = await fetch(url, { method:'POST', headers: headers, body: JSON.stringify(rows) });
  if(!res.ok){ var t = await res.text(); if(res.status!==409) throw new Error(t); return null; }
  return res.json();
}
async function apiUpdate(table, query, patch){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'PATCH', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', Prefer:'return=representation' }, body: JSON.stringify(patch) });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiDelete(table, query){
  var url = SUPABASE_URL + '/rest/v1/' + table + '?' + query;
  var res = await fetch(url, { method:'DELETE', headers:{ apikey: SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY } });
  if(!res.ok) throw new Error(await res.text());
  return true;
}

    '<div class="auth-card">'+

      '<h1 class="brand" style="font-size:20px;">THE POKESHOP</h1>'+
      '<p class="sub">'+(mode==='login' ? 'Connecte-toi à ta collection' : 'Crée ton compte de dresseur')+'</p>'+
      (error ? '<div class="auth-error">'+esc(error)+'</div>' : '')+
      '<div id="auth-fields"></div>'+
      '<button class="btn-primary" id="auth-submit">'+(mode==='login'?'Se connecter':"S'inscrire")+'</button>'+
      '<div class="switch-mode">'+
        (mode==='login' ? "Pas encore de compte ? " : "Déjà un compte ? ")+
        '<button id="auth-switch">'+(mode==='login' ? "S'inscrire" : 'Se connecter')+'</button>'+
      '</div>'+
    '</div>'
  );
  wrap.appendChild(card);
  app.appendChild(wrap);

  var fields = qs('auth-fields');
  if(mode==='register'){
    fields.innerHTML =
      '<div class="field"><label>Pseudo</label><input id="f-username" autocomplete="username" placeholder="Sacha"></div>'+
      '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" placeholder="toi@exemple.com"></div>'+
      '<div class="field"><label>Mot de passe</label><input id="f-password" type="password" autocomplete="new-password" placeholder="••••••••"></div>';
  } else {
    fields.innerHTML =
      '<div class="field"><label>Pseudo ou email</label><input id="f-identifier" autocomplete="username" placeholder="Sacha"></div>'+
      '<div class="field"><label>Mot de passe</label><input id="f-password" type="password" autocomplete="current-password" placeholder="••••••••"></div>';
  }

  qs('auth-switch').onclick = function(){ renderAuth(mode==='login'?'register':'login'); };
  qs('auth-submit').onclick = function(){ mode==='login' ? doLogin() : doRegister(); };
  card.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ mode==='login' ? doLogin() : doRegister(); } });
  });
}

async function doRegister(){
  var username = (qs('f-username').value||'').trim();
  var email = (qs('f-email').value||'').trim().toLowerCase();
  var password = qs('f-password').value||'';
  if(!username || !email || !password){ renderAuth('register','Remplis tous les champs.'); return; }
  if(password.length < 4){ renderAuth('register','Mot de passe trop court (4 caractères min).'); return; }
  try{
    var existing = await apiSelect('pokeshop_users', 'or=(username.eq.'+encodeURIComponent(username)+',email.eq.'+encodeURIComponent(email)+')&select=id');
    if(existing.length){ renderAuth('register','Ce pseudo ou cet email est déjà pris.'); return; }
    var hash = await sha256(password);
    var rows = await apiInsert('pokeshop_users', [{ username: username, email: email, password_hash: hash }]);
    if(!rows || !rows.length){ renderAuth('register','Inscription impossible, réessaie.'); return; }
    var u = rows[0];
    var sess = { id: u.id, username: u.username, email: u.email };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('register','Erreur : '+e.message); }
}

async function doLogin(){
  var identifier = (qs('f-identifier').value||'').trim();
  var password = qs('f-password').value||'';
  if(!identifier || !password){ renderAuth('login','Remplis tous les champs.'); return; }
  try{
    var hash = await sha256(password);
    var idEnc = encodeURIComponent(identifier.toLowerCase());
    var rows = await apiSelect('pokeshop_users', 'or=(username.ilike.'+encodeURIComponent(identifier)+',email.eq.'+idEnc+')&select=*');
    var u = rows.find(function(r){ return r.password_hash === hash; });
    if(!u){ renderAuth('login','Identifiants incorrects.'); return; }
    var sess = { id: u.id, username: u.username, email: u.email };
    saveSession(sess); state.user = sess;
    boot();
  }catch(e){ renderAuth('login','Erreur : '+e.message); }
}

function doLogout(){ clearSession(); state.user = null; state.cart=[]; saveCart(); renderAuth('login'); }

function openAdminModal(){
  openModal(
    '<h3>Mode admin</h3>'+

function updateBadges(){
  var cb = qs('cart-badge'); if(cb){ if(state.cart.length){ cb.style.display='flex'; cb.textContent = state.cart.length; } else cb.style.display='none'; }
  var ib = qs('inbox-badge');
  if(ib){
    var unread = state.inbox.filter(function(m){ return !m.read; }).length;
    if(unread){ ib.style.display='flex'; ib.textContent = unread; } else ib.style.display='none';
  }
  var fb = qs('friends-badge');
  if(fb){ if(state.friendPendingCount){ fb.style.display='flex'; fb.textContent = state.friendPendingCount; } else fb.style.display='none'; }
  document.querySelectorAll('.tabbtn[data-nav]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav')===state.view);
  });
}

async function refreshFriendPending(){
  try{
    var rows = await apiSelect('pokeshop_friends', 'friend_id=eq.'+state.user.id+'&status=eq.pending&select=id');
    state.friendPendingCount = rows.length;
    updateBadges();
  }catch(e){}
}

async function navigate(view, arg){
  state.view = view;
  if(view==='home') await renderHome();
  else if(view==='collection') await renderCollection(arg);
  else if(view==='friends') await renderFriends();
  else if(view==='friend-detail') await renderFriendDetail(arg);
  else if(view==='cart') await renderCart();
  else if(view==='inbox') await renderInbox();
  updateBadges();
}

async function renderHome(){
  var main = qs('main');
  main.innerHTML = '<div class="section-head"><h2>Tes collections</h2>'+(state.isAdmin ? '<button class="btn-gold" id="new-coll-btn">+ Nouvelle collection</button>' : '')+'</div><div id="coll-list" class="coll-list"><p class="muted">Chargement…</p></div>';
  if(qs('new-coll-btn')) qs('new-coll-btn').onclick = openNewCollectionModal;

  var collections = await apiSelect('pokeshop_collections', 'select=*&order=created_at.asc');
  state.collections = collections;
  var list = qs('coll-list');
  if(!collections.length){
    list.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);margin-bottom:6px;">Aucune collection pour l\'instant</h3><p>Crée la première collection pour commencer à suivre ton master set.</p></div>';
    return;
  }

  var cardCounts = await apiSelect('pokeshop_cards', 'select=id,collection_id');
  var myCards = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&quantity=gt.0&select=card_id');
  var ownedSet = {}; myCards.forEach(function(r){ ownedSet[r.card_id]=true; });
  var cardIdToColl = {};
  var totalsByColl = {};
  cardCounts.forEach(function(c){ totalsByColl[c.collection_id]=(totalsByColl[c.collection_id]||0)+1; cardIdToColl[c.id]=c.collection_id; });
  var ownedByColl = {};
  cardCounts.forEach(function(c){ if(ownedSet[c.id]) ownedByColl[c.collection_id]=(ownedByColl[c.collection_id]||0)+1; });

  list.innerHTML = '';
  collections.forEach(function(c, idx){
    var total = totalsByColl[c.id]||0;
    var owned = ownedByColl[c.id]||0;
    var pct = total ? Math.round(owned/total*100) : 0;
    var row = el(
      '<div class="coll-row">'+
        '<div class="cnum">'+(idx+1)+'</div>'+
        '<div class="cinfo"><h3>'+esc(c.name)+'</h3><div class="csub">'+owned+' / '+total+' cartes</div></div>'+
        '<div class="cprog"><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div><div class="pct">'+pct+'%</div></div>'+
      '</div>'
    );
    row.onclick = function(){ navigate('collection', c.id); };
    list.appendChild(row);
  });
}

async function renderCollection(collectionId){
  state.currentCollectionId = collectionId;
  var coll = state.collections.find(function(c){ return c.id===collectionId; });
  var main = qs('main');
  main.innerHTML =
    '<button class="backlink" id="back-home">← Toutes les collections</button>'+
    '<div class="section-head"><h2>'+esc(coll ? coll.name : '')+'</h2>'+
      (state.isAdmin ? '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn-ghost" id="import-csv-btn">Importer CSV</button><button class="btn-gold" id="add-card-btn">+ Ajouter une carte</button><button class="btn-danger" id="delete-all-btn">Vider la collection</button></div>' : '')+
    '</div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--owned);"></i>Possédée</span>'+
      '<span><i style="background:var(--friend);"></i>Un ami a un doublon</span>'+
      '<span><i style="background:var(--missing);"></i>Manquante</span>'+
    '</div>'+
    '<div id="card-grid" class="card-grid"><p class="muted">Chargement…</p></div>';

  qs('back-home').onclick = function(){ navigate('home'); };
  if(qs('add-card-btn')) qs('add-card-btn').onclick = function(){ openAddCardModal(collectionId); };
  if(qs('import-csv-btn')) qs('import-csv-btn').onclick = function(){ openCsvImportModal(collectionId); };
  if(qs('delete-all-btn')) qs('delete-all-btn').onclick = function(){ openDeleteAllCardsModal(collectionId, coll ? coll.name : ''); };

  var cards = await apiSelect('pokeshop_cards', 'collection_id=eq.'+collectionId+'&select=*&order=number.asc');
  state.currentCollectionCards = cards;

  var myRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&select=id,card_id,variant,quantity,price');
  var myMap = {}; myRows.forEach(function(r){ (myMap[r.card_id] = myMap[r.card_id]||{})[r.variant] = r; });
  state.userCardMap = myMap;

  await ensureFriends();
  var friendDup = {};
  if(state.friends.length){
    var friendIds = state.friends.map(function(f){ return f.id; });
    var cardIds = cards.map(function(c){ return c.id; });
    if(cardIds.length){
      var lockedMap = await getLockedMap();
      var dupRows = await apiSelect('pokeshop_user_cards',
        'user_id=in.('+friendIds.join(',')+')&card_id=in.('+cardIds.join(',')+')&quantity=gt.1&select=*');
      dupRows.forEach(function(r){
        var f = state.friends.find(function(ff){ return ff.id===r.user_id; });
        if(!f) return;
        var locked = lockedMap[r.user_id+'|'+r.card_id+'|'+r.variant] || 0;
        var effQty = r.quantity - locked;
        if(effQty>1){
          (friendDup[r.card_id] = friendDup[r.card_id]||[]).push({ friend_id: r.user_id, username: f.username, variant: r.variant, price: r.price, quantity: effQty });
        }
      });
    }
  }
  state.friendDupMap = friendDup;

  var grid = qs('card-grid');
  if(!cards.length){
    grid.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);margin-bottom:6px;">Aucune carte pour l\'instant</h3><p>Ajoute des cartes une par une ou importe un CSV (colonnes : number, name, image_url).</p></div>';
    return;
  }
  grid.innerHTML = '';
  cards.forEach(function(card){
    var mine = myMap[card.id] || {};
    var totalQty = VARIANTS.reduce(function(s,v){ return s + (mine[v.key] ? mine[v.key].quantity : 0); }, 0);
    var hasFriendDup = !!(friendDup[card.id] && friendDup[card.id].length);
    var cls = totalQty>0 ? 'owned' : (hasFriendDup ? 'friend' : 'missing');
    var quickBtns = VARIANTS.map(function(v){ return '<button class="quick-add" data-variant="'+v.key+'">+'+v.key+'</button>'; }).join('');
    var tile = el(
      '<div class="tile '+cls+'" data-card-id="'+card.id+'">'+
        '<img src="'+(card.image_url?esc(card.image_url):PLACEHOLDER_IMG)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.POKESHOP_PLACEHOLDER;">'+
        '<div class="tnum">#'+esc(card.number)+'</div>'+
        '<div class="tname">'+esc(card.name)+'</div>'+
        '<div class="tile-variants">'+variantChips(mine)+'</div>'+
        '<div class="quick-row">'+quickBtns+'</div>'+
      '</div>'
    );
    tile.querySelectorAll('.quick-add').forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); quickAdd(card, btn.getAttribute('data-variant')); };
    });
    tile.onclick = function(){ openCardModal(card); };
    grid.appendChild(tile);
  });
}

function variantChips(mine){
  return VARIANTS.map(function(v){
    var row = mine[v.key];
    var qty = row ? row.quantity : 0;
    return '<span class="vchip'+(qty>0?' owned':'')+'">'+v.key+(qty>1?' ×'+qty:'')+'</span>';
  }).join('');
}

async function quickAdd(card, variantKey){
  var tileEl = document.querySelector('.tile[data-card-id="'+card.id+'"]');
  var mine = state.userCardMap[card.id] = state.userCardMap[card.id] || {};
  var existing = mine[variantKey];
  var newQty = (existing ? existing.quantity : 0) + 1;
  var newPrice = existing ? existing.price : null;
  if(newQty>1 && newPrice==null) newPrice = DEFAULT_PRICES[variantKey];
  if(existing){
    await apiUpdate('pokeshop_user_cards', 'id=eq.'+existing.id, { quantity: newQty, price: newPrice });
    existing.quantity = newQty; existing.price = newPrice;
  } else {
    var inserted = await apiInsert('pokeshop_user_cards', [{ user_id: state.user.id, card_id: card.id, variant:variantKey, quantity: newQty, price: newPrice }]);
    var newId = inserted && inserted[0] ? inserted[0].id : null;
    mine[variantKey] = { id: newId, variant:variantKey, quantity: newQty, price: newPrice };
  }
  if(!tileEl) return;
  var totalQty = VARIANTS.reduce(function(s,v){ return s + (mine[v.key] ? mine[v.key].quantity : 0); }, 0);
  var hasFriendDup = !!(state.friendDupMap[card.id] && state.friendDupMap[card.id].length);
  tileEl.className = 'tile ' + (totalQty>0 ? 'owned' : (hasFriendDup ? 'friend' : 'missing'));
  var chipsEl = tileEl.querySelector('.tile-variants');
  if(chipsEl) chipsEl.innerHTML = variantChips(mine);
}

async function getLockedMap(){
  var msgs = await apiSelect('pokeshop_messages', 'status=eq.accepted&select=from_user_id,to_user_id,items');
  var map = {};
  msgs.forEach(function(m){
    (m.items||[]).forEach(function(it){
      if(!it.card_id) return;
      var ownerId = it.direction==='sell' ? m.from_user_id : m.to_user_id;
      var key = ownerId+'|'+it.card_id+'|'+it.variant;
      map[key] = (map[key]||0)+1;
    });
  });
  return map;
}

async function ensureFriends(){
  var rows = await apiSelect('pokeshop_friends',
    'or=(user_id.eq.'+state.user.id+',friend_id.eq.'+state.user.id+')&status=eq.accepted&select=*');
  state.friendRows = rows;
  var otherIds = rows.map(function(r){ return r.user_id===state.user.id ? r.friend_id : r.user_id; });
  if(!otherIds.length){ state.friends = []; return; }
  var users = await apiSelect('pokeshop_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
  state.friends = users;
}

function openCsvImportModal(collectionId){
  openModal(
    '<h3>Importer un CSV</h3>'+
    '<p class="muted" style="margin-bottom:12px;">Colonnes attendues : <b>number,name,image_url</b> (avec en-tête).</p>'+
    '<label class="filepick" id="csv-pick">Choisir un fichier CSV<input type="file" id="csv-file" accept=".csv" style="display:none;"></label>'+
    '<div id="csv-status" class="muted"></div>'+
    '<button class="btn-primary" id="csv-save" disabled>Importer</button>'
  );
  var parsed = null;
  qs('csv-file').onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;
    Papa.parse(file, {
      header:true, skipEmptyLines:true,
      complete: function(res){
        var fields = res.meta.fields || [];
        function findField(candidates){
          for(var i=0;i<fields.length;i++){
            var norm = fields[i].toLowerCase().replace(/[\s_-]/g,'');
            if(candidates.indexOf(norm)!==-1) return fields[i];
          }
          return null;
        }
        var fNum = findField(['number','no','num','numero','cardnumber']);
        var fName = findField(['name','nom','cardname']);
        var fImg = findField(['imageurl','image','img','imgurl','url','picture','photo','lien']);
        parsed = res.data.map(function(r){
          return {
            collection_id: collectionId,
            number: fNum ? String(r[fNum]||'').trim() : '',
            name: fName ? String(r[fName]||'').trim() : '',
            image_url: fImg ? String(r[fImg]||'').trim() : ''
          };
        }).filter(function(r){ return r.number && r.name; });
        var withImg = parsed.filter(function(r){ return r.image_url; }).length;
        var statusHtml = parsed.length + ' cartes détectées, ' + withImg + ' avec image.';
        if(!fImg) statusHtml += '<br><span style="color:var(--missing);">Colonne image non reconnue dans le CSV — les cartes seront importées sans image.</span>';
        else if(withImg < parsed.length) statusHtml += '<br><span style="color:var(--friend);">'+(parsed.length-withImg)+' carte(s) sans lien image dans le fichier.</span>';
        qs('csv-status').innerHTML = statusHtml;
        qs('csv-save').disabled = !parsed.length;
      }
    });
  };
  qs('csv-save').onclick = async function(){
    if(!parsed || !parsed.length) return;
    qs('csv-save').disabled = true; qs('csv-save').textContent = 'Import en cours…';
    var chunk = 200;
    for(var i=0;i<parsed.length;i+=chunk){
      await apiInsert('pokeshop_cards', parsed.slice(i,i+chunk));
    }
    closeModal();
    renderCollection(collectionId);
  };
}

async function openCardModal(card){
  var mineAll = state.userCardMap[card.id] || {};
  var dupFriends = state.friendDupMap[card.id] || [];

  var qtyState = {};
  VARIANTS.forEach(function(v){ qtyState[v.key] = mineAll[v.key] ? mineAll[v.key].quantity : 0; });

  var variantRows = VARIANTS.map(function(v){

    return '<div class="variant-block">'+

      '<div class="field price-field-'+v.key+'" style="'+(row.quantity>1?'':'display:none;')+'"><label>Prix par doublon ('+v.label+')</label><input type="number" min="0" step="0.5" id="m-price-'+v.key+'" value="'+(row.price!=null?row.price:'')+'" placeholder="2.50"></div>'+

  openModal(
    '<h3 style="text-align:center;">'+esc(card.name)+' <span class="muted">#'+esc(card.number)+'</span></h3>'+
    '<div class="card-preview"><img src="'+(card.image_url?esc(card.image_url):PLACEHOLDER_IMG)+'" onerror="this.onerror=null;this.src=window.POKESHOP_PLACEHOLDER;"></div>'+
    (state.isAdmin ? '<button class="btn-ghost" id="edit-card-btn" style="width:100%;margin-bottom:14px;font-size:12px;">✎ Modifier nom / numéro / image</button>' : '')+
    variantRows+
    '<button class="btn-primary" id="qty-save">Enregistrer</button>'+
    '<div class="friendlist">'+
      '<h4>Chez tes amis (doublons)</h4>'+
      (dupFriends.length ? dupFriends.map(function(f){
        return '<div class="frow"><span class="fname">'+esc(f.username)+' <span class="muted">'+variantLabel(f.variant)+' (x'+f.quantity+')</span></span>'+
          '<span class="fprice">'+(f.price!=null ? f.price+' €' : 'prix ?')+'</span>'+
          '<button data-fid="'+f.friend_id+'" data-variant="'+f.variant+'" data-price="'+(f.price!=null?f.price:0)+'" class="add-cart-btn" '+(f.price==null?'disabled':'')+'>Panier</button></div>';
      }).join('') : '<p class="muted">Aucun ami n\'a de doublon de cette carte.</p>')+
    '</div>'
  );

  if(qs('edit-card-btn')) qs('edit-card-btn').onclick = function(){ openEditCardModal(card); };

  function refresh(v){
    qs('qty-val-'+v).textContent = qtyState[v];
    var pf = document.querySelector('.price-field-'+v);
    if(pf) pf.style.display = qtyState[v]>1 ? '' : 'none';
    var priceInput = qs('m-price-'+v);
    if(priceInput && qtyState[v]>1 && priceInput.value===''){ priceInput.value = DEFAULT_PRICES[v]; }
  }
  document.querySelectorAll('[data-vminus]').forEach(function(btn){
    btn.onclick = function(){ var v=btn.getAttribute('data-vminus'); if(qtyState[v]>0){ qtyState[v]--; refresh(v); } };
  });
  document.querySelectorAll('[data-vplus]').forEach(function(btn){
    btn.onclick = function(){ var v=btn.getAttribute('data-vplus'); qtyState[v]++; refresh(v); };
  });

  qs('qty-save').onclick = async function(){
    var existing = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&card_id=eq.'+card.id+'&select=id,variant');
    for(var i=0;i<VARIANTS.length;i++){
      var v = VARIANTS[i].key;
      var priceInput = qs('m-price-'+v);
      var price = priceInput && qtyState[v]>1 && priceInput.value!=='' ? parseFloat(priceInput.value) : null;
      var row = existing.find(function(r){ return r.variant===v; });
      if(row){
        await apiUpdate('pokeshop_user_cards', 'id=eq.'+row.id, { quantity: qtyState[v], price: price });
      } else if(qtyState[v]>0) {
        await apiInsert('pokeshop_user_cards', [{ user_id: state.user.id, card_id: card.id, variant: v, quantity: qtyState[v], price: price }]);
      }
    }
    closeModal();
    renderCollection(state.currentCollectionId);
  };

  document.querySelectorAll('.add-cart-btn').forEach(function(btn){
    btn.onclick = function(){
      var fid = btn.getAttribute('data-fid');
      var variant = btn.getAttribute('data-variant');
      var price = parseFloat(btn.getAttribute('data-price'))||0;
      var friend = dupFriends.find(function(f){ return f.friend_id===fid && f.variant===variant; });
      addToCart({ cardId: card.id, cardName: card.name, cardImg: card.image_url, collectionName: (state.collections.find(function(c){return c.id===state.currentCollectionId;})||{}).name||'', sellerId: fid, sellerUsername: friend?friend.username:'', price: price, variant: variant });
      btn.textContent = 'Ajouté ✓'; btn.disabled = true;
    };
  });
}

async function renderFriendDetail(friendId){
  var main = qs('main');
  main.innerHTML = '<button class="backlink" id="back-friends">← Amis</button><div class="section-head"><h2 id="fd-title">…</h2></div>'+
    '<div class="tabs"><button class="tab active" data-ftab="theirs">Ses doublons</button><button class="tab" data-ftab="mine">Tes doublons</button></div>'+
    '<div id="friend-detail-list"><p class="muted">Chargement…</p></div>';
  qs('back-friends').onclick = function(){ navigate('friends'); };

  await ensureFriends();
  var friend = state.friends.find(function(f){ return f.id===friendId; });
  if(!friend){
    var res = await apiSelect('pokeshop_users', 'id=eq.'+friendId+'&select=id,username');
    friend = res[0] || { id: friendId, username: '—' };
  }
  qs('fd-title').textContent = friend.username;

  var collections = await apiSelect('pokeshop_collections', 'select=*&order=created_at.asc');
  var collMap = {}; collections.forEach(function(c){ collMap[c.id]=c.name; });
  var cards = await apiSelect('pokeshop_cards', 'select=*&order=number.asc');

  var myRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+state.user.id+'&select=card_id,variant,quantity,price');
  var myMap = {}; myRows.forEach(function(r){ (myMap[r.card_id]=myMap[r.card_id]||{})[r.variant]=r; });

  var theirRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+friendId+'&select=card_id,variant,quantity,price');
  var theirMap = {}; theirRows.forEach(function(r){ (theirMap[r.card_id]=theirMap[r.card_id]||{})[r.variant]=r; });

  var lockedMap = await getLockedMap();
  var theirsForMe = [], mineForThem = [];
  cards.forEach(function(card){
    VARIANTS.forEach(function(v){
      var theirRow = theirMap[card.id] && theirMap[card.id][v.key];
      var myRow = myMap[card.id] && myMap[card.id][v.key];
      var myQty = myRow ? myRow.quantity : 0;
      var theirQty = theirRow ? theirRow.quantity : 0;
      var theirLocked = lockedMap[friendId+'|'+card.id+'|'+v.key] || 0;
      var myLocked = lockedMap[state.user.id+'|'+card.id+'|'+v.key] || 0;
      var theirEff = theirQty - theirLocked;
      var myEff = myQty - myLocked;
      if(theirRow && theirEff>1 && myQty===0){
        theirsForMe.push({ card:card, variant:v.key, price: theirRow.price, quantity: theirEff, collectionName: collMap[card.collection_id]||'—' });
      }
      if(myRow && myEff>1 && theirQty===0){
        mineForThem.push({ card:card, variant:v.key, price: myRow.price, quantity: myEff, collectionName: collMap[card.collection_id]||'—' });
      }
    });
  });

  state.friendDetailData = { friend: friend, theirsForMe: theirsForMe, mineForThem: mineForThem };
  renderFriendDetailTab('theirs');

  main.querySelectorAll('[data-ftab]').forEach(function(b){
    b.onclick = function(){
      main.querySelectorAll('[data-ftab]').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      renderFriendDetailTab(b.getAttribute('data-ftab'));
    };
  });
}

        cardId: item.card.id, cardName: item.card.name, cardImg: item.card.image_url,

        price: item.price, variant: item.variant, direction: direction

/* ============ CART ============ */

function addToCart(item){
  var dup = state.cart.find(function(c){ return c.cardId===item.cardId && c.sellerId===item.sellerId && c.variant===item.variant && c.direction===item.direction; });
  if(dup) return;
  state.cart.push(item);
  saveCart();
  updateBadges();
}

async function renderCart(){
  var main = qs('main');
  main.innerHTML = '<div class="section-head"><h2>Panier</h2></div><div id="cart-items"><p class="muted">Chargement…</p></div>';
  var box = qs('cart-items');
  if(!state.cart.length){
    box.innerHTML = '<div class="empty-state"><div class="ball-big">'+BALL_SVG+'</div><h3 style="color:var(--paper);">Panier vide</h3><p>Ajoute des cartes en visitant les collections d\'un ami, ou la fiche d\'un ami pour proposer un échange.</p></div>';
    return;
  }

  var ownerIds = Array.from(new Set(state.cart.map(function(i){ return i.direction==='sell' ? state.user.id : i.sellerId; })));
  var cardIds = Array.from(new Set(state.cart.map(function(i){ return i.cardId; })));
  var ownRows = ownerIds.length && cardIds.length ? await apiSelect('pokeshop_user_cards', 'user_id=in.('+ownerIds.join(',')+')&card_id=in.('+cardIds.join(',')+')&select=user_id,card_id,variant,quantity') : [];
  var qtyMap = {}; ownRows.forEach(function(r){ qtyMap[r.user_id+'|'+r.card_id+'|'+r.variant] = r.quantity; });
  var lockedMap = await getLockedMap();

  var anyUnavailable = false;
  state.cart.forEach(function(item){
    var ownerId = item.direction==='sell' ? state.user.id : item.sellerId;
    var key = ownerId+'|'+item.cardId+'|'+item.variant;
    var qty = qtyMap[key] || 0;
    var locked = lockedMap[key] || 0;
    var available = qty - 1 - locked;
    item._unavailable = available < 0;
    if(item._unavailable) anyUnavailable = true;
  });

  var groups = {};
  state.cart.forEach(function(item, idx){
    item._idx = idx;
    (groups[item.sellerId] = groups[item.sellerId] || { username: item.sellerUsername, items: [] }).items.push(item);
  });
  var html = '';
  var grandNet = 0;
  Object.keys(groups).forEach(function(sid){
    var g = groups[sid];
    var buyTotal=0, sellTotal=0;
    html += '<h3 style="font-size:14px;color:var(--paper);margin:18px 0 8px;">'+esc(g.username)+'</h3>';
    g.items.forEach(function(item){
      var dir = item.direction||'buy';
      if(!item._unavailable){ if(dir==='buy') buyTotal += item.price; else sellTotal += item.price; }
      html += '<div class="cart-item'+(item._unavailable?' unavailable':'')+'">'+
        '<img src="'+(item.cardImg?esc(item.cardImg):PLACEHOLDER_IMG)+'" onerror="this.onerror=null;this.src=window.POKESHOP_PLACEHOLDER;">'+
        '<div class="ci-main"><div class="cin">'+esc(item.cardName)+' <span class="muted">('+variantLabel(item.variant)+')</span></div>'+
          '<div class="cis">'+esc(item.collectionName)+' · '+(item._unavailable ? '<span style="color:var(--missing);font-weight:700;">Carte non disponible</span>' : (dir==='buy'?'tu achètes':'tu proposes en échange'))+'</div></div>'+
        '<div class="ciprice" style="color:'+(item._unavailable?'var(--text-dim)':(dir==='buy'?'var(--gold)':'var(--owned)'))+';'+(item._unavailable?'text-decoration:line-through;':'')+'">'+(dir==='buy'?'+':'−')+item.price.toFixed(2)+' €</div>'+
        '<button class="cirm" data-idx="'+item._idx+'">×</button>'+
      '</div>';
    });
    var net = buyTotal - sellTotal;
    grandNet += net;
    html += '<div class="cart-total" style="margin-top:2px;"><span>Solde avec '+esc(g.username)+'</span><span>'+(net>0?'tu dois ':net<0?'il/elle doit ':'')+Math.abs(net).toFixed(2)+' €'+(net===0?' (équilibré)':'')+'</span></div>';
  });
  box.innerHTML = html;
  box.querySelectorAll('.cirm').forEach(function(btn){
    btn.onclick = function(){ state.cart.splice(parseInt(btn.getAttribute('data-idx')),1); saveCart(); renderCart(); updateBadges(); };
  });
  var totalRow = el('<div class="cart-total" style="border-top:2px solid var(--line);margin-top:16px;padding-top:16px;"><span>Total net</span><span>'+(grandNet>0?'tu dois ':grandNet<0?'on te doit ':'')+Math.abs(grandNet).toFixed(2)+' €'+(grandNet===0?' (équilibré)':'')+'</span></div>');
  box.appendChild(totalRow);
  if(anyUnavailable){
    box.appendChild(el('<p class="muted" style="color:var(--missing);margin-top:10px;">Retire les cartes indisponibles pour pouvoir envoyer la commande.</p>'));
  }
  var discountRow = el('<div class="field" style="margin-top:14px;"><label>Demander une ristourne (%) — optionnel</label><input id="cart-discount" type="number" step="1" value="0" placeholder="ex : 10" '+(anyUnavailable?'disabled':'')+'></div>');
  box.appendChild(discountRow);
  var sendBtn = el('<button class="btn-primary" id="checkout-btn"'+(anyUnavailable?' disabled':'')+'>Envoyer les commandes</button>');
  box.appendChild(sendBtn);
  if(!anyUnavailable) qs('checkout-btn').onclick = checkout;
}

async function checkout(){
  if(!state.cart.length) return;
  var discountPct = parseFloat(qs('cart-discount') ? qs('cart-discount').value : 0) || 0;
  var bySeller = {};
  state.cart.forEach(function(item){
    (bySeller[item.sellerId] = bySeller[item.sellerId]||[]).push(item);
  });
  var rows = Object.keys(bySeller).map(function(sellerId){
    var items = bySeller[sellerId];
    var buyTotal = items.filter(function(i){return (i.direction||'buy')==='buy';}).reduce(function(s,i){return s+i.price;},0);
    var sellTotal = items.filter(function(i){return i.direction==='sell';}).reduce(function(s,i){return s+i.price;},0);
    var net = buyTotal - sellTotal;
    return {
      from_user_id: state.user.id,
      to_user_id: sellerId,
      items: items.map(function(i){ return { card_id:i.cardId, card_name:i.cardName, collection:i.collectionName, variant:i.variant, price:i.price, direction: i.direction||'buy' }; }),
      total: net,
      status: 'pending',
      discount_percent: discountPct,
      last_actor_id: state.user.id,
      read: false
    };
  });
  await apiInsert('pokeshop_messages', rows);
  state.cart = [];
  saveCart();
  updateBadges();
  navigate('inbox');
}

/* ============ INBOX ============ */

async function renderInbox(){
  var received = await apiSelect('pokeshop_messages', 'to_user_id=eq.'+state.user.id+'&select=*&order=created_at.desc');
  var sent = await apiSelect('pokeshop_messages', 'from_user_id=eq.'+state.user.id+'&select=*&order=created_at.desc');
  state.inbox = received; state.sent = sent;

  var otherIds = Array.from(new Set(received.map(function(m){return m.from_user_id;}).concat(sent.map(function(m){return m.to_user_id;}))));
  var usersMap = {};
  if(otherIds.length){
    var users = await apiSelect('pokeshop_users', 'id=in.('+otherIds.join(',')+')&select=id,username');
    users.forEach(function(u){ usersMap[u.id]=u.username; });
  }

  var main = qs('main');
  main.innerHTML =
    '<div class="section-head"><h2>Messagerie</h2></div>'+
    '<div class="tabs"><button class="tab '+(state.inboxTab==='received'?'active':'')+'" data-tab="received">Reçues</button><button class="tab '+(state.inboxTab==='sent'?'active':'')+'" data-tab="sent">Envoyées</button></div>'+
    '<div id="inbox-list"></div>';

  main.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ state.inboxTab = b.getAttribute('data-tab'); renderInbox(); };
  });

  var list = qs('inbox-list');
  var data = state.inboxTab==='received' ? received : sent;
  if(!data.length){ list.innerHTML = '<p class="muted">Rien ici pour l\'instant.</p>'; return; }
  data.forEach(function(m){
    var otherName = state.inboxTab==='received' ? (usersMap[m.from_user_id]||'—') : (usersMap[m.to_user_id]||'—');
    var date = new Date(m.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
    var items = m.items||[];
    var byColl = {};
    items.forEach(function(it){ (byColl[it.collection||'—']=byColl[it.collection||'—']||[]).push(it); });
    var itemsHtml = Object.keys(byColl).map(function(cn){
      var rows = byColl[cn].map(function(it){
        var dir = it.direction||'buy';
        var tag = dir==='buy' ? 'achète' : 'échange';
        return esc(it.card_name)+(it.variant?' ('+variantLabel(it.variant)+')':'')+' — '+tag+' — '+it.price.toFixed(2)+' €';
      }).join('<br>');
      return '<b style="color:var(--paper);font-size:12px;">'+esc(cn)+'</b><br>'+rows;
    }).join('<br><br>');

    var status = m.status || 'pending';
    var discount = m.discount_percent || 0;
    var baseNet = m.total || 0;
    var net = baseNet - (baseNet*discount/100);
    var senderName = state.inboxTab==='received' ? otherName : 'Toi';
    var recipientName = state.inboxTab==='received' ? 'toi' : otherName;
    var balanceLine = net>0 ? (senderName+' doit '+net.toFixed(2)+' € à '+recipientName)
                     : net<0 ? (recipientName.charAt(0).toUpperCase()+recipientName.slice(1)+' doit '+Math.abs(net).toFixed(2)+' € à '+senderName)
                     : 'Échange équilibré';
    var discountLine = discount ? '<div class="muted" style="margin-top:2px;">Base '+baseNet.toFixed(2)+' € · ristourne '+discount+'%</div>' : '';

    var statusHtml = '<span class="status-badge status-'+status+'">'+STATUS_LABELS[status]+'</span>';
    var isMine = m.from_user_id===state.user.id;
    var itsMyTurn = (m.last_actor_id!==state.user.id);

    var actionsHtml = '';
    if((status==='pending' || status==='negotiating') && itsMyTurn){
      actionsHtml = '<div class="deal-actions"><button class="btn-danger" data-refuse="'+m.id+'">Refuser</button><button class="btn-ghost" data-negotiate="'+m.id+'">Négocier</button><button class="btn-gold" data-accept="'+m.id+'">Accepter le pokédeal</button></div>';
    } else if((status==='pending' || status==='negotiating') && !itsMyTurn){
      actionsHtml = '<p class="muted" style="margin-top:8px;">En attente de la réponse de '+esc(otherName)+'…</p>';
    } else if(status==='refused'){
      actionsHtml = '<p class="muted" style="margin-top:8px;">Refusé'+(m.refusal_reason?' — "'+esc(m.refusal_reason)+'"':'')+'</p>';
    } else if(status==='accepted'){
      actionsHtml = '<div class="deal-actions"><button class="btn-danger" data-cancel="'+m.id+'">Annuler le pokédeal</button><button class="btn-gold" data-validate="'+m.id+'">Valider le pokédeal</button></div>';
    } else if(status==='completed'){
      actionsHtml = '<p class="muted" style="margin-top:8px;">Échange finalisé, les cartes ont été transférées.</p>';
    } else if(status==='cancelled'){
      actionsHtml = '<p class="muted" style="margin-top:8px;">Pokédeal annulé.</p>';
    }

    var card = el(
      '<div class="order-card">'+
        '<div class="ohead"><span class="ofrom">'+(state.inboxTab==='received' && !m.read ? '<span class="unread-dot"></span>' : '')+(state.inboxTab==='received'?'De ':'À ')+esc(otherName)+'</span><span class="odate">'+date+'</span></div>'+
        statusHtml+
        '<div class="oitems" style="margin-top:8px;">'+itemsHtml+'</div>'+
        discountLine+
        '<div class="ototal">'+esc(balanceLine)+'</div>'+
        actionsHtml+
        (state.inboxTab==='received' && !m.read ? '<button class="btn-ghost" style="margin-top:10px;font-size:11.5px;padding:6px 10px;" data-read="'+m.id+'">Marquer comme lu</button>' : '')+
      '</div>'
    );
    list.appendChild(card);
  });
  list.querySelectorAll('[data-read]').forEach(function(btn){
    btn.onclick = async function(){ await apiUpdate('pokeshop_messages', 'id=eq.'+btn.getAttribute('data-read'), { read:true }); renderInbox(); };
  });
  list.querySelectorAll('[data-accept]').forEach(function(btn){
    btn.onclick = async function(){ await apiUpdate('pokeshop_messages', 'id=eq.'+btn.getAttribute('data-accept'), { status:'accepted', last_actor_id: state.user.id }); renderInbox(); };
  });
  list.querySelectorAll('[data-refuse]').forEach(function(btn){
    btn.onclick = function(){ openRefuseModal(btn.getAttribute('data-refuse')); };
  });
  list.querySelectorAll('[data-negotiate]').forEach(function(btn){
    btn.onclick = function(){
      var msg = data.find(function(x){ return x.id===btn.getAttribute('data-negotiate'); });
      openNegotiateModal(msg);
    };
  });
  list.querySelectorAll('[data-cancel]').forEach(function(btn){
    btn.onclick = async function(){ await apiUpdate('pokeshop_messages', 'id=eq.'+btn.getAttribute('data-cancel'), { status:'cancelled', last_actor_id: state.user.id }); renderInbox(); };
  });
  list.querySelectorAll('[data-validate]').forEach(function(btn){
    btn.onclick = function(){
      var msg = data.find(function(x){ return x.id===btn.getAttribute('data-validate'); });
      validateDeal(msg);
    };
  });
}

var STATUS_LABELS = { pending:'En attente', negotiating:'Négociation en cours', refused:'Refusé', accepted:'Accepté', completed:'Terminé', cancelled:'Annulé' };

function openRefuseModal(msgId){
  openModal(
    '<h3>Refuser le pokédeal</h3>'+
    '<div class="field"><label>Message (optionnel)</label><input id="m-refuse-reason" placeholder="Pourquoi ?"></div>'+
    '<button class="btn-danger" style="width:100%;padding:12px;" id="m-refuse-save">Refuser</button>'
  );
  qs('m-refuse-save').onclick = async function(){
    var reason = (qs('m-refuse-reason').value||'').trim();
    await apiUpdate('pokeshop_messages', 'id=eq.'+msgId, { status:'refused', refusal_reason: reason, last_actor_id: state.user.id });
    closeModal();
    renderInbox();
  };
}

function openNegotiateModal(msg){
  openModal(
    '<h3>Négocier</h3>'+
    '<p class="muted" style="margin-bottom:14px;">Choisis un pourcentage à appliquer sur le total (positif = remise, négatif = supplément).</p>'+
    '<div class="field"><label>Pourcentage (%)</label><input id="m-negotiate-pct" type="number" step="1" value="'+(msg.discount_percent||0)+'"></div>'+
    '<button class="btn-primary" id="m-negotiate-save">Envoyer la proposition</button>'
  );
  qs('m-negotiate-save').onclick = async function(){
    var pct = parseFloat(qs('m-negotiate-pct').value)||0;
    await apiUpdate('pokeshop_messages', 'id=eq.'+msg.id, { status:'negotiating', discount_percent: pct, last_actor_id: state.user.id });
    closeModal();
    renderInbox();
  };
}

async function validateDeal(msg){
  var items = msg.items || [];
  for(var i=0;i<items.length;i++){
    var it = items[i];
    if(!it.card_id) continue;
    var ownerId = it.direction==='sell' ? msg.from_user_id : msg.to_user_id;
    var receiverId = it.direction==='sell' ? msg.to_user_id : msg.from_user_id;
    var ownerRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+ownerId+'&card_id=eq.'+it.card_id+'&variant=eq.'+it.variant+'&select=*');
    if(ownerRows[0]) await apiUpdate('pokeshop_user_cards', 'id=eq.'+ownerRows[0].id, { quantity: Math.max(0, ownerRows[0].quantity-1) });
    var receiverRows = await apiSelect('pokeshop_user_cards', 'user_id=eq.'+receiverId+'&card_id=eq.'+it.card_id+'&variant=eq.'+it.variant+'&select=*');
    if(receiverRows[0]) await apiUpdate('pokeshop_user_cards', 'id=eq.'+receiverRows[0].id, { quantity: receiverRows[0].quantity+1 });
    else await apiInsert('pokeshop_user_cards', [{ user_id: receiverId, card_id: it.card_id, variant: it.variant, quantity: 1, price: null }]);
  }
  await apiUpdate('pokeshop_messages', 'id=eq.'+msg.id, { status:'completed' });
  renderInbox();
}

/* ============ MODAL ============ */

function openModal(html){
  qs('modal-box').innerHTML = '<button class="modal-close" onclick="Pokeshop.closeModal()">×</button>'+html;
  qs('modal-layer').classList.add('show');
}
function closeModal(){ qs('modal-layer').classList.remove('show'); qs('modal-box').innerHTML=''; }

/* ============ BOOT ============ */

async function boot(){
  var sess = state.user || loadSession();
  if(!sess){ renderAuth('login'); return; }
  state.user = sess;
  state.cart = loadCart();
  renderShell();
  try{
    var inb = await apiSelect('pokeshop_messages', 'to_user_id=eq.'+state.user.id+'&read=eq.false&select=id');
    state.inbox = inb.map(function(r){ return {read:false}; });
  }catch(e){}
  refreshFriendPending();
  updateBadges();
  navigate('home');
}

window.Pokeshop = { closeModal: closeModal };
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
