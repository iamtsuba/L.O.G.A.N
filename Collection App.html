function fmt(n) { return '€' + parseFloat(n || 0).toFixed(0); }

// ════════════════════════════════════════════════════════════
// INIT — Résolution utilisateur sans vérification d'identité
// ════════════════════════════════════════════════════════════
async function initApp() {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Priorité 1 : window.LOGAN_USER_ID injecté par le guard
  if (window.LOGAN_USER_ID) {
    currentUserId = window.LOGAN_USER_ID;
  } else {
    // Attente courte si le guard est encore en train de charger (max 2s)
    let tries = 0;
    while (!window.LOGAN_USER_ID && tries < 20) {
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if (window.LOGAN_USER_ID) {
      currentUserId = window.LOGAN_USER_ID;
    } else {
      // Priorité 2 : lookup dans user_apps
      try {
        const { data } = await db
          .from('user_apps')
          .select('user_id')
          .contains('app_ids', [APP_FILE])
          .limit(1)
          .maybeSingle();
        if (data?.user_id) currentUserId = data.user_id;
      } catch (_) {}
    }
  }

  // Affichage de l'app (s'ouvre toujours)
  document.getElementById('app').style.display = 'block';

  if (!currentUserId) {
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">

      </div>`;

  try {

  } catch (_) {
    document.getElementById('header-user').textContent = currentUserId.slice(0, 8) + '…';
  }

  await loadCollections();

  if (collections.length === 0) {
    // Premier lancement : modale de bienvenue, pas d'interface vide
    showWelcomeModal();
  } else {
    renderCollectionsView();
  }
}

// ════════════════════════════════════════════════════════════
// WELCOME MODAL (premier lancement)

  const el = document.createElement('div');

    <div class="welcome-card">

}

function startFirstCollection() {
  const el = document.getElementById('welcome-overlay');
  if (el) el.remove();
  openNewCollectionModal();
}

// ════════════════════════════════════════════════════════════
// DB — Collections
// ════════════════════════════════════════════════════════════
async function loadCollections() {
  if (!currentUserId) return;
  const { data } = await db
    .from('collectapp_collections')
    .select('*')
    .eq('user_id', currentUserId)
    .order('created_at', { ascending: true });
  collections = data || [];
}

async function saveCollection(name, typeId, customType) {
  const { data, error } = await db
    .from('collectapp_collections')
    .insert({ user_id: currentUserId, name, type_id: typeId, custom_type: customType || null })
    .select().single();
  if (error) throw error;
  return data;
}

async function deleteCollection(id) {
  if (!confirm('Supprimer cette collection et tous ses produits ?')) return;
  await db.from('collectapp_collections').delete().eq('id', id).eq('user_id', currentUserId);
  await loadCollections();
  renderCollectionsView();
}

// ════════════════════════════════════════════════════════════
// DB — Products
// ════════════════════════════════════════════════════════════
async function loadProducts(collectionId) {
  const { data } = await db
    .from('collectapp_products')
    .select('*')
    .eq('collection_id', collectionId)
    .eq('user_id', currentUserId)
    .order('created_at', { ascending: true });
  products = data || [];
}

async function saveProduct(collectionId, payload) {
  const { data, error } = await db
    .from('collectapp_products')
    .insert({ collection_id: collectionId, user_id: currentUserId, ...payload })
    .select().single();
  if (error) throw error;
  return data;
}

async function updateProduct(id, payload) {
  const { error } = await db
    .from('collectapp_products')
    .update(payload)
    .eq('id', id)
    .eq('user_id', currentUserId);
  if (error) throw error;
}

async function deleteProduct(id) {
  await db.from('collectapp_products').delete().eq('id', id).eq('user_id', currentUserId);
}

async function duplicateProduct(p) {
  const { id, created_at, ...rest } = p;
  const { error } = await db
    .from('collectapp_products')
    .insert({ ...rest, name: rest.name + ' (copie)' });
  if (error) throw error;
}

function renderCollectionsView() {
  currentView = 'collections';

      <div class="page-title">Mes Collections</div>
      <div class="version-badge">v${VERSION}</div>
    </div>

        <div class="add-card-label">Nouvelle collection</div>
      </div>

}

function collectionCard(c) {
  const t = typeById(c.type_id);
  const label = c.type_id === 'custom' && c.custom_type ? c.custom_type : t.label;
  return `
    <div class="collection-card" onclick="openCollection('${c.id}')">
      <button class="collection-delete" onclick="event.stopPropagation();deleteCollection('${c.id}')" title="Supprimer">🗑</button>
      <span class="collection-emoji">${t.emoji}</span>
      <div class="collection-name">${esc(c.name)}</div>
      <div class="collection-type">${esc(label)}</div>
      <div class="collection-stats">
        <div class="cstat">
          <div class="cstat-value" id="cs-count-${c.id}" style="color:var(--accent)">–</div>
          <div class="cstat-label">Items</div>
        </div>
        <div class="cstat">
          <div class="cstat-value" id="cs-buy-${c.id}" style="color:var(--accent2)">–</div>
          <div class="cstat-label">Achat</div>
        </div>
        <div class="cstat">
          <div class="cstat-value" id="cs-sell-${c.id}" style="color:var(--accent3)">–</div>
          <div class="cstat-label">Revente</div>
        </div>
      </div>
    </div>`;
}

async function loadAllStats() {
  for (const c of collections) {
    const { data } = await db
      .from('collectapp_products')
      .select('buy_price, sell_price_ebay, excluded')
      .eq('collection_id', c.id)
      .eq('user_id', currentUserId);
    if (!data) continue;
    const included  = data.filter(p => !isEffExcluded(p));
    const totalBuy  = included.reduce((s, p) => s + (p.buy_price || 0), 0);
    const totalSell = included.reduce((s, p) => s + (p.sell_price_ebay || 0), 0);
    const eC = document.getElementById('cs-count-' + c.id);
    const eB = document.getElementById('cs-buy-'   + c.id);
    const eS = document.getElementById('cs-sell-'  + c.id);
    if (eC) eC.textContent = included.length;
    if (eB) eB.textContent = fmt(totalBuy);
    if (eS) eS.textContent = totalSell > 0 ? fmt(totalSell) : '–';
  }
}

}

// Un objet est exclu du calcul total si exclu manuellement OU s'il n'a pas de prix de revente
function isEffExcluded(p) {
  return !!p.excluded || !p.sell_price_ebay;
}

function renderProductsView() {
  currentView = 'products';
  const t = typeById(currentCollection.type_id);
  const label = currentCollection.type_id === 'custom' && currentCollection.custom_type
    ? currentCollection.custom_type : t.label;

  const included  = products.filter(p => !isEffExcluded(p));
  const totalBuy  = included.reduce((s, p) => s + (p.buy_price || 0), 0);
  const totalSell = included.reduce((s, p) => s + (p.sell_price_ebay || 0), 0);
  const profit    = totalSell - totalBuy;
  const pColor    = profit >= 0 ? 'var(--accent3)' : 'var(--accent4)';
  const excludedCount = products.length - included.length;

  const html = `
    <button class="back-btn" onclick="goBack()">← Retour</button>
    <div class="view-title">${esc(currentCollection.name)}</div>
    <div class="view-subtitle">${t.emoji} ${esc(label)} · ${products.length} item${products.length !== 1 ? 's' : ''}${excludedCount > 0 ? ` · ${excludedCount} exclu(s) du calcul` : ''}</div>

    <button class="add-product-btn" onclick="openNewProductModal()" style="margin-top:0;margin-bottom:14px;">＋ Ajouter un produit</button>

    <div class="pnl-banner">
      <div class="pnl-item">
        <div class="pnl-value" style="color:var(--accent)">${included.length}</div>
        <div class="pnl-label">Items</div>
      </div>
      <div class="pnl-sep"></div>
      <div class="pnl-item">
        <div class="pnl-value" style="color:var(--accent2)">${fmt(totalBuy)}</div>
        <div class="pnl-label">Investi</div>
      </div>
      <div class="pnl-sep"></div>
      <div class="pnl-item">
        <div class="pnl-value" style="color:var(--accent3)">${included.length > 0 ? fmt(totalSell) : '–'}</div>
        <div class="pnl-label">Revente est.</div>
      </div>
      <div class="pnl-sep"></div>
      <div class="pnl-item">
        <div class="pnl-value" style="color:${pColor}">${included.length > 0 ? (profit >= 0 ? '+' : '') + fmt(profit) : '–'}</div>
        <div class="pnl-label">P&amp;L</div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn accent" onclick="openQuickAddModal()" style="flex:1;">⚡ Ajout rapide</button>
      <button class="action-btn" onclick="exportToPDF()" style="flex:none;padding:10px 14px;">📄 PDF</button>
      <button class="action-btn green" onclick="exportToExcel()" style="flex:none;padding:10px 14px;">📊 Excel</button>
    </div>

    ${products.length === 0 ? `<div class="empty-state"><div class="empty-icon">🎁</div><div class="empty-text">Aucun produit.<br>Ajoutez votre premier item !</div></div>` : ''}
    <div class="product-list">
      ${products.map(p => productCard(p)).join('')}
    </div>`;

  document.getElementById('main-content').innerHTML = html;
}

function productCard(p) {
  const img = p.photo
    ? `<img class="product-thumb" src="${p.photo}" alt="" loading="lazy">`
    : `<div class="product-thumb-placeholder">📷</div>`;
  const sellBadge = p.sell_price_ebay
    ? `<span class="pbadge pbadge-sell">${fmt(p.sell_price_ebay)} eBay</span>`
    : `<span class="pbadge pbadge-nosell">Pas évalué</span>`;

  let dotColor, dotTitle;
  if (p.excluded) {
    dotColor = 'var(--accent4)'; dotTitle = 'Exclu manuellement du calcul total';
  } else if (!p.sell_price_ebay) {
    dotColor = 'var(--orange)'; dotTitle = 'Pas de prix de revente — exclu automatiquement du calcul total';
  } else {
    dotColor = 'var(--accent3)'; dotTitle = 'Inclus dans le calcul total';
  }

  return `
    <div class="product-card${isEffExcluded(p) ? ' product-excluded' : ''}">
      <span class="status-dot" style="background:${dotColor}" title="${dotTitle}"></span>
      ${img}
      <div class="product-info">
        <div class="product-name">${esc(p.name)}</div>
        ${p.search_name ? `<div class="product-sname">🔍 ${esc(p.search_name)}</div>` : ''}
        <div class="product-prices">
          <span class="pbadge pbadge-buy">${fmt(p.buy_price)}</span>
          ${sellBadge}
        </div>
      </div>
      <div class="product-actions">
        <div class="icoBtn" onclick="openEditProductModal('${p.id}')" title="Modifier">✏️</div>
        <div class="icoBtn" onclick="doDuplicate('${p.id}')" title="Dupliquer">📋</div>
        <div class="icoBtn" onclick="doDeleteProduct('${p.id}')" title="Supprimer">🗑</div>
      </div>
    </div>`;
}

function goBack() { renderCollectionsView(); }

// PRODUCT ACTIONS
// ════════════════════════════════════════════════════════════
async function doDuplicate(id) {
  const p = products.find(p => p.id === id);
  if (!p) return;
  try {
    await duplicateProduct(p);
    await loadProducts(currentCollection.id);
    renderProductsView();
  } catch (e) { alert('Erreur : ' + e.message); }
}

async function doDeleteProduct(id) {
  if (!confirm('Supprimer ce produit ?')) return;
  await deleteProduct(id);
  await loadProducts(currentCollection.id);
  renderProductsView();
}

  ol.className = 'modal-overlay';
  ol.id = 'modal-col';
  ol.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-top">
        <div class="modal-title">Nouvelle Collection</div>
        <div class="modal-close" onclick="closeModal('modal-col')">✕</div>
      </div>

      <div class="form-group">
        <label class="form-label">Type</label>
        <div class="type-grid">
          ${TYPES.map(t => `
            <button class="type-btn" id="tbtn-${t.id}" onclick="selectType('${t.id}')">
              <span class="type-btn-emoji">${t.emoji}</span>
              <span class="type-btn-label">${t.label}</span>
            </button>`).join('')}
        </div>
        <div id="custom-type-row" style="display:none">

function selectType(id) {
  selectedTypeId = id;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('tbtn-' + id)?.classList.add('selected');
  document.getElementById('custom-type-row').style.display = id === 'custom' ? 'block' : 'none';
}

async function submitNewCollection() {
  const name = document.getElementById('input-col-name').value.trim();
  const ct   = document.getElementById('input-custom-type')?.value.trim() || '';
  if (!selectedTypeId)                   { alert('Choisissez un type.'); return; }
  if (!name)                             { alert('Entrez un nom.'); return; }
  if (selectedTypeId === 'custom' && !ct){ alert('Entrez un type personnalisé.'); return; }
  try {
    await saveCollection(name, selectedTypeId, ct);
    closeModal('modal-col');
    await loadCollections();
    renderCollectionsView();
  } catch (e) { alert('Erreur : ' + e.message); }
}

         || document.getElementById('input-pname').value.trim();

  const url = `https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(q)}&LH_Sold=1&LH_Complete=1&_sacat=0&rt=nc`;
  window.open(url, '_blank');
}

// Sync nom produit → nom de recherche si non modifié manuellement

    const pname = document.getElementById('input-pname');

// EXPORT EXCEL
// ════════════════════════════════════════════════════════════
function exportToExcel() {
  if (!products.length) { alert('Aucun produit à exporter.'); return; }

  const rows = products.map(p => ({
    'Nom':               p.name,
    'Nom recherche':     p.search_name || '',
    'Prix achat (€)':    p.buy_price   || 0,
    'Prix revente eBay (€)': p.sell_price_ebay || '',
    'P&L estimé (€)':   p.sell_price_ebay
                          ? parseFloat((p.sell_price_ebay - (p.buy_price||0)).toFixed(2))
                          : '',
    'Exclu du total':    p.excluded ? 'Oui (manuel)' : (!p.sell_price_ebay ? 'Oui (pas de prix)' : 'Non'),
    'Photo':             p.photo ? 'Oui' : 'Non',
    'Ajouté le':         p.created_at ? p.created_at.slice(0,10) : '',
  }));

  // Ligne totaux (hors objets exclus, manuellement ou faute de prix de revente)
  const included  = products.filter(p => !isEffExcluded(p));
  const totalBuy  = included.reduce((s, p) => s + (p.buy_price||0), 0);
  const totalSell = included.reduce((s, p) => s + (p.sell_price_ebay||0), 0);
  rows.push({
    'Nom': 'TOTAL (hors exclus)',
    'Nom recherche': '',
    'Prix achat (€)': parseFloat(totalBuy.toFixed(2)),
    'Prix revente eBay (€)': included.length ? parseFloat(totalSell.toFixed(2)) : '',
    'P&L estimé (€)': included.length ? parseFloat((totalSell - totalBuy).toFixed(2)) : '',
    'Exclu du total': '',
    'Photo': '',
    'Ajouté le': '',
  });

  const ws = XLSX.utils.json_to_sheet(rows);

  // Largeurs colonnes
  ws['!cols'] = [
    { wch: 30 }, { wch: 30 }, { wch: 16 }, { wch: 22 }, { wch: 16 }, { wch: 18 }, { wch: 8 }, { wch: 12 }
  ];

  const wb = XLSX.utils.book_new();
  const sheetName = (currentCollection.name || 'Collection').slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const t = typeById(currentCollection.type_id);
  const label = currentCollection.type_id === 'custom' && currentCollection.custom_type
    ? currentCollection.custom_type : t.label;

  XLSX.writeFile(wb, `${currentCollection.name} — ${label}.xlsx`);
}

// ════════════════════════════════════════════════════════════
// EXPORT PDF — catalogue grille (photo + nom), objets non exclus manuellement
// ════════════════════════════════════════════════════════════
function exportToPDF() {
  const included = products.filter(p => !p.excluded);
  if (!included.length) { alert('Aucun objet à exporter (collection vide ou tous les objets sont exclus).'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210, pageH = 297, margin = 12, gap = 6, cols = 3;
  const cellW = (pageW - margin * 2 - gap * (cols - 1)) / cols;
  const imgH  = cellW;
  const nameH = 10;
  const rowH  = imgH + nameH + gap;

  const t = typeById(currentCollection.type_id);
  const label = currentCollection.type_id === 'custom' && currentCollection.custom_type
    ? currentCollection.custom_type : t.label;

  let y = margin;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(currentCollection.name, margin, y);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(130);
  doc.text(`${label} - ${included.length} objet(s)`, margin, y + 6);
  doc.setTextColor(0);
  y += 14;

  let col = 0;
  for (const p of included) {
    if (col === 0 && y + rowH > pageH - margin) {
      doc.addPage();
      y = margin;
    }
    const cellX = margin + col * (cellW + gap);

    doc.setDrawColor(225);
    doc.setFillColor(246, 246, 248);
    doc.roundedRect(cellX, y, cellW, imgH, 2, 2, 'FD');

    if (p.photo) {
      try {
        const fmt = /image\/png/.test(p.photo) ? 'PNG' : 'JPEG';
        doc.addImage(p.photo, fmt, cellX, y, cellW, imgH, undefined, 'FAST');
      } catch (_) { /* image invalide, on laisse le cadre vide */ }
    }

    doc.setFontSize(8.3);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30);
    const lines = doc.splitTextToSize(p.name, cellW);
    doc.text(lines.slice(0, 2), cellX + cellW / 2, y + imgH + 4, { align: 'center' });
    doc.setTextColor(0);
    doc.setFont('helvetica', 'normal');

    col++;
    if (col >= cols) { col = 0; y += rowH; }
  }

  doc.save(`${currentCollection.name} - Catalogue.pdf`);
}

        <div class="photo-area" id="qa-photo-area">
          ${qaPhotoB64
            ? `<img class="photo-preview" src="${qaPhotoB64}" alt="">`
            : `<div style="font-size:2rem;color:var(--muted)">📷</div><div style="font-size:0.78rem;color:var(--muted)">Appuyez pour ajouter</div>`}
          <input type="file" id="qa-file-cam" accept="image/*" capture="environment" style="display:none" onchange="handleQaPhoto(event)">
          <input type="file" id="qa-file-gal" accept="image/*" style="display:none" onchange="handleQaPhoto(event)">
        </div>
        <div class="photo-btns">
          <button class="photo-btn" onclick="document.getElementById('qa-file-cam').click()">📷 Caméra</button>
          <button class="photo-btn" onclick="document.getElementById('qa-file-gal').click()">🖼 Galerie</button>
          ${qaPhotoB64 ? `<button class="photo-btn" style="flex:none;padding:8px 12px;" onclick="qaPhotoB64=null;renderQuickAddModal()">🗑</button>` : ''}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Nom du produit</label>
        <input class="form-input" id="qa-name" placeholder="Nom affiché…">
      </div>

      <div class="form-group">
        <label class="form-label">Prix d'achat (€)</label>
        <input class="form-input" type="number" id="qa-buy" placeholder="0.00" min="0" step="0.01">
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="submitQuickAdd(false)">Suivant ➜</button>
        <button class="btn btn-primary" style="flex:1;" onclick="submitQuickAdd(true)">Terminer ✓</button>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('qa-name')?.focus(), 50);
}

function handleQaPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    showCropper(ev.target.result, result => {
      qaPhotoB64 = result;
      renderQuickAddModal();
    });
  };
  reader.readAsDataURL(file);
}

async function submitQuickAdd(finish) {
  const name = document.getElementById('qa-name').value.trim();
  const buy_price = parseFloat(document.getElementById('qa-buy').value) || 0;
  if (!name) { alert('Entrez un nom.'); return; }
  const payload = { name, search_name: name, buy_price, sell_price_ebay: null, excluded: false };
  if (qaPhotoB64) payload.photo = qaPhotoB64;
  try {
    await saveProduct(currentCollection.id, payload);
    qaCount++;
    if (finish) {
      closeModal('modal-qa');
      await loadProducts(currentCollection.id);
      renderProductsView();
    } else {
      qaPhotoB64 = null;
      renderQuickAddModal();
    }
  } catch (e) { alert('Erreur : ' + e.message); }
}

// ── Photo ──
function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    // Ouvre le recadrage 1:1 avant de valider la photo
    showCropper(ev.target.result, result => {
      setPhotoPreview(result);
    });
  };
  reader.readAsDataURL(file);
}

function setPhotoPreview(b64) {
  currentPhotoB64 = b64;
  const area = document.getElementById('photo-area');
  if (!area) return;
  area.innerHTML = `
    <img class="photo-preview" id="photo-preview" src="${b64}" alt="">
    <input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
    <input type="file" id="file-gal" accept="image/*" style="display:none" onchange="handlePhoto(event)">`;
  const btns = document.getElementById('photo-btns');
  if (btns) btns.innerHTML = `
    <button class="photo-btn" onclick="document.getElementById('file-cam').click()">📷 Caméra</button>
    <button class="photo-btn" onclick="document.getElementById('file-gal').click()">🖼 Galerie</button>
    <button class="photo-btn" style="flex:none;padding:8px 12px;" onclick="recropPhoto()">✂️ Recadrer</button>
    <button class="photo-btn" style="flex:none;padding:8px 12px;" onclick="clearPhoto()">🗑</button>`;
}

function recropPhoto() {
  if (!currentPhotoB64) return;
  showCropper(currentPhotoB64, result => setPhotoPreview(result));
}

// ════════════════════════════════════════════════════════════
// CROPPER 1:1
// ════════════════════════════════════════════════════════════
function showCropper(src, callback) {
  cropCallback = callback;

  const ol = document.createElement('div');
  ol.id = 'crop-overlay';
  ol.innerHTML = `
    <div id="crop-topbar">
      <button id="crop-cancel-btn" onclick="cancelCrop()">Annuler</button>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:#e8eaf6">Recadrer 1:1</span>
      <button id="crop-ok-btn" onclick="applyCrop()">Valider ✓</button>
    </div>
    <div id="crop-body">
      <div id="crop-viewport">
        <img id="crop-img-inner" src="${src}" alt="">
      </div>
    </div>
    <div id="crop-hint">Glissez l'image pour la repositionner dans le cadre</div>`;
  document.body.appendChild(ol);

  const img = document.getElementById('crop-img-inner');
  const doInit = () => {
    cropNatural = { w: img.naturalWidth, h: img.naturalHeight };
    setTimeout(initCropper, 30); // laisser le DOM se rendre
  };
  if (img.complete && img.naturalWidth) doInit();
  else img.onload = doInit;

  const vp = document.getElementById('crop-viewport');
  vp.addEventListener('pointerdown',  cropDown);
  vp.addEventListener('pointermove',  cropMove);
  vp.addEventListener('pointerup',    cropUp);
  vp.addEventListener('pointercancel',cropUp);
}

function initCropper() {
  const body = document.getElementById('crop-body');
  const vp   = document.getElementById('crop-viewport');
  if (!body || !vp) return;

  const avail = Math.min(body.clientWidth - 8, body.clientHeight - 8);
  cropVpSize = avail;
  vp.style.width  = avail + 'px';
  vp.style.height = avail + 'px';

  // Scale image to COVER the viewport (smallest side fits)
  const ratio = cropNatural.w / cropNatural.h;
  let w, h;
  if (ratio >= 1) { h = avail; w = avail * ratio; }
  else            { w = avail; h = avail / ratio; }
  cropDisplay = { w, h };

  // Center
  cropPos = { x: (avail - w) / 2, y: (avail - h) / 2 };
  applyImgTransform();
}

function applyImgTransform() {
  const img = document.getElementById('crop-img-inner');
  if (!img) return;
  img.style.width     = cropDisplay.w + 'px';
  img.style.height    = cropDisplay.h + 'px';
  img.style.transform = `translate(${cropPos.x}px,${cropPos.y}px)`;
}

function clampCrop() {
  cropPos.x = Math.min(0, Math.max(cropVpSize - cropDisplay.w, cropPos.x));
  cropPos.y = Math.min(0, Math.max(cropVpSize - cropDisplay.h, cropPos.y));
}

function cropDown(e) {
  e.preventDefault();
  cropDragging = true;
  cropDragOrigin = { px: e.clientX, py: e.clientY, ix: cropPos.x, iy: cropPos.y };
  document.getElementById('crop-viewport').setPointerCapture(e.pointerId);
}
function cropMove(e) {
  if (!cropDragging) return;
  e.preventDefault();
  cropPos.x = cropDragOrigin.ix + (e.clientX - cropDragOrigin.px);
  cropPos.y = cropDragOrigin.iy + (e.clientY - cropDragOrigin.py);
  clampCrop();
  applyImgTransform();
}
function cropUp() { cropDragging = false; }

function applyCrop() {
  const img    = document.getElementById('crop-img-inner');
  const scale  = cropNatural.w / cropDisplay.w; // uniform (aspect preserved)
  const srcX   = (-cropPos.x) * scale;
  const srcY   = (-cropPos.y) * scale;
  const srcSz  = cropVpSize   * scale;

  const out = Math.min(800, Math.round(srcSz));
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = out;
  canvas.getContext('2d').drawImage(img, srcX, srcY, srcSz, srcSz, 0, 0, out, out);

  const result = canvas.toDataURL('image/jpeg', 0.85);
  cancelCrop();
  if (cropCallback) cropCallback(result);
}

function cancelCrop() {
  const el = document.getElementById('crop-overlay');
  if (el) el.remove();
}

function clearPhoto() {
  currentPhotoB64 = null;
  const area = document.getElementById('photo-area');
  area.innerHTML = `
    <div style="font-size:2rem;color:var(--muted)">📷</div>
    <div style="font-size:0.78rem;color:var(--muted)">Appuyez pour ajouter</div>
    <input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
    <input type="file" id="file-gal" accept="image/*" style="display:none" onchange="handlePhoto(event)">`;
  const btns = document.getElementById('photo-btns');
  if (btns) btns.innerHTML = `
    <button class="photo-btn" onclick="document.getElementById('file-cam').click()">📷 Caméra</button>
    <button class="photo-btn" onclick="document.getElementById('file-gal').click()">🖼 Galerie</button>`;
}

// ── OCR ──
async function runOCR() {
  if (!currentPhotoB64) { alert('Ajoutez une photo d\'abord.'); return; }
  const spin = document.getElementById('ocr-spin');
  const btn  = document.getElementById('ocr-btn');
  spin.style.display = 'inline'; btn.disabled = true;
  try {
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng');
    const { data: { text } } = await ocrWorker.recognize(currentPhotoB64);
    const cleaned = text.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (cleaned) document.getElementById('input-sname').value = cleaned;
  } catch (e) { alert('Erreur OCR : ' + e.message); }
  finally { spin.style.display = 'none'; btn.disabled = false; }
}

// ── Submit produit ──
async function submitProduct() {
  const name          = document.getElementById('input-pname').value.trim();
  const search_name   = document.getElementById('input-sname').value.trim() || null;
  const buy_price     = parseFloat(document.getElementById('input-buy').value)  || 0;
  const sell_price_ebay = parseFloat(document.getElementById('input-sell').value) || null;
  const excluded      = document.getElementById('input-excluded').checked;
  if (!name) { alert('Entrez un nom de produit.'); return; }
  const payload = { name, search_name, buy_price, sell_price_ebay, excluded };
  if (currentPhotoB64 !== null && currentPhotoB64 !== undefined) payload.photo = currentPhotoB64;
  try {
    if (editingProductId) {
      await updateProduct(editingProductId, payload);
    } else {
      await saveProduct(currentCollection.id, payload);
    }
    closeModal('modal-prod');
    await loadProducts(currentCollection.id);
    renderProductsView();
  } catch (e) { alert('Erreur : ' + e.message); }
}

async function deleteFromEdit() {
  if (!confirm('Supprimer ce produit ?')) return;
  await deleteProduct(editingProductId);
  closeModal('modal-prod');
  await loadProducts(currentCollection.id);
  renderProductsView();
}

// ════════════════════════════════════════════════════════════
// UTILS MODAL
// ════════════════════════════════════════════════════════════
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════
function bootApp() {
  initApp().catch(err => {
    document.getElementById('app').style.display = 'block';
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Erreur au démarrage.<br><small style="color:var(--muted)">${esc(err.message)}</small></div>
      </div>`;
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
</script>
