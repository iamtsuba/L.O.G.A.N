  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0d0f1a;
      --card: #151828;
      --card2: #1c2035;
      --border: #252a42;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --accent3: #43e97b;
      --text: #e8eaf6;
      --muted: #7b82a8;
      --gold: #ffd700;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(108,99,255,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; }
    
    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; } 
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* AUTH SCREEN */
    
    
    
    
    
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .form-group input { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 12px 14px; color: var(--text); font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
      font-family: inherit; font-weight: 800; font-size: 1rem; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #6c63ff, #a78bfa); color: white; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,99,255,0.4); }
    
    

    /* MAIN APP */
    #app { display: none; }
    
    /* HEADER */
    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px;
      display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px); }
    .header-logo { width: 36px; height: 36px; border-radius: 8px; }
    .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1.5px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; }
    .header-spacer { flex: 1; }
    .header-user { font-size: 0.8rem; color: var(--muted); }
    .btn-logout { background: transparent; border: 1.5px solid var(--border); color: var(--muted);
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
      transition: all 0.2s; }
    .btn-logout:hover { border-color: var(--accent2); color: var(--accent2); }

    /* MAIN CONTENT */
    .main { padding: 20px; max-width: 900px; margin: 0 auto; }

    /* PAGE TITLES */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 1px; }
    .back-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: none;
      color: var(--muted); cursor: pointer; font-family: inherit; font-size: 0.9rem; padding: 6px 0; }
    .back-btn:hover { color: var(--text); }

    /* COLLECTIONS GRID */
    .collections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .collection-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 20px; cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden; }
    .collection-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
    .collection-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }
    .collection-card:hover::before { opacity: 1; }
    .collection-emoji { font-size: 2rem; margin-bottom: 10px; }
    .collection-name { font-weight: 800; font-size: 1rem; margin-bottom: 4px; }
    .collection-type { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
    .collection-stats { display: flex; gap: 12px; }
    .stat { text-align: center; }
    .stat-value { font-weight: 800; font-size: 0.95rem; color: var(--accent); }
    .stat-label { font-size: 0.7rem; color: var(--muted); }
    .collection-delete { position: absolute; top: 10px; right: 10px; background: transparent; border: none;
      color: var(--muted); cursor: pointer; font-size: 1rem; opacity: 0; transition: opacity 0.2s; padding: 4px; }
    .collection-card:hover .collection-delete { opacity: 1; }
    .collection-delete:hover { color: var(--accent2); }

    /* ADD CARD */
    .add-card { background: transparent; border: 1.5px dashed var(--border); border-radius: var(--radius);
      padding: 20px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 140px; gap: 8px; color: var(--muted); }
    .add-card:hover { border-color: var(--accent); color: var(--accent); }
    .add-card-icon { font-size: 2rem; }
    .add-card-label { font-size: 0.9rem; font-weight: 700; }

    /* RECAP BANNER */
    .recap-banner { background: linear-gradient(135deg, #1c2035, #252a42); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; display: flex; gap: 24px; flex-wrap: wrap; }
    .recap-item { flex: 1; min-width: 120px; }
    .recap-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .recap-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1px; }
    .recap-value.green { color: var(--accent3); }
    .recap-value.gold { color: var(--gold); }
    .recap-value.red { color: var(--accent2); }

    /* PRODUCTS */
    .product-list { display: flex; flex-direction: column; gap: 12px; }
    .product-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 16px; display: flex; gap: 14px; align-items: center; transition: border-color 0.2s; }
    .product-card:hover { border-color: var(--border); }
    .product-img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex-shrink: 0;
      background: var(--card2); }
    .product-img-placeholder { width: 72px; height: 72px; border-radius: 10px; background: var(--card2);
      display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-weight: 800; font-size: 1rem; margin-bottom: 4px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .product-prices { display: flex; gap: 14px; flex-wrap: wrap; }
    .price-chip { display: flex; flex-direction: column; }
    .price-chip-label { font-size: 0.7rem; color: var(--muted); }
    .price-chip-val { font-weight: 700; font-size: 0.9rem; }
    .price-chip-val.buy { color: var(--accent2); }
    .price-chip-val.sell { color: var(--accent3); }
    .price-chip-val.loading { color: var(--muted); font-style: italic; font-size: 0.75rem; }
    .product-actions { display: flex; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--muted);
      padding: 6px; border-radius: 6px; transition: all 0.2s; font-size: 1rem; }
    .icon-btn:hover { background: var(--card2); color: var(--text); }
    .icon-btn.danger:hover { color: var(--accent2); }

    /* PROFIT BADGE */
    .profit-badge { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .profit-badge.pos { background: rgba(67,233,123,0.15); color: var(--accent3); }
    .profit-badge.neg { background: rgba(255,107,107,0.15); color: var(--accent2); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
    .modal-footer .btn { flex: 1; }
    .btn-ghost { background: var(--card2); color: var(--text); }
    .btn-ghost:hover { background: var(--border); }
    
    .form-group select { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 12px 14px; color: var(--text); font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s; }
    .form-group select:focus { outline: none; border-color: var(--accent); }
    .form-group textarea { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px;
      padding: 12px 14px; color: var(--text); font-size: 0.95rem; font-family: inherit; resize: vertical; min-height: 80px; }

    /* IMAGE UPLOAD */
    .img-upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 20px;
      text-align: center; cursor: pointer; transition: all 0.2s; }
    .img-upload-area:hover { border-color: var(--accent); }
    .img-upload-area img { max-height: 120px; border-radius: 8px; margin-top: 8px; }
    .img-upload-area p { color: var(--muted); font-size: 0.85rem; }
    
    /* EBAY BADGE */
    .ebay-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.3); border-radius: 6px; padding: 2px 8px; font-size: 0.7rem;
      color: var(--accent); margin-top: 4px; }

    /* LOADING */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    /* TOAST */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 20px; font-size: 0.9rem; font-weight: 600; z-index: 9999;
      transition: opacity 0.3s; opacity: 0; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.success { border-color: var(--accent3); color: var(--accent3); }
    #toast.error { border-color: var(--accent2); color: var(--accent2); }

    .access-denied { text-align: center; padding: 60px 20px; }
    .access-denied h2 { color: var(--accent2); margin-bottom: 10px; }

    @media (max-width: 600px) {
      .collections-grid { grid-template-columns: 1fr 1fr; }
      .recap-banner { gap: 12px; }
      .product-card { flex-wrap: wrap; }
    }
  </style>
</head>

// ══════════════════════════════════════════════════════════════
// SESSION LOGAN (pas de connexion propre)
// ══════════════════════════════════════════════════════════════
// Cette app est une sous-app de LOGAN.
// Elle reçoit la session Supabase via :
//   1. window.LOGAN_SESSION  (injection directe par LOGAN dans la même page)
//   2. localStorage['logan_session']  (fallback cross-page)
//   3. Session Supabase déjà active (même domaine / storage partagé)
// En dernier recours : mini formulaire de connexion fallback.

async function checkSession() {
  // 1. Session injectée directement par LOGAN dans la même page
  if (window.LOGAN_SESSION) {
    const { data, error } = await db.auth.setSession(window.LOGAN_SESSION);
    if (!error && data?.user) {
      currentUser = data.user;
      startApp();
      return;
    }
  }

  // 2. Session stockée dans localStorage par LOGAN
  try {
    const raw = localStorage.getItem('logan_session');
    if (raw) {
      const parsed = JSON.parse(raw);
      const { data, error } = await db.auth.setSession(parsed);
      if (!error && data?.user) {
        currentUser = data.user;
        startApp();
        return;
      }
    }
  } catch (_) {}

  // 3. Session Supabase déjà active (même domaine / storage partagé)
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    currentUser = session.user;
    startApp();
    return;
  }

  // Aucune session LOGAN trouvée → fallback : mini formulaire de connexion
  showFallbackLogin();
}

// ══════════════════════════════════════════════════════════════
// FALLBACK LOGIN (si pas de session LOGAN)
// ══════════════════════════════════════════════════════════════
function showFallbackLogin() {
  document.getElementById('app').style.display = 'none';
  const existing = document.getElementById('fallback-login');
  if (existing) { existing.style.display = 'flex'; return; }

  document.body.insertAdjacentHTML('beforeend', `

        <div style="text-align:center;margin-bottom:24px;">

            -webkit-text-fill-color:transparent;">Collection App</div>
          <div style="font-size:0.8rem;color:#7b82a8;margin-top:4px;">Connexion requise</div>
        </div>
        <div id="fallback-err" style="display:none;background:rgba(255,107,107,0.15);

        <div style="margin-bottom:14px;">
          <label style="display:block;font-size:0.85rem;color:#7b82a8;margin-bottom:6px;font-weight:600;">Email</label>
          <input type="email" id="fallback-email" placeholder="vous@exemple.com" autocomplete="email"
            style="width:100%;background:#0d0f1a;border:1.5px solid #252a42;border-radius:10px;
            padding:12px 14px;color:#e8eaf6;font-size:0.95rem;font-family:inherit;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:20px;">
          <label style="display:block;font-size:0.85rem;color:#7b82a8;margin-bottom:6px;font-weight:600;">Mot de passe</label>
          <input type="password" id="fallback-pass" placeholder="••••••••" autocomplete="current-password"
            style="width:100%;background:#0d0f1a;border:1.5px solid #252a42;border-radius:10px;
            padding:12px 14px;color:#e8eaf6;font-size:0.95rem;font-family:inherit;box-sizing:border-box;">
        </div>
        <button onclick="fallbackLogin()"
          style="width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;
          font-family:inherit;font-weight:800;font-size:1rem;
          background:linear-gradient(135deg,#6c63ff,#a78bfa);color:white;">

        </button>
        <div style="margin-top:14px;text-align:center;font-size:0.75rem;color:#7b82a8;">
          Session automatique si lancé depuis LOGAN
        </div>
      </div>
    </div>`);

  document.getElementById('fallback-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') fallbackLogin();
  });
  document.getElementById('fallback-email').addEventListener('keydown', e => {
    if (e.key === 'Enter') fallbackLogin();
  });
}

async function fallbackLogin() {
  const email = document.getElementById('fallback-email').value.trim();
  const pass  = document.getElementById('fallback-pass').value;
  const errEl = document.getElementById('fallback-err');

  if (!email || !pass) {
    errEl.textContent = 'Email et mot de passe requis.';
    errEl.style.display = 'block';
    return;
  }

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    return;
  }
  currentUser = data.user;
  document.getElementById('fallback-login').style.display = 'none';
  startApp();
}

// APP START
// ══════════════════════════════════════════════════════════════
async function startApp() {
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-user').textContent = currentUser.email;
  await loadCollections();
  renderCollectionsView();
}



async function logout() {
  await db.auth.signOut();
  currentUser = null;
  if (window.LOGAN_LOGOUT) {
    window.LOGAN_LOGOUT();
  } else {
    showFallbackLogin();
  }
}

async function loadCollections() {
  const { data, error } = await db
    .from('collectapp_collections')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });
  collections = data || [];
}

async function loadProducts(collectionId) {
  const { data, error } = await db
    .from('collectapp_products')
    .select('*')
    .eq('collection_id', collectionId)
    .order('created_at', { ascending: false });
  products = data || [];
}

async function createCollection(name, typeId, customType) {
  const finalType = typeId === 'custom' ? customType : typeId;
  const { data, error } = await db
    .from('collectapp_collections')
    .insert({ user_id: currentUser.id, name, type_id: finalType })
    .select().single();
  if (error) { toast('Erreur: ' + error.message, 'error'); return; }
  collections.unshift(data);
  toast('Collection créée !', 'success');
  closeModal();
  renderCollectionsView();
}

async function deleteCollection(id) {
  if (!confirm('Supprimer cette collection et tous ses produits ?')) return;
  await db.from('collectapp_products').delete().eq('collection_id', id);
  await db.from('collectapp_collections').delete().eq('id', id);
  collections = collections.filter(c => c.id !== id);
  toast('Collection supprimée', 'success');
  renderCollectionsView();
}

async function createProduct(collectionId, name, searchName, buyPrice, imageUrl, sellPrice) {
  const sell = sellPrice ? parseFloat(sellPrice) : null;
  const { data, error } = await db
    .from('collectapp_products')
    .insert({ collection_id: collectionId, name, search_name: searchName || name, buy_price: parseFloat(buyPrice)||0, image_url: imageUrl||null, sell_price_ebay: (sell && sell > 0) ? sell : null })
    .select().single();
  if (error) { toast('Erreur: ' + error.message, 'error'); return; }
  products.unshift(data);
  toast('Produit ajouté !', 'success');
  closeModal();
  renderProductsView();
}

async function duplicateProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const { data, error } = await db
    .from('collectapp_products')
    .insert({
      collection_id: p.collection_id,
      name: p.name + ' (copie)',
      search_name: p.search_name || p.name,
      buy_price: p.buy_price || 0,
      image_url: p.image_url || null,
      sell_price_ebay: p.sell_price_ebay ?? null
    })
    .select().single();
  if (error) { toast('Erreur: ' + error.message, 'error'); return; }
  products.unshift(data);
  toast('Produit dupliqué', 'success');
  renderProductsView();
}

async function deleteProduct(id) {
  if (!confirm('Supprimer ce produit ?')) return;
  await db.from('collectapp_products').delete().eq('id', id);
  products = products.filter(p => p.id !== id);
  toast('Produit supprimé', 'success');
  renderProductsView();
}

// ============================================================
// PRIX DE REVENTE (sources externes + saisie manuelle)
// ============================================================
// Aucune API publique gratuite ne permet de récupérer le prix sans serveur.
// On ouvre les sources de ventes réelles et l'utilisateur saisit la moyenne.

function ebayUrl(name) {
  const q = encodeURIComponent(name);
  // LH_Sold=1 & LH_Complete=1 = annonces vendues / terminées, triées par date
  return `https://www.ebay.fr/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1&_sop=13`;
}
function point130Url(name) {
  const q = encodeURIComponent(name);
  // 130point agrège les ventes eBay réussies
  return `https://130point.com/sales/?query=${q}&searchButton=&type=2`;
}
function vintedUrl(name) {
  const q = encodeURIComponent(name);
  // Vinted : articles en vente (indicatif, pas un historique de ventes)
  return `https://www.vinted.fr/catalog?search_text=${q}&order=price_low_to_high`;
}

function openPriceSources(productId) {
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const sq = p.search_name || p.name;
  document.getElementById('modal-content').innerHTML = `
    <h2>💶 Prix de revente</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:16px">
      Recherche basée sur : « ${escHtml(sq)} ». Consultez les ventes, puis saisissez la moyenne.
    </p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <a class="btn btn-ghost" style="text-decoration:none;display:flex;align-items:center;gap:10px;justify-content:flex-start"
         href="${ebayUrl(sq)}" target="_blank" rel="noopener">
        📦 eBay — ventes réussies
      </a>
      <a class="btn btn-ghost" style="text-decoration:none;display:flex;align-items:center;gap:10px;justify-content:flex-start"
         href="${point130Url(sq)}" target="_blank" rel="noopener">
        📊 130point — historique des ventes
      </a>
      <a class="btn btn-ghost" style="text-decoration:none;display:flex;align-items:center;gap:10px;justify-content:flex-start"
         href="${vintedUrl(sq)}" target="_blank" rel="noopener">
        👕 Vinted — articles en vente (indicatif)
      </a>
    </div>
    <div class="form-group">
      <label>Prix de revente moyen (€)</label>
      <input type="number" id="sell-input" min="0" step="0.01"
        value="${p.sell_price_ebay ?? ''}" placeholder="Ex: 24.50">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn btn-primary" onclick="saveSellPrice('${p.id}')">Enregistrer</button>
    </div>`;
  document.getElementById('modal-overlay').style.display = 'flex';
}

async function saveSellPrice(productId) {
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const raw = document.getElementById('sell-input').value;
  const price = raw === '' ? null : parseFloat(String(raw).replace(',', '.'));
  if (price !== null && (isNaN(price) || price < 0)) { toast('Prix invalide', 'error'); return; }
  const { error } = await db.from('collectapp_products').update({ sell_price_ebay: price }).eq('id', productId);
  if (error) { toast('Erreur: ' + error.message, 'error'); return; }
  p.sell_price_ebay = price;
  toast('Prix mis à jour', 'success');
  closeModal();
  renderProductsView();
}

// Load stats for each collection card
async function loadCollectionStats() {
  for (const c of collections) {
    const { data } = await db.from('collectapp_products').select('buy_price, sell_price_ebay').eq('collection_id', c.id);
    if (!data) continue;
    const count = data.length;
    const totalBuy = data.reduce((s,p) => s + (p.buy_price||0), 0);
    const totalSell = data.filter(p=>p.sell_price_ebay).reduce((s,p) => s + p.sell_price_ebay, 0);
    const elCount = document.getElementById('col-count-' + c.id);
    const elBuy = document.getElementById('col-buy-' + c.id);
    const elSell = document.getElementById('col-sell-' + c.id);
    if (elCount) elCount.textContent = count;
    if (elBuy) { elBuy.textContent = '€' + totalBuy.toFixed(0); elBuy.style.color = 'var(--accent2)'; }
    if (elSell) { elSell.textContent = totalSell > 0 ? '€' + totalSell.toFixed(0) : '–'; elSell.style.color = 'var(--accent3)'; }
  }
}

function renderProductsView() {
  currentView = 'products';

  const html = `
    <div class="page-header">
      <button class="back-btn" onclick="goBack()">← Retour</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 18px;font-size:0.9rem" onclick="openNewProductModal()">+ Ajouter</button>

        <div class="page-title">${escHtml(currentCollection.name)}</div>

      </div>
    </div>
    <div class="recap-banner" id="recap-banner">
      <div class="recap-item">
        <div class="recap-label">Items</div>
        <div class="recap-value">${products.length}</div>
      </div>
      <div class="recap-item">
        <div class="recap-label">Total Achat</div>
        <div class="recap-value red">€${totalBuy.toFixed(2)}</div>
      </div>
      <div class="recap-item">
        <div class="recap-label">Total Revente (eBay)</div>
        <div class="recap-value green">${totalSell > 0 ? '€' + totalSell.toFixed(2) : '—'}</div>
      </div>
      <div class="recap-item">
        <div class="recap-label">P&L potentiel</div>
        <div class="recap-value ${profitClass}">${totalSell > 0 ? (profit >= 0 ? '+' : '') + '€' + profit.toFixed(2) : '—'}</div>
      </div>
    </div>
    ${products.length === 0 ? `<div class="empty-state"><div class="empty-icon">${getTypeEmoji(currentCollection.type_id)}</div><p>Aucun produit.<br>Ajoutez-en un !</p></div>` : ''}

      ${products.map(p => renderProductCard(p)).join('')}
    </div>`;
  document.getElementById('main-content').innerHTML = html;
}

function renderProductCard(p) {
  const profit = p.sell_price_ebay ? (p.sell_price_ebay - p.buy_price) : null;
  const profitBadge = profit !== null
    ? `<span class="profit-badge ${profit >= 0 ? 'pos' : 'neg'}">${profit >= 0 ? '+' : ''}€${profit.toFixed(2)}</span>`
    : '';
  const imgHtml = p.image_url
    ? `<img class="product-img" src="${p.image_url}" alt="${escHtml(p.name)}" onerror="this.style.display='none'">`
    : `<div class="product-img-placeholder">${getTypeEmoji(currentCollection.type_id)}</div>`;

  return `
    <div class="product-card">
      ${imgHtml}
      <div class="product-info">
        <div class="product-name">${escHtml(p.name)}</div>
        ${(p.search_name && p.search_name !== p.name) ? `<div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px">🔍 ${escHtml(p.search_name)}</div>` : ''}
        <div class="product-prices">
          <div class="price-chip">
            <span class="price-chip-label">Achat</span>
            <span class="price-chip-val buy">€${(p.buy_price||0).toFixed(2)}</span>
          </div>
          <div class="price-chip" id="sell-${p.id}">
            <span class="price-chip-label">Revente</span>
            ${p.sell_price_ebay != null
              ? `<span class="price-chip-val sell" style="cursor:pointer" onclick="openPriceSources('${p.id}')">€${p.sell_price_ebay.toFixed(2)} ✏️</span>`
              : `<span class="price-chip-val loading" style="cursor:pointer" onclick="openPriceSources('${p.id}')">＋ Saisir</span>`
            }
          </div>
        </div>
        ${profitBadge}
      </div>
      <div class="product-actions">
        <button class="icon-btn" onclick="openPriceSources('${p.id}')" title="Prix de revente">💶</button>
        <button class="icon-btn" onclick="openEditProductModal('${p.id}')" title="Modifier">✏️</button>
        <button class="icon-btn" onclick="duplicateProduct('${p.id}')" title="Dupliquer">📋</button>
        <button class="icon-btn danger" onclick="deleteProduct('${p.id}')" title="Supprimer">🗑</button>
      </div>
    </div>`;
}

function updateRecapBanner() {
  if (currentView !== 'products') return;
  const totalBuy = products.reduce((s,p) => s + (p.buy_price||0), 0);
  const withSell = products.filter(p => p.sell_price_ebay);
  const totalSell = withSell.reduce((s,p) => s + p.sell_price_ebay, 0);
  const profit = totalSell - withSell.reduce((s,p) => s + p.buy_price, 0);
  const profitClass = profit >= 0 ? 'green' : 'red';
  const banner = document.getElementById('recap-banner');
  if (banner) {
    banner.innerHTML = `
      <div class="recap-item"><div class="recap-label">Items</div><div class="recap-value">${products.length}</div></div>
      <div class="recap-item"><div class="recap-label">Total Achat</div><div class="recap-value red">€${totalBuy.toFixed(2)}</div></div>
      <div class="recap-item"><div class="recap-label">Total Revente (eBay)</div><div class="recap-value green">${totalSell > 0 ? '€'+totalSell.toFixed(2) : '—'}</div></div>
      <div class="recap-item"><div class="recap-label">P&L potentiel</div><div class="recap-value ${profitClass}">${totalSell > 0 ? (profit>=0?'+':'')+'€'+profit.toFixed(2) : '—'}</div></div>`;
  }
}

async function handleImageUpload(input, previewId = 'img-preview') {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result;
    const prev = document.getElementById(previewId);
    if (prev) prev.innerHTML = `<img src="${base64}" style="max-height:100px;border-radius:8px;margin-top:8px">`;
    
    // Upload to Supabase Storage
    const filename = `${currentUser.id}/${Date.now()}_${file.name}`;
    const { data, error } = await db.storage.from('collectapp-images').upload(filename, file, { upsert: true });
    if (!error) {
      const { data: urlData } = db.storage.from('collectapp-images').getPublicUrl(filename);
      pendingImageBase64 = urlData.publicUrl;
    } else {
      pendingImageBase64 = base64; // fallback to base64
    }
  };
  reader.readAsDataURL(file);
}

async function submitNewProduct() {
  const name = document.getElementById('prod-name').value.trim();
  const searchName = document.getElementById('prod-search').value.trim();
  const buy = document.getElementById('prod-buy').value;
  const sell = document.getElementById('prod-sell').value;

  await createProduct(currentCollection.id, name, searchName, buy, pendingImageBase64, sell);
}

async function submitEditProduct(productId) {
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const name = document.getElementById('edit-name').value.trim();
  const buy = document.getElementById('edit-buy').value;
  const sell = document.getElementById('edit-sell').value;
  if (!name) { toast('Nom requis', 'error'); return; }

  const updates = {
    name,
    buy_price: parseFloat(buy) || 0,
    sell_price_ebay: (sell !== '' && !isNaN(parseFloat(sell))) ? parseFloat(sell) : null,
  };
  // Si une nouvelle image a été choisie
  if (pendingImageBase64) updates.image_url = pendingImageBase64;

  const { error } = await db.from('collectapp_products').update(updates).eq('id', productId);
  if (error) { toast('Erreur: ' + error.message, 'error'); return; }
  Object.assign(p, updates);
  toast('Produit modifié', 'success');
  closeModal();
  renderProductsView();
}

  document.getElementById('modal-overlay').style.display = 'none';
  pendingImageBase64 = null;

// ============================================================
// UTILS
// ============================================================
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => { el.className = ''; }, 3000);
}

// ══════════════════════════════════════════════════════════════
// BOOT — SESSION LOGAN
// ══════════════════════════════════════════════════════════════
function bootApp() {
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    let tries = 0;
    const wait = setInterval(() => {
      tries++;
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        clearInterval(wait);
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        checkSession().catch(err => showFatalError('Erreur de session : ' + err.message));
      } else if (tries > 40) {
        clearInterval(wait);
        showFatalError('Impossible de charger Supabase. Vérifiez votre connexion.');
      }
    }, 200);
    return;
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  checkSession().catch(err => showFatalError('Erreur de session : ' + err.message));
}

function showFatalError(msg) {
  document.body.insertAdjacentHTML('beforeend', `
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#0d0f1a;color:#e8eaf6;padding:32px;font-family:sans-serif;z-index:9999;">
      <div style="max-width:480px;background:#151828;border:1px solid #252a42;padding:36px;
        border-radius:16px;text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:12px;">⚠️</div>
        <h2 style="margin:0 0 12px;color:#ff6b6b;">Problème de chargement</h2>
        <p style="margin:0 0 20px;line-height:1.6;color:#7b82a8;">${msg}</p>
        <button onclick="location.reload()"
          style="padding:12px 24px;border:none;border-radius:10px;
          background:linear-gradient(135deg,#6c63ff,#a78bfa);color:white;
          font-weight:700;cursor:pointer;">Recharger</button>
      </div>
    </div>`);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
</script>
