<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Collection App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <!-- LOGAN Guard — premier script obligatoirement -->
  <script src="/L.O.G.A.N/logan-guard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f1a;
      --card: #151828;
      --card2: #1a1f35;
      --border: #252a42;
      --text: #e8eaf6;
      --muted: #7b82a8;
      --accent: #6c63ff;
      --accent2: #ffd166;
      --accent3: #06d6a0;
      --accent4: #ef476f;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh; -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; text-decoration: none; }

    /* ── HEADER ── */
    #header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: rgba(13,15,26,0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; flex-direction: column; gap: 1px; }
    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 2px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .header-user { font-size: 0.72rem; color: var(--muted); }
    #btn-logan {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.52rem; letter-spacing: 1.5px; color: var(--muted);
      text-decoration: none; transition: all 0.2s;
    }
    #btn-logan:hover { background: var(--border); color: var(--text); }

    /* ── MAIN ── */
    #main-content { padding: 16px; max-width: 600px; margin: 0 auto; }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 16px;
    }
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem; letter-spacing: 1px; line-height: 1;
    }
    .version-badge {
      font-size: 0.65rem; color: var(--muted);
      background: var(--card2); padding: 3px 7px;
      border-radius: 20px; border: 1px solid var(--border);
    }

    /* ── COLLECTIONS GRID ── */
    .collections-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .collection-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px;
      cursor: pointer; position: relative;
      transition: border-color 0.2s, transform 0.15s;
      min-height: 145px;
    }
    .collection-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .collection-delete {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.8rem;
      opacity: 0; transition: opacity 0.15s; line-height: 1;
      padding: 2px;
    }
    .collection-card:hover .collection-delete { opacity: 1; }
    .collection-emoji { font-size: 1.8rem; margin-bottom: 6px; display: block; }
    .collection-name {
      font-weight: 800; font-size: 0.9rem; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 20px;
    }
    .collection-type { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; }
    .collection-stats { display: flex; justify-content: space-between; gap: 4px; }
    .cstat { text-align: center; flex: 1; }
    .cstat-value { font-size: 0.85rem; font-weight: 800; line-height: 1; }
    .cstat-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
    .add-card {
      background: var(--card); border: 2px dashed var(--border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 145px; transition: border-color 0.2s, background 0.2s;
    }
    .add-card:hover { border-color: var(--accent); background: rgba(108,99,255,0.05); }
    .add-card-icon { font-size: 1.8rem; color: var(--muted); margin-bottom: 6px; }
    .add-card-label { font-size: 0.8rem; color: var(--muted); font-weight: 800; }

    /* ── BACK / VIEW HEADER ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.88rem; font-family: inherit;
      margin-bottom: 10px; padding: 0;
    }
    .back-btn:hover { color: var(--text); }
    .view-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: 1px; line-height: 1;
      margin-bottom: 2px;
    }
    .view-subtitle { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }

    /* ── P&L BANNER ── */
    .pnl-banner {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 10px;
      display: flex; align-items: center; margin-bottom: 14px;
      overflow-x: auto; gap: 0;
    }
    .pnl-item { flex: 1; text-align: center; min-width: 60px; }
    .pnl-value { font-size: 1rem; font-weight: 800; line-height: 1; }
    .pnl-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }
    .pnl-sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; margin: 0 6px; }

    /* ── PRODUCT LIST ── */
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex; align-items: center; gap: 10px; padding: 10px;
      transition: border-color 0.2s;
    }
    .product-card:hover { border-color: var(--accent); }
    .product-thumb {
      width: 58px; height: 58px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0;
    }
    .product-thumb-placeholder {
      width: 58px; height: 58px; border-radius: 8px;
      background: var(--card2); display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0; color: var(--muted);
    }
    .product-info { flex: 1; min-width: 0; }
    .product-name {
      font-weight: 800; font-size: 0.88rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .product-sname {
      font-size: 0.7rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
    }
    .product-prices { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .pbadge {
      font-size: 0.72rem; font-weight: 700;
      padding: 2px 7px; border-radius: 6px;
    }
    .pbadge-buy { background: rgba(108,99,255,0.12); color: #9b93ff; }
    .pbadge-sell { background: rgba(6,214,160,0.12); color: var(--accent3); }
    .pbadge-nosell { background: rgba(123,130,168,0.1); color: var(--muted); }
    .product-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .icoBtn {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem;
      transition: background 0.15s;
    }
    .icoBtn:hover { background: var(--border); }

    .add-product-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      border: none; border-radius: var(--radius);
      color: white; font-family: inherit; font-weight: 800;
      font-size: 0.95rem; padding: 14px; cursor: pointer;
      width: 100%; margin-top: 14px;
    }

    /* ── MODALS ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-sheet {
      background: var(--card); width: 100%; max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 16px 18px 36px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-handle {
      width: 38px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 14px; flex-shrink: 0;
    }
    .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; line-height: 1; }
    .modal-close {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); cursor: pointer; font-size: 1rem; flex-shrink: 0;
    }

    /* WELCOME MODAL */
    .welcome-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .welcome-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 32px 28px;
      max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .welcome-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .welcome-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 1px; margin-bottom: 8px; }
    .welcome-desc { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }

    /* ── FORMS ── */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.75rem; color: var(--muted); font-weight: 800;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .form-input {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 11px 14px;
      color: var(--text); font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }

    /* TYPE SELECTOR */
    .type-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-bottom: 10px;
    }
    .type-btn {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 6px;
      cursor: pointer; text-align: center;
      font-family: inherit; color: var(--text);
      transition: border-color 0.2s, background 0.2s;
    }
    .type-btn:hover { border-color: var(--accent); }
    .type-btn.selected { border-color: var(--accent); background: rgba(108,99,255,0.1); }
    .type-btn-emoji { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .type-btn-label { font-size: 0.68rem; font-weight: 700; }

    /* PHOTO */
    .photo-area {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 16px; text-align: center; cursor: pointer;
      min-height: 80px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      transition: border-color 0.2s;
    }
    .photo-area:hover { border-color: var(--accent); }
    .photo-preview { width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; }
    .photo-btns { display: flex; gap: 8px; margin-top: 8px; }
    .photo-btn {
      flex: 1; padding: 8px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card2);
      color: var(--text); font-family: inherit; font-size: 0.82rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.15s;
    }
    .photo-btn:hover { background: var(--border); }

    /* BUTTONS */
    .btn {
      padding: 11px 20px; border-radius: 10px; border: none;
      font-family: inherit; font-weight: 800; font-size: 0.95rem;
      cursor: pointer; transition: opacity 0.2s; width: 100%;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #6c63ff, #a78bfa); color: white; }
    .btn-secondary { background: var(--card2); border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: rgba(239,71,111,0.1); border: 1px solid rgba(239,71,111,0.4); color: var(--accent4); margin-top: 8px; }
    .mini-btn {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 8px;
      color: var(--muted); font-size: 0.7rem; font-family: inherit;
      cursor: pointer; transition: background 0.15s;
    }
    .mini-btn:hover { background: var(--border); color: var(--text); }

    /* OCR */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.8s linear infinite; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center; padding: 44px 20px; color: var(--muted);
    }
    .empty-icon { font-size: 2.8rem; margin-bottom: 10px; }
    .empty-text { font-size: 0.88rem; line-height: 1.7; }

    /* ── ACTION BUTTONS ROW ── */
    .action-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--card2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 8px;
      color: var(--text); font-family: inherit; font-weight: 700; font-size: 0.82rem;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .action-btn:hover { background: var(--border); border-color: var(--accent); }
    .action-btn.accent { border-color: var(--accent); color: var(--accent); }
    .action-btn.green  { border-color: var(--accent3); color: var(--accent3); }

    /* ── BULK LOADING ── */
    #bulk-loading {
      position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center;
    }
    .bulk-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 36px 40px;
      text-align: center; max-width: 320px; width: 100%;
    }
    @keyframes spin2 { to { transform: rotate(360deg); } }
    .big-spin {
      display: block; font-size: 2.8rem; margin: 0 auto 16px;
      animation: spin2 1s linear infinite;
    }
    .bulk-title { font-family: 'Bebas Neue',sans-serif; font-size: 1.4rem; letter-spacing: 1px; margin-bottom: 6px; }
    .bulk-sub   { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
    .bulk-bar-wrap { background: var(--bg); border-radius: 99px; height: 6px; overflow: hidden; }
    .bulk-bar { height: 100%; background: linear-gradient(90deg,#6c63ff,#a78bfa); border-radius: 99px; transition: width 0.3s; }
    .bulk-counter { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    /* ── CROPPER ── */
    #crop-overlay {
      position: fixed; inset: 0; z-index: 700;
      background: #000; display: flex; flex-direction: column;
    }
    #crop-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; flex-shrink: 0;
      background: #151828; border-bottom: 1px solid #252a42;
    }
    #crop-topbar button {
      font-family: 'Nunito', sans-serif; font-size: 0.85rem;
      border-radius: 8px; padding: 8px 16px; cursor: pointer; border: none;
    }
    #crop-cancel-btn { background: #252a42; color: #e8eaf6; }
    #crop-ok-btn     { background: linear-gradient(135deg,#6c63ff,#a78bfa); color: white; font-weight: 800; }
    #crop-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 12px; overflow: hidden;
    }
    #crop-viewport {
      overflow: hidden; position: relative; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.35);
      cursor: grab; touch-action: none;
    }
    #crop-viewport:active { cursor: grabbing; }
    #crop-img-inner {
      position: absolute; pointer-events: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
      will-change: transform;
    }
    #crop-hint {
      text-align: center; font-size: 0.72rem; color: #7b82a8;
      padding: 6px 16px 16px; flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="app" style="display:none">
  <!-- HEADER -->
  <div id="header">
    <div class="header-left">
      <div class="header-logo">📦 Collections</div>
      <div class="header-user" id="header-user"></div>
    </div>
    <a href="https://iamtsuba.github.io/L.O.G.A.N" id="btn-logan" title="Retour à L.O.G.A.N">L.O.G.A.N</a>
  </div>

  <!-- MAIN -->
  <div id="main-content"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://tkimdlsokrqdfpkfapgc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRraW1kbHNva3JxZGZwa2ZhcGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODAwMjIsImV4cCI6MjA5NTk1NjAyMn0.WRHXtuRXkcgqJuUqrfVAHlk6grSJzo13sJ7101yPLl8';
const APP_FILE      = 'Collection App.html';
const VERSION       = '26.9.19.1000';
const SCRAPERAPI_KEY = '097601ba4d784e8c17ee2355e40711d9';

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let db             = null;
let currentUserId  = null;
let collections    = [];
let products       = [];
let currentView    = 'collections';
let currentCollection = null;

// Modal state
let editingProductId       = null;
let currentPhotoB64        = null;
let ocrWorker              = null;
let selectedTypeId         = null;
let searchNameManualEdited = false; // suivi si l'utilisateur a modifié manuellement le nom de recherche

// Cropper state
let cropCallback       = null;
let cropPos            = { x: 0, y: 0 };
let cropNatural        = { w: 1, h: 1 };
let cropDisplay        = { w: 0, h: 0 };
let cropVpSize         = 0;
let cropDragging       = false;
let cropDragOrigin     = { px: 0, py: 0, ix: 0, iy: 0 };

// eBay auto-fetch state
let ebayTimer          = null;

// ════════════════════════════════════════════════════════════
// COLLECTION TYPES
// ════════════════════════════════════════════════════════════
const TYPES = [
  { id: 'funko',   emoji: '🎭', label: 'Funko POP' },
  { id: 'pokemon', emoji: '⚡', label: 'Pokémon'   },
  { id: 'lorcana', emoji: '🔮', label: 'Lorcana'   },
  { id: 'tsubasa', emoji: '⚽', label: 'Tsubasa'   },
  { id: 'manga',   emoji: '📚', label: 'Manga'     },
  { id: 'custom',  emoji: '📦', label: 'Autre…'    },
];
const typeById = id => TYPES.find(t => t.id === id) || { emoji: '📦', label: id };

// ════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) { return '€' + parseFloat(n || 0).toFixed(0); }

// ════════════════════════════════════════════════════════════
// INIT — Résolution utilisateur sans vérification d'identité
// ════════════════════════════════════════════════════════════
async function initApp() {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Priorité 1 : window.LOGAN_USER_ID injecté par le guard
  if (window.LOGAN_USER_ID) {
    currentUserId = window.LOGAN_USER_ID;
  } else {
    // Attente courte si le guard est encore en train de charger (max 2s)
    let tries = 0;
    while (!window.LOGAN_USER_ID && tries < 20) {
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if (window.LOGAN_USER_ID) {
      currentUserId = window.LOGAN_USER_ID;
    } else {
      // Priorité 2 : lookup dans user_apps
      try {
        const { data } = await db
          .from('user_apps')
          .select('user_id')
          .contains('app_ids', [APP_FILE])
          .limit(1)
          .maybeSingle();
        if (data?.user_id) currentUserId = data.user_id;
      } catch (_) {}
    }
  }

  // Affichage de l'app (s'ouvre toujours)
  document.getElementById('app').style.display = 'block';

  if (!currentUserId) {
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔑</div>
        <div class="empty-text">Aucun utilisateur identifié.<br>
          Ouvrez l'app depuis <a href="https://iamtsuba.github.io/L.O.G.A.N" style="color:var(--accent)">L.O.G.A.N</a>
          ou vérifiez que votre entrée dans <code>user_apps</code> contient <em>"Collection App.html"</em>.
        </div>
      </div>`;
    return;
  }

  // Afficher l'identifiant dans le header
  try {
    const { data: ua } = await db.from('user_apps').select('*').eq('user_id', currentUserId).maybeSingle();
    document.getElementById('header-user').textContent = ua?.email || (currentUserId.slice(0, 8) + '…');
  } catch (_) {
    document.getElementById('header-user').textContent = currentUserId.slice(0, 8) + '…';
  }

  await loadCollections();

  if (collections.length === 0) {
    // Premier lancement : modale de bienvenue, pas d'interface vide
    showWelcomeModal();
  } else {
    renderCollectionsView();
  }
}

// DB — Collections
// ════════════════════════════════════════════════════════════
async function loadCollections() {
  if (!currentUserId) return;
  const { data } = await db
    .from('collectapp_collections')
    .select('*')
    .eq('user_id', currentUserId)
    .order('created_at', { ascending: true });
  collections = data || [];
}

async function saveCollection(name, typeId, customType) {
  const { data, error } = await db
    .from('collectapp_collections')
    .insert({ user_id: currentUserId, name, type_id: typeId, custom_type: customType || null })
    .select().single();
  if (error) throw error;
  return data;
}

async function deleteCollection(id) {
  if (!confirm('Supprimer cette collection et tous ses produits ?')) return;
  await db.from('collectapp_collections').delete().eq('id', id).eq('user_id', currentUserId);
  await loadCollections();
  renderCollectionsView();
}

// ════════════════════════════════════════════════════════════
// DB — Products
// ════════════════════════════════════════════════════════════
async function loadProducts(collectionId) {
  const { data } = await db
    .from('collectapp_products')
    .select('*')
    .eq('collection_id', collectionId)
    .eq('user_id', currentUserId)
    .order('created_at', { ascending: true });
  products = data || [];
}

async function saveProduct(collectionId, payload) {
  const { data, error } = await db
    .from('collectapp_products')
    .insert({ collection_id: collectionId, user_id: currentUserId, ...payload })
    .select().single();
  if (error) throw error;
  return data;
}

async function updateProduct(id, payload) {
  const { error } = await db
    .from('collectapp_products')
    .update(payload)
    .eq('id', id)
    .eq('user_id', currentUserId);
  if (error) throw error;
}

async function deleteProduct(id) {
  await db.from('collectapp_products').delete().eq('id', id).eq('user_id', currentUserId);
}

async function duplicateProduct(p) {
  const { id, created_at, ...rest } = p;
  const { error } = await db
    .from('collectapp_products')
    .insert({ ...rest, name: rest.name + ' (copie)' });
  if (error) throw error;
}

// EBAY AUTO-FETCH

// Sync nom produit → nom de recherche si non modifié manuellement

  if (!searchNameManualEdited) {

async function fetchWithProxy(ebayUrl) {
  const attempts = [
    // Proxy 0 (prioritaire) : ScraperAPI — proxies résidentiels + anti-bot pro + rendu JS complet
    () => fetch(`https://api.scraperapi.com/?api_key=${SCRAPERAPI_KEY}&url=${encodeURIComponent(ebayUrl)}&render=true&country_code=fr`,
            { signal: AbortSignal.timeout(30000) })
            .then(r => r.ok ? r.text() : null),
    // Proxy 1 : r.jina.ai — rendu via vrai navigateur headless
    () => fetch(`https://r.jina.ai/${ebayUrl}`, { signal: AbortSignal.timeout(15000) })
            .then(r => r.ok ? r.text() : null),
    // Proxy 2 : corsproxy.io
    () => fetch(`https://corsproxy.io/?url=${encodeURIComponent(ebayUrl)}`, { signal: AbortSignal.timeout(12000) })
            .then(r => r.ok ? r.text() : null),
    // Proxy 3 : codetabs
    () => fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(ebayUrl)}`, { signal: AbortSignal.timeout(12000) })
            .then(r => r.ok ? r.text() : null),
    // Proxy 4 : allorigins (dernier recours)
    () => fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(ebayUrl)}`, { signal: AbortSignal.timeout(12000) })
            .then(r => r.ok ? r.json() : null).then(d => d?.contents || null),
  ];
  for (const attempt of attempts) {
    try {
      const html = await attempt();
      if (html && html.length > 500 && !isBlockedPage(html)) return html;
    } catch (_) {}
  }
  return null;
}

// Détecte les pages de blocage anti-bot / CAPTCHA eBay
function isBlockedPage(html) {
  const low = html.toLowerCase();
  return low.includes('pardon our interruption')
      || low.includes('captcha')
      || low.includes('access denied')
      || low.includes('are you a human')
      || low.includes('activer javascript')
      || low.includes('vérification humaine')
      || low.includes('unusual traffic')
      || low.includes('robot check');
}

function parseEbayPricesN(html, n = 5) {
  const patterns = [
    // "19,99 EUR" / "19.99 EUR"
    /(\d{1,3}(?:[.\s\u00A0]?\d{3})*[,\.]\d{2})\s*EUR/g,
    // "EUR 19,99"
    /EUR\s*(\d{1,3}(?:[.\s\u00A0]?\d{3})*[,\.]\d{2})/g,
    // "19,99 €" ou "19,99\u00A0€"
    /(\d{1,3}(?:[.\s\u00A0]?\d{3})*[,\.]\d{2})\s*[\u00A0\s]*€/g,
    // "€19,99"
    /€\s*(\d{1,3}(?:[.\s\u00A0]?\d{3})*[,\.]\d{2})/g,
    // JSON structuré : "price":"19.99" ou "value":"19.99" avec "currency":"EUR" à proximité
    /"(?:price|value)"\s*:\s*"?(\d{1,6}\.\d{2})"?/g,
    // Prix sans décimales suivi de € : "50 €" / "50€"
    /(\d{1,6})\s*€(?!\w)/g,
  ];
  let found = [];
  for (const re of patterns) {
    const matches = [...html.matchAll(re)]
      .map(m => parseFloat(m[1].replace(/[\s\u00A0]/g, '').replace(',', '.')));
    if (matches.length) { found = matches; break; }
  }
  return found.filter(p => p > 0.5 && p < 100000).slice(0, n);
}

async function fetchEbayAvg(query, n = 5) {
  if (!query) return { price: null, reason: 'Nom vide' };
  const ebayUrl = `https://www.ebay.fr/sch/i.html?_nkw=${encodeURIComponent(query)}&LH_Sold=1&LH_Complete=1&_sacat=0&_sop=13`;
  const html = await fetchWithProxy(ebayUrl);
  if (!html) return { price: null, reason: 'Tous les proxies ont échoué / bloqués' };
  const prices = parseEbayPricesN(html, n);
  if (!prices.length) return { price: null, reason: `Aucun résultat eBay (page reçue : ${html.length} car.)` };
  const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
  return { price: avg, reason: `${prices.length} vente(s) trouvée(s)` };
}

async function fetchEbayPrice(query) {
  const r = await fetchEbayAvg(query, 5);
  return r.price;
}

function scheduleEbayFetch() {
  clearTimeout(ebayTimer);
  const sellInput = document.getElementById('input-sell');
  if (sellInput?.value) return;
  const q = document.getElementById('input-sname')?.value.trim()
          || document.getElementById('input-pname')?.value.trim();
  if (!q || q.length < 3) return;
  setEbayHint('loading');
  ebayTimer = setTimeout(async () => {
    const { price, reason } = await fetchEbayAvg(q, 5);
    const si = document.getElementById('input-sell');
    if (!si || si.value) return;
    if (price !== null) {
      si.value = price.toFixed(2);
      setEbayHint('found', price);
    } else {
      setEbayHint('none', null, reason);
    }
  }, 900);
}

function setEbayHint(status, price, reason) {
  const el = document.getElementById('ebay-hint');
  if (!el) return;
  if (status === 'loading') {
    el.innerHTML = '<span class="spin">⟳</span> Recherche sur eBay (moy. 5 ventes)…';
    el.style.color = 'var(--muted)';
  } else if (status === 'found') {
    el.innerHTML = `✅ Moy. 5 ventes eBay : <strong>€${price.toFixed(2)}</strong> — modifiable manuellement.`;
    el.style.color = 'var(--accent3)';
  } else {
    el.innerHTML = `⚠️ ${reason || 'Aucun prix trouvé'}. Entrez-le manuellement ou cliquez sur "Voir eBay".`;
    el.style.color = 'var(--accent4)';
  }
}

// ════════════════════════════════════════════════════════════
// BULK EBAY UPDATE
// ════════════════════════════════════════════════════════════
async function bulkUpdateEbay() {
  if (!products.length) { alert('Aucun produit dans cette collection.'); return; }
  const toUpdate = products.filter(p => p.search_name || p.name);
  if (!toUpdate.length) return;

  const ol = document.createElement('div');
  ol.id = 'bulk-loading';
  ol.innerHTML = `
    <div class="bulk-card" style="max-width:380px;text-align:left;">
      <div style="text-align:center">
        <span class="big-spin">⟳</span>
        <div class="bulk-title">Mise à jour eBay</div>
        <div class="bulk-sub">Calcul sur les 5 dernières ventes…</div>
      </div>
      <div class="bulk-bar-wrap"><div class="bulk-bar" id="bulk-bar" style="width:0%"></div></div>
      <div class="bulk-counter" id="bulk-counter" style="text-align:center">0 / ${toUpdate.length}</div>
      <div id="bulk-log" style="margin-top:14px;max-height:180px;overflow-y:auto;font-size:0.72rem;line-height:1.6;"></div>
    </div>`;
  document.body.appendChild(ol);
  const logEl = document.getElementById('bulk-log');

  let done = 0;
  const results = [];

  for (const p of toUpdate) {
    const q = p.search_name || p.name;
    const { price, reason } = await fetchEbayAvg(q, 5);
    results.push({ id: p.id, price });
    done++;
    const pct = Math.round((done / toUpdate.length) * 100);
    document.getElementById('bulk-bar').style.width = pct + '%';
    document.getElementById('bulk-counter').textContent = `${done} / ${toUpdate.length}`;
    if (logEl) {
      const line = document.createElement('div');
      line.style.color = price !== null ? 'var(--accent3)' : 'var(--accent4)';
      line.textContent = price !== null
        ? `✅ ${p.name} → €${price.toFixed(2)}`
        : `⚠️ ${p.name} → ${reason}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }
    await new Promise(r => setTimeout(r, 500));
  }

  let saveErrors = 0;
  for (const { id, price } of results) {
    if (price !== null) {
      const { error } = await db.from('collectapp_products')
        .update({ sell_price_ebay: parseFloat(price.toFixed(2)) })
        .eq('id', id).eq('user_id', currentUserId);
      if (error) saveErrors++;
    }
  }

  document.getElementById('bulk-loading')?.remove();
  await loadProducts(currentCollection.id);
  renderProductsView();

  const updated = results.filter(r => r.price !== null).length;
  const skipped = results.length - updated;
  let msg = `✅ ${updated} prix mis à jour.`;
  if (skipped > 0) msg += `\n⚠️ ${skipped} produit(s) sans résultat (voir détail ci-dessus pendant le traitement).`;
  if (saveErrors > 0) msg += `\n❌ ${saveErrors} erreur(s) d'enregistrement en base.`;
  alert(msg);
}

// EXPORT EXCEL
// ════════════════════════════════════════════════════════════
function exportToExcel() {
  if (!products.length) { alert('Aucun produit à exporter.'); return; }

  const rows = products.map(p => ({
    'Nom':               p.name,
    'Nom recherche':     p.search_name || '',
    'Prix achat (€)':    p.buy_price   || 0,
    'Prix revente eBay (€)': p.sell_price_ebay || '',
    'P&L estimé (€)':   p.sell_price_ebay
                          ? parseFloat((p.sell_price_ebay - (p.buy_price||0)).toFixed(2))
                          : '',
    'Photo':             p.photo ? 'Oui' : 'Non',
    'Ajouté le':         p.created_at ? p.created_at.slice(0,10) : '',
  }));

  // Ligne totaux
  const totalBuy  = products.reduce((s, p) => s + (p.buy_price||0), 0);
  const withSell  = products.filter(p => p.sell_price_ebay);
  const totalSell = withSell.reduce((s, p) => s + p.sell_price_ebay, 0);
  rows.push({
    'Nom': 'TOTAL',
    'Nom recherche': '',
    'Prix achat (€)': parseFloat(totalBuy.toFixed(2)),
    'Prix revente eBay (€)': withSell.length ? parseFloat(totalSell.toFixed(2)) : '',
    'P&L estimé (€)': withSell.length ? parseFloat((totalSell - totalBuy).toFixed(2)) : '',
    'Photo': '',
    'Ajouté le': '',
  });

  const ws = XLSX.utils.json_to_sheet(rows);

  // Largeurs colonnes
  ws['!cols'] = [
    { wch: 30 }, { wch: 30 }, { wch: 16 }, { wch: 22 }, { wch: 16 }, { wch: 8 }, { wch: 12 }
  ];

  const wb = XLSX.utils.book_new();
  const sheetName = (currentCollection.name || 'Collection').slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const t = typeById(currentCollection.type_id);
  const label = currentCollection.type_id === 'custom' && currentCollection.custom_type
    ? currentCollection.custom_type : t.label;

  XLSX.writeFile(wb, `${currentCollection.name} — ${label}.xlsx`);
}

// ── Photo ──
function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    // Ouvre le recadrage 1:1 avant de valider la photo
    showCropper(ev.target.result, result => {
      setPhotoPreview(result);
    });
  };
  reader.readAsDataURL(file);
}

function setPhotoPreview(b64) {
  currentPhotoB64 = b64;
  const area = document.getElementById('photo-area');
  if (!area) return;
  area.innerHTML = `
    <img class="photo-preview" id="photo-preview" src="${b64}" alt="">
    <input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
    <input type="file" id="file-gal" accept="image/*" style="display:none" onchange="handlePhoto(event)">`;
  const btns = document.getElementById('photo-btns');
  if (btns) btns.innerHTML = `
    <button class="photo-btn" onclick="document.getElementById('file-cam').click()">📷 Caméra</button>
    <button class="photo-btn" onclick="document.getElementById('file-gal').click()">🖼 Galerie</button>
    <button class="photo-btn" style="flex:none;padding:8px 12px;" onclick="recropPhoto()">✂️ Recadrer</button>
    <button class="photo-btn" style="flex:none;padding:8px 12px;" onclick="clearPhoto()">🗑</button>`;
}

function recropPhoto() {
  if (!currentPhotoB64) return;
  showCropper(currentPhotoB64, result => setPhotoPreview(result));
}

// ════════════════════════════════════════════════════════════
// CROPPER 1:1
// ════════════════════════════════════════════════════════════
function showCropper(src, callback) {
  cropCallback = callback;

  const ol = document.createElement('div');
  ol.id = 'crop-overlay';
  ol.innerHTML = `
    <div id="crop-topbar">
      <button id="crop-cancel-btn" onclick="cancelCrop()">Annuler</button>
      <span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;color:#e8eaf6">Recadrer 1:1</span>
      <button id="crop-ok-btn" onclick="applyCrop()">Valider ✓</button>
    </div>
    <div id="crop-body">
      <div id="crop-viewport">
        <img id="crop-img-inner" src="${src}" alt="">
      </div>
    </div>
    <div id="crop-hint">Glissez l'image pour la repositionner dans le cadre</div>`;
  document.body.appendChild(ol);

  const img = document.getElementById('crop-img-inner');
  const doInit = () => {
    cropNatural = { w: img.naturalWidth, h: img.naturalHeight };
    setTimeout(initCropper, 30); // laisser le DOM se rendre
  };
  if (img.complete && img.naturalWidth) doInit();
  else img.onload = doInit;

  const vp = document.getElementById('crop-viewport');
  vp.addEventListener('pointerdown',  cropDown);
  vp.addEventListener('pointermove',  cropMove);
  vp.addEventListener('pointerup',    cropUp);
  vp.addEventListener('pointercancel',cropUp);
}

function initCropper() {
  const body = document.getElementById('crop-body');
  const vp   = document.getElementById('crop-viewport');
  if (!body || !vp) return;

  const avail = Math.min(body.clientWidth - 8, body.clientHeight - 8);
  cropVpSize = avail;
  vp.style.width  = avail + 'px';
  vp.style.height = avail + 'px';

  // Scale image to COVER the viewport (smallest side fits)
  const ratio = cropNatural.w / cropNatural.h;
  let w, h;
  if (ratio >= 1) { h = avail; w = avail * ratio; }
  else            { w = avail; h = avail / ratio; }
  cropDisplay = { w, h };

  // Center
  cropPos = { x: (avail - w) / 2, y: (avail - h) / 2 };
  applyImgTransform();
}

function applyImgTransform() {
  const img = document.getElementById('crop-img-inner');
  if (!img) return;
  img.style.width     = cropDisplay.w + 'px';
  img.style.height    = cropDisplay.h + 'px';
  img.style.transform = `translate(${cropPos.x}px,${cropPos.y}px)`;
}

function clampCrop() {
  cropPos.x = Math.min(0, Math.max(cropVpSize - cropDisplay.w, cropPos.x));
  cropPos.y = Math.min(0, Math.max(cropVpSize - cropDisplay.h, cropPos.y));
}

function cropDown(e) {
  e.preventDefault();
  cropDragging = true;
  cropDragOrigin = { px: e.clientX, py: e.clientY, ix: cropPos.x, iy: cropPos.y };
  document.getElementById('crop-viewport').setPointerCapture(e.pointerId);
}
function cropMove(e) {
  if (!cropDragging) return;
  e.preventDefault();
  cropPos.x = cropDragOrigin.ix + (e.clientX - cropDragOrigin.px);
  cropPos.y = cropDragOrigin.iy + (e.clientY - cropDragOrigin.py);
  clampCrop();
  applyImgTransform();
}
function cropUp() { cropDragging = false; }

function applyCrop() {
  const img    = document.getElementById('crop-img-inner');
  const scale  = cropNatural.w / cropDisplay.w; // uniform (aspect preserved)
  const srcX   = (-cropPos.x) * scale;
  const srcY   = (-cropPos.y) * scale;
  const srcSz  = cropVpSize   * scale;

  const out = Math.min(800, Math.round(srcSz));
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = out;
  canvas.getContext('2d').drawImage(img, srcX, srcY, srcSz, srcSz, 0, 0, out, out);

  const result = canvas.toDataURL('image/jpeg', 0.85);
  cancelCrop();
  if (cropCallback) cropCallback(result);
}

function cancelCrop() {
  const el = document.getElementById('crop-overlay');
  if (el) el.remove();
}

function clearPhoto() {
  currentPhotoB64 = null;
  const area = document.getElementById('photo-area');
  area.innerHTML = `
    <div style="font-size:2rem;color:var(--muted)">📷</div>
    <div style="font-size:0.78rem;color:var(--muted)">Appuyez pour ajouter</div>
    <input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
    <input type="file" id="file-gal" accept="image/*" style="display:none" onchange="handlePhoto(event)">`;
  const btns = document.getElementById('photo-btns');
  if (btns) btns.innerHTML = `
    <button class="photo-btn" onclick="document.getElementById('file-cam').click()">📷 Caméra</button>
    <button class="photo-btn" onclick="document.getElementById('file-gal').click()">🖼 Galerie</button>`;
}

// ── OCR ──
async function runOCR() {
  if (!currentPhotoB64) { alert('Ajoutez une photo d\'abord.'); return; }
  const spin = document.getElementById('ocr-spin');
  const btn  = document.getElementById('ocr-btn');
  spin.style.display = 'inline'; btn.disabled = true;
  try {
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('eng');
    const { data: { text } } = await ocrWorker.recognize(currentPhotoB64);
    const cleaned = text.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (cleaned) document.getElementById('input-sname').value = cleaned;
  } catch (e) { alert('Erreur OCR : ' + e.message); }
  finally { spin.style.display = 'none'; btn.disabled = false; }
}

// ── Submit produit ──
async function submitProduct() {
  const name          = document.getElementById('input-pname').value.trim();
  const search_name   = document.getElementById('input-sname').value.trim() || null;
  const buy_price     = parseFloat(document.getElementById('input-buy').value)  || 0;
  const sell_price_ebay = parseFloat(document.getElementById('input-sell').value) || null;
  if (!name) { alert('Entrez un nom de produit.'); return; }
  const payload = { name, search_name, buy_price, sell_price_ebay };
  if (currentPhotoB64 !== null && currentPhotoB64 !== undefined) payload.photo = currentPhotoB64;
  try {
    if (editingProductId) {
      await updateProduct(editingProductId, payload);
    } else {
      await saveProduct(currentCollection.id, payload);
    }
    closeModal('modal-prod');
    await loadProducts(currentCollection.id);
    renderProductsView();
  } catch (e) { alert('Erreur : ' + e.message); }
}

async function deleteFromEdit() {
  if (!confirm('Supprimer ce produit ?')) return;
  await deleteProduct(editingProductId);
  closeModal('modal-prod');
  await loadProducts(currentCollection.id);
  renderProductsView();
}

// ════════════════════════════════════════════════════════════
// UTILS MODAL
// ════════════════════════════════════════════════════════════
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// BOOT
// ════════════════════════════════════════════════════════════
function bootApp() {
  initApp().catch(err => {
    document.getElementById('app').style.display = 'block';
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Erreur au démarrage.<br><small style="color:var(--muted)">${esc(err.message)}</small></div>
      </div>`;
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
