<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BabyVinted</title>
<!-- LOGAN Guard en premier -->
<script src="/L.O.G.A.N/logan-guard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#009688;
  --teal-dark:#00695C;
  --teal-light:#E0F2F1;
  --teal-mid:#B2DFDB;
  --bg:#F5F5F5;
  --surface:#FFFFFF;
  --s2:#FAFAFA;
  --border:#E0E0E0;
  --text:#212121;
  --t2:#616161;
  --t3:#9E9E9E;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 2px 8px rgba(0,150,136,.10);
  --shadow-card:0 4px 20px rgba(0,150,136,.12);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOADER */
#loader{position:fixed;inset:0;background:linear-gradient(135deg,#E0F2F1 0%,#f5f5f5 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
#loader .l-icon{width:64px;height:64px;border-radius:14px;animation:bounce .9s infinite}
#loader p{color:var(--teal-dark);font-weight:600;font-size:15px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
#app.ready{display:flex}

/* TOPBAR */
.topbar{background:var(--teal);padding:12px 16px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.15)}
.topbar-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:12px}
.topbar-title{flex:1;font-size:18px;font-weight:800;color:#fff;letter-spacing:-.3px}
.topbar-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.75);display:block;margin-top:1px}
.btn-logan{background:rgba(0,0,0,.18);color:#fff;border:1.5px solid rgba(255,255,255,.3);
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;letter-spacing:.3px;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-logan:hover{background:rgba(0,0,0,.30)}

/* NAV TABS */
.nav-tabs{background:var(--surface);border-bottom:1.5px solid var(--border);position:sticky;top:0;z-index:90}
.nav-tabs-inner{max-width:800px;margin:0 auto;display:flex}
.nav-tab{flex:1;background:none;border:none;padding:12px 8px;font-size:14px;font-weight:700;
  color:var(--t2);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;border-bottom:3px solid transparent;
  transition:all .2s}
.nav-tab.active{color:var(--teal-dark);border-bottom-color:var(--teal)}
.nav-tab:hover:not(.active){background:var(--s2)}

/* HABITS VIEW */
.habits-header{display:flex;justify-content:flex-end;margin-bottom:16px}
.habits-size-group{margin-bottom:22px}
.habits-size-title{font-size:16px;font-weight:800;color:var(--teal-dark);margin-bottom:10px;
  padding-bottom:6px;border-bottom:2px solid var(--teal-light)}
.habits-cat-list{display:flex;flex-direction:column;gap:8px}
.habits-cat-row{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow);
  padding:10px 14px;display:flex;align-items:center;gap:10px}
.habits-cat-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.habits-counter{display:flex;align-items:center;gap:10px}
.habits-counter-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--teal-mid);
  background:var(--teal-light);color:var(--teal-dark);font-size:16px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
.habits-counter-btn:hover{background:var(--teal-mid)}
.habits-counter-btn:active{transform:scale(.92)}
.habits-counter-value{min-width:24px;text-align:center;font-size:15px;font-weight:800;color:var(--text)}
.habits-empty{text-align:center;padding:40px 20px;color:var(--t2);font-size:14px}

/* MAIN */
.main{flex:1;max-width:800px;margin:0 auto;width:100%;padding:16px}

/* SEARCH / FILTER BAR */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:var(--surface);
  transition:border-color .2s}
.search-input:focus{border-color:var(--teal)}
.btn-add{background:var(--teal);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  display:flex;align-items:center;gap:6px;transition:background .2s;white-space:nowrap;flex-shrink:0}
.btn-add:hover{background:var(--teal-dark)}

/* LIST */
.item-list{display:flex;flex-direction:column;gap:10px}
.item-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:box-shadow .2s,transform .15s;border:1.5px solid transparent}
.item-card:hover{box-shadow:var(--shadow-card);border-color:var(--teal-mid);transform:translateY(-1px)}
.item-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--teal-light);
  display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:var(--t2);margin-top:3px}
.item-size-badge{display:inline-block;background:var(--teal-light);color:var(--teal-dark);
  padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-top:5px}
.btn-download{background:var(--teal-light);color:var(--teal-dark);border:none;padding:8px 12px;
  border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.btn-download:hover{background:var(--teal-mid)}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center;gap:12px}
.empty-state .es-icon{font-size:64px}
.empty-state h3{font-size:20px;font-weight:800}
.empty-state p{font-size:14px;color:var(--t2);max-width:260px;line-height:1.6}

/* MODAL OVERLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:600px;
  max-height:92vh;overflow-y:auto;padding:24px 20px 32px;transform:translateY(100%);transition:transform .3s ease}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--text)}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s;background:var(--surface)}
.form-input:focus{border-color:var(--teal)}

/* PHOTOS SECTION */
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:8px}
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--teal-light)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .remove-photo{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);
  color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-add-btn{aspect-ratio:1;border-radius:10px;border:2px dashed var(--teal-mid);
  background:var(--teal-light);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;font-size:24px;color:var(--teal);transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
.photo-add-btn:hover{background:var(--teal-mid)}
.photo-add-btn span{font-size:10px;font-weight:700;color:var(--teal-dark)}

/* DETAIL VIEW */
.detail-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:20px}
.detail-photo{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--teal-light);cursor:pointer;position:relative}
.detail-photo img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.detail-photo:hover img{transform:scale(1.05)}
.detail-photo .del-photo{position:absolute;top:4px;right:4px;background:rgba(183,28,28,.85);
  color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;
  font-size:14px;display:none;align-items:center;justify-content:center;line-height:1;z-index:2}
.detail-photos.edit-mode .del-photo{display:flex}
.detail-photos.edit-mode .detail-photo img{opacity:.85}
.btn-edit-photos{background:var(--teal-light);color:var(--teal-dark);border:1.5px solid var(--teal-mid);
  padding:7px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;margin-bottom:12px}
.btn-edit-photos.active{background:#FFEBEE;color:#D32F2F;border-color:#FFCDD2}
.detail-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.detail-field{background:var(--s2);border-radius:var(--radius-sm);padding:10px 12px}
.detail-field-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.detail-field-value{font-size:14px;font-weight:600;color:var(--text)}
.detail-actions{display:flex;gap:10px}

/* BUTTONS */
.btn-primary{background:var(--teal);color:#fff;border:none;padding:13px;border-radius:var(--radius);
  font-size:15px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  width:100%;transition:background .2s}
.btn-primary:hover{background:var(--teal-dark)}
.btn-secondary{background:var(--s2);color:var(--text);border:1.5px solid var(--border);padding:13px;
  border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;flex:1;transition:all .2s}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:#FFEBEE;color:#D32F2F;border:1.5px solid #FFCDD2;padding:13px;
  border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;flex:1;transition:all .2s}
.btn-danger:hover{background:#FFCDD2}
.btn-vinted{background:#09B1BA;color:#fff;border:none;padding:13px 16px;
  border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;width:100%;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.btn-vinted:hover{background:#079aa2}
.btn-archive{background:#FFF8E1;color:#F57F17;border:1.5px solid #FFE082;padding:13px 16px;
  border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;width:100%;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn-archive:hover{background:#FFE082}
.btn-archive-toggle{background:var(--surface);color:var(--t2);border:1.5px solid var(--border);
  padding:10px 12px;border-radius:var(--radius-sm);font-size:16px;cursor:pointer;
  transition:all .2s;flex-shrink:0}
.item-archived-badge{display:inline-block;background:#FFF8E1;color:#F57F17;
  padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-top:4px}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:95vw;max-height:92vh;border-radius:12px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;
  color:#fff;font-size:32px;cursor:pointer;line-height:1}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#323232;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;
  font-weight:600;opacity:0;transition:all .3s;z-index:600;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* WELCOME MODAL */
.welcome-modal{text-align:center;padding:20px 10px}
.welcome-modal .w-icon{font-size:64px;margin-bottom:16px}
.welcome-modal h2{font-size:22px;font-weight:800;margin-bottom:10px}
.welcome-modal p{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}

/* LOADING SKELETON */
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:480px){
  .detail-fields{grid-template-columns:1fr}
  .item-card{padding:12px}
  .topbar-inner{gap:8px}
}
</style>
</head>

function renderPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const MAX = 10;
  let html = formPhotos.map((p, i) => {
    const src = p.dataUrl || p.url || '';
    return `<div class="photo-slot">
      <img src="${esc(src)}" alt="" loading="lazy">
      <button class="remove-photo" onclick="removePhoto(${i})">✕</button>
    </div>`;
  }).join('');
  if (formPhotos.length < MAX) {
    html += `<div class="photo-add-btn" onclick="document.getElementById('photoInput').click()">
      📷<span>Ajouter</span>
    </div>`;
  }
  grid.innerHTML = html;
}

function handlePhotoAdd(input) {
  const MAX = 10;
  const files = Array.from(input.files || []);
  for (const file of files) {
    if (formPhotos.length >= MAX) break;
    const reader = new FileReader();
    reader.onload = e => {
      formPhotos.push({ file, dataUrl: e.target.result });
      renderPhotoGrid();
    };
    reader.readAsDataURL(file);
  }
  input.value = '';
}

function removePhoto(index) {
  formPhotos.splice(index, 1);
  renderPhotoGrid();
}

// ── DOWNLOAD PHOTOS ──
async function downloadPhotos(id) {
  const item = items.find(i => i.id === id);
  if (!item || !item.photos || item.photos.length === 0) { toast('Aucune photo à télécharger.', true); return; }
  toast('Téléchargement en cours…');
  for (let i = 0; i < item.photos.length; i++) {
    try {
      const resp = await fetch(item.photos[i]);
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${item.name.replace(/[^a-z0-9]/gi,'_')}_photo${i+1}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      await new Promise(r => setTimeout(r, 300));
    } catch(e) { console.error('Download error', e); }
  }
}

// ── SHARE TO VINTED ──
async function shareToVinted(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;

  const text = [
    `${item.name}`,
    `Marque : ${item.brand}`,
    `Taille : ${item.size}`,
    item.description ? `\n${item.description}` : ''
  ].filter(Boolean).join('\n');

  // Copier le texte dans le presse-papier
  try {
    await navigator.clipboard.writeText(text);
  } catch(_) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch(_) {}
  }

  // Tenter d'ouvrir l'app Vinted via deep link
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (isMobile) {
    // Deep link Vinted → ouvre l'app si installée
    const deepLink = 'vinted://www.vinted.fr/items/new';
    const fallback = 'https://www.vinted.fr/items/new';

    // Ouvrir le deep link, fallback sur le site après 1.5s si l'app ne répond pas
    const start = Date.now();
    const timer = setTimeout(() => {
      if (Date.now() - start < 2000) window.location.href = fallback;
    }, 1500);
    window.location.href = deepLink;
    // Annuler le fallback si l'app a pris la main (page se cache)
    window.addEventListener('blur', () => clearTimeout(timer), { once: true });

    toast('📋 Texte copié ! Collez-le dans la description.');
  } else {
    // Desktop : juste ouvrir Vinted dans un nouvel onglet
    window.open('https://www.vinted.fr/items/new', '_blank');
    toast('📋 Texte copié ! Collez-le dans la description Vinted.');
  }
}

// ── COMPRESS IMAGE ──
function compressImage(dataUrl, maxSize, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else       { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function renderHabits() {
  const grid = document.getElementById('habitsGrid');
  if (habitsCategories.length === 0) {
    grid.innerHTML = `<div class="habits-empty">Aucune catégorie. Ajoutez-en une pour commencer.</div>`;
    return;
  }
  // Group by size, following AGE_SIZES order; ignore sizes not in list at the end
  const bySize = {};
  habitsCategories.forEach(c => {
    if (!bySize[c.size]) bySize[c.size] = [];
    bySize[c.size].push(c);
  });
  const orderedSizes = [...AGE_SIZES.filter(s => bySize[s]), ...Object.keys(bySize).filter(s => !AGE_SIZES.includes(s))];

  grid.innerHTML = orderedSizes.map(size => `
    <div class="habits-size-group">
      <div class="habits-size-title">${esc(size)}</div>
      <div class="habits-cat-list">
        ${bySize[size].map(c => `
          <div class="habits-cat-row">
            <div class="habits-cat-name">${esc(c.name)}</div>
            <div class="habits-counter">
              <button class="habits-counter-btn" onclick="changeCount('${c.id}',-1)">−</button>
              <div class="habits-counter-value">${c.count}</div>
              <button class="habits-counter-btn" onclick="changeCount('${c.id}',1)">+</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

let pendingCategorySize = null;
function openAddCategory() {
  document.getElementById('cat-name').value = '';
  openModal('categoryModal');
}
function closeCategoryModal(e) {
  if (e && e.target !== document.getElementById('categoryModal')) return;
  closeModal('categoryModal');
}

async function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { toast('Le nom de la catégorie est requis.', true); return; }
  // Create this category for every age size
  const rows = AGE_SIZES.map(size => ({
    user_id: currentUserId, size, name, count: 0
  }));
  const { error } = await sb.from('babyvinted_habits').insert(rows);
  if (error) { toast('Erreur : ' + error.message, true); return; }
  toast('Catégorie ajoutée pour toutes les tailles !');
  closeCategoryModal();
  await loadHabits();
}

async function changeCount(id, delta) {
  const cat = habitsCategories.find(c => c.id === id);
  if (!cat) return;
  const newCount = Math.max(0, cat.count + delta);
  cat.count = newCount; // optimistic
  renderHabits();
  const { error } = await sb.from('babyvinted_habits')
    .update({ count: newCount, updated_at: new Date().toISOString() })
    .eq('id', id).eq('user_id', currentUserId);
  if (error) { toast('Erreur : ' + error.message, true); }
}

// ── ESCAPE ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── START ──
init();
</script>

</html>
