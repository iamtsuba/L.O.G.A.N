<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MesMails — L.O.G.A.N</title>
<meta name="theme-color" content="#1c2236">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#1c2236;--mut:#6b7285;--line:#e3ded2;--acc:#c2410c;--acc-ink:#fff;--acc2:#1f4e5f;--ok:#2f7d4f;--warn:#a8650d;--bad:#b42318;--sel:#fdeede;--hover:#f0ece1;--r:12px;--shadow:0 10px 40px rgba(20,24,40,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b1f2a;--ink:#ecebe6;--mut:#9aa1b3;--line:#2b3040;--acc:#f08a5d;--acc-ink:#1b1210;--acc2:#7cc0d3;--sel:#2c2724;--hover:#232837;--ok:#5fc08a;--warn:#e0a04a;--bad:#f2806f;--shadow:0 10px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
mark{background:#ffe08a;color:#222;border-radius:3px;padding:0 1px}
.boot,.fatal{display:flex;align-items:center;justify-content:center;height:100dvh;padding:24px;text-align:center;color:var(--mut)}
.fatal{flex-direction:column;gap:16px;color:var(--ink)}
.fatal h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:0}
#app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-family:'DM Serif Display',serif;font-size:24px;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--acc);font-weight:400}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:999px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.logan-btn{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:9px;font-weight:700;letter-spacing:.4px;text-decoration:none;border-radius:6px;flex:none}
.logan-btn:hover{filter:brightness(1.2)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 11px;border-radius:999px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-size:13px}
.filters .sep{width:1px;height:20px;background:var(--line)}
.filters .grow{flex:1}
.status{font-size:12px;color:var(--mut)}
#prog{height:3px;background:transparent;position:relative;overflow:hidden}
#prog i{position:absolute;inset:0 auto 0 0;background:var(--acc);width:0;transition:width .2s}
#progTxt{font-size:12px;color:var(--mut);padding:2px 14px;background:var(--bg)}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,400px) 1fr}
.pane{overflow:auto;min-height:0;position:relative}
#sPane{border-right:1px solid var(--line);background:var(--card)}
.phead{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.phead .t{flex:1}
.phead h3{margin:0;font-size:16px;color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{width:18px;height:18px;accent-color:var(--acc);flex:none;cursor:pointer}
.srow{display:grid;grid-template-columns:22px 38px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:hover{background:var(--hover)}
.srow.act{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.sname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smail{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.news{background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.acct{background:var(--hover);color:var(--mut);text-transform:none;font-weight:500}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.mrow:hover{background:var(--hover)}
.mrow.unread .msub{font-weight:700}
.mrow.unread::before{content:'';position:absolute}
.msub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msnip{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfrom{font-size:12px;color:var(--acc2);font-weight:500}
.mdate{font-size:12px;color:var(--mut);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.month{position:sticky;top:45px;background:var(--bg);padding:5px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);border-bottom:1px solid var(--line);z-index:1}
.empty{padding:60px 24px;text-align:center;color:var(--mut)}
.empty h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:24px;color:var(--ink);margin:0 0 6px}
.more{padding:14px;text-align:center}
#bulk{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
#bulk .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
#bulk .btn:hover{background:color-mix(in srgb,var(--bg) 15%,transparent)}
#bulk .btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal{background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(980px,100%);height:92dvh}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:22px;flex:1;overflow:hidden;text-overflow:ellipsis}
.mb{padding:16px 18px;overflow:auto;flex:1;min-height:0}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--mut);padding:2px 8px}
.mb p{margin:0 0 10px}
.mb label.row{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.ct{width:100%;border-collapse:collapse;margin-bottom:6px}.ct th{text-align:left;font-size:12px;color:var(--mut);padding:2px 4px;font-weight:500}.ct td{padding:3px}.ct td:first-child{width:34%}.ct td:last-child{width:30px}
.mb textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.mb input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mb h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.acc-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.acc-row .g{flex:1;min-width:0}
.acc-row .g b{display:block;overflow:hidden;text-overflow:ellipsis}
.acc-row small{color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0}
.warnbox{font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}
summary{cursor:pointer;font-weight:500}
details ol{margin:8px 0 0;padding-left:20px;color:var(--mut)}
code{background:var(--bg);border-radius:4px;padding:1px 5px;font-size:12.5px;word-break:break-all}
.rh{padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.rh b{color:var(--ink)}
.rbody{flex:1;min-height:0;background:#fff}
.rbody iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tt{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:90vw;font-size:13px}
.tt.err{background:var(--bad);color:#fff}
.res li{margin:4px 0}
.res a{color:var(--acc2);font-weight:700}
#backBtn{display:none}
@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  #dPane{display:none}
  #app.show-detail #sPane{display:none}
  #app.show-detail #dPane{display:block}
  #backBtn{display:inline-block}
  .brand{font-size:20px}
  .top{flex-wrap:wrap}
  .search{order:5;flex-basis:100%;max-width:none}
  .btn .lbl{display:none}
}
</style>
</head>
<body>
<div class="boot" id="boot"><span><span class="spin"></span>Chargement de MesMails…</span></div>
<div class="fatal" id="fatal" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">Mes<b>Mails</b></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un expéditeur, un objet, un mot…" autocomplete="off">
    </div>
    <div class="top-actions">
      <button class="btn pri" data-act="sync" id="btnSync">Synchroniser</button>
      <button class="btn" data-act="accounts">Comptes</button>
      <a class="logan-btn" href="https://iamtsuba.github.io/L.O.G.A.N" title="Retour au catalogue">L.O.G.A.N</a>
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <div id="prog"><i></i></div>
  <div id="progTxt" hidden></div>
  <main class="cols">
    <section class="pane" id="sPane"></section>
    <section class="pane" id="dPane"></section>
  </main>
</div>

<div id="bulk" hidden></div>
<div id="toast"></div>
<div class="ov" id="m1" hidden></div>
<div class="ov" id="m2" hidden style="z-index:60"></div>

<script>
(function(){
'use strict';

/* ===== Popup OAuth Microsoft : ne pas démarrer l'app dans la fenêtre popup ===== */
if (window.opener && window.opener !== window && /[#?&](code|error|id_token|access_token)=/.test(location.hash + location.search)) { return; }

/* ===== Configuration ===== */
var APP_FILE = 'MesMails.html';
var VERSION  = '26.11.24.2316';
var LOGAN_URL = 'https://iamtsuba.github.io/L.O.G.A.N';
var SB_URL = 'https://tkimdlsokrqdfpkfapgc.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRraW1kbHNva3JxZGZwa2ZhcGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODAwMjIsImV4cCI6MjA5NTk1NjAyMn0.WRHXtuRXkcgqJuUqrfVAHlk6grSJzo13sJ7101yPLl8';
/* Identifiants OAuth : à renseigner ici OU dans Comptes > Configuration (stockés dans le navigateur) */
var GOOGLE_CLIENT_ID = '';
var MS_CLIENT_ID = '';
var G_SCOPES = 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send';

var GIS_URL = 'https://accounts.google.com/gsi/client';
var MSAL_URL = 'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js';

/* ===== Utilitaires ===== */
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function nf(n) { return Number(n).toLocaleString('fr-FR'); }
function plural(n, a, b) { return n > 1 ? b : a; }
function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function fmtDate(ms) {
  var d = new Date(ms), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  var o = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== n.getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('fr-FR', o);
}
function fmtFull(ms) { return new Date(ms).toLocaleString('fr-FR', { dateStyle: 'full', timeStyle: 'short' }); }
function monthKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + d.getMonth(); }
function monthLabel(ms) { return new Date(ms).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
function hl(text, terms) {
  text = String(text || '');
  if (!terms.length) return esc(text);
  var ns = '', map = [], i, k;
  for (i = 0; i < text.length; i++) {
    var n = text[i].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    for (k = 0; k < n.length; k++) { ns += n[k]; map.push(i); }
  }
  var marks = new Array(text.length).fill(false);
  terms.forEach(function (t) {
    if (!t) return; var p = 0;
    while ((p = ns.indexOf(t, p)) > -1) { for (k = p; k < p + t.length; k++) marks[map[k]] = true; p += t.length; }
  });
  var out = '', cur = false, buf = '';
  for (i = 0; i < text.length; i++) {
    if (marks[i] !== cur) { out += cur ? '<mark>' + esc(buf) + '</mark>' : esc(buf); buf = ''; cur = marks[i]; }
    buf += text[i];
  }
  return out + (cur ? '<mark>' + esc(buf) + '</mark>' : esc(buf));
}
var loaded = {};
function loadScript(u) {
  if (loaded[u]) return loaded[u];
  loaded[u] = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = u; s.onload = res;
    s.onerror = function () { delete loaded[u]; rej(new Error('Chargement impossible : ' + u)); };
    document.head.appendChild(s);
  });
  return loaded[u];
}
async function pool(items, n, fn) {
  var i = 0;
  async function w() { while (i < items.length) { var k = i++; await fn(items[k], k); } }
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, w));
}
function toast(msg, err) {
  var el = document.createElement('div'); el.className = 'tt' + (err ? ' err' : ''); el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(function () { el.remove(); }, err ? 6500 : 3800);
}

/* ===== État ===== */
var currentUserId = null;
var S = {
  accounts: [], mails: [], byId: new Map(), byKey: new Map(),
  groups: [], view: [], selS: new Set(), selM: new Set(), active: null,
  unsubs: {}, sLimit: 150, mLimit: 150, terms: [],
  f: { q: '', acct: 'all', news: false, unread: false, date: 'all', sort: 'recent' },
  cfg: { google: '', ms: '', depth: 1000 }, clients: [], syncing: false, last: {}
};
var tokens = {}; try { tokens = JSON.parse(sessionStorage.getItem('mm_tok') || '{}'); } catch (e) { }
function saveTok() { try { sessionStorage.setItem('mm_tok', JSON.stringify(tokens)); } catch (e) { } }
function loadCfg() { try { Object.assign(S.cfg, JSON.parse(localStorage.getItem('mm_cfg') || '{}')); } catch (e) { } }
function saveCfg() { try { localStorage.setItem('mm_cfg', JSON.stringify(S.cfg)); } catch (e) { } }
function clientsOf(p) { return S.clients.filter(function (c) { return c.provider === p; }); }
function gids() { return clientsOf('google').map(function (c) { return c.cid; }); }
function gid() { return gids()[0] || ''; }
function mid_() { var l = clientsOf('microsoft'); return l.length ? l[0].cid : ''; }
function clientName(a) {
  var l = clientsOf(a.provider), cid = a.cid || (l[0] && l[0].cid), c = l.find(function (x) { return x.cid === cid; });
  return c ? (c.name || c.cid.slice(0, 12) + '…') : '';
}
function acctById(id) { return S.accounts.find(function (a) { return a.id === id; }); }

/* ===== Supabase (REST brut) ===== */
function sb(path, opts) {
  opts = opts || {};
  return fetch(SB_URL + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, opts.headers || {})
  }));
}
async function resolveUser() {
  if (window.LOGAN_USER_ID) { currentUserId = window.LOGAN_USER_ID; return; }
  var r = await sb('user_apps?select=user_id&app_ids=cs.' + encodeURIComponent('{"' + APP_FILE + '"}') + '&limit=1');
  if (!r.ok) throw new Error('user_apps : HTTP ' + r.status);
  var rows = await r.json();
  if (!rows.length) throw new Error('NOUSER');
  currentUserId = rows[0].user_id;
}
async function loadAccounts() {
  var lk = 'mm_acc_' + currentUserId;
  try {
    var r = await sb('mesmails_accounts?select=provider,email,client_id&user_id=eq.' + currentUserId + '&order=created_at');
    if (!r.ok) throw new Error(r.status);
    S.accounts = (await r.json()).map(function (x) { return { id: x.provider + ':' + x.email, provider: x.provider, email: x.email, cid: x.client_id || '' }; });
    localStorage.setItem(lk, JSON.stringify(S.accounts));
  } catch (e) {
    try { S.accounts = JSON.parse(localStorage.getItem(lk) || '[]'); } catch (e2) { S.accounts = []; }
    S.dbWarn = true;
  }
}
async function saveAccount(a) {
  try { localStorage.setItem('mm_acc_' + currentUserId, JSON.stringify(S.accounts)); } catch (e) { }
  try {
    await sb('mesmails_accounts?on_conflict=user_id,provider,email', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: currentUserId, provider: a.provider, email: a.email, client_id: a.cid || null }) });
  } catch (e) { }
}
async function loadUnsubs() {
  var lk = 'mm_uns_' + currentUserId;
  try {
    var r = await sb('mesmails_unsubs?select=sender_email,method,status,created_at&user_id=eq.' + currentUserId);
    if (!r.ok) throw new Error(r.status);
    S.unsubs = {}; (await r.json()).forEach(function (x) { S.unsubs[x.sender_email] = { method: x.method, status: x.status, at: x.created_at }; });
    localStorage.setItem(lk, JSON.stringify(S.unsubs));
  } catch (e) { try { S.unsubs = JSON.parse(localStorage.getItem(lk) || '{}'); } catch (e2) { S.unsubs = {}; } }

      if (!pr.ok) throw new Error('Profil Gmail inaccessible (HTTP ' + pr.status + ') — l\'API Gmail est-elle activée ?');
      email = (await pr.json()).emailAddress.toLowerCase();

    } else {

      tokens[a.id] = { token: res.accessToken, exp: res.expiresOn ? res.expiresOn.getTime() : Date.now() + 3000000 };

var delDeletedCache = {};
async function msDeletedId(a) {
  if (delDeletedCache[a.id]) return delDeletedCache[a.id];
  try { var j = await apiJson(a, 'https://graph.microsoft.com/v1.0/me/mailFolders/deleteditems?$select=id'); delDeletedCache[a.id] = j.id; } catch (e) { delDeletedCache[a.id] = ''; }
  return delDeletedCache[a.id];
}
async function serverIdsBySender(a, email) {
  var ids = [], j;
  if (a.provider === 'google') {
    var pt = '';
    do {
      j = await apiJson(a, 'https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=500&q=' + encodeURIComponent('from:' + email) + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''));
      (j.messages || []).forEach(function (m) { ids.push(m.id); }); pt = j.nextPageToken || '';
    } while (pt && ids.length < 20000);
  } else {
    var del = await msDeletedId(a);
    var url = 'https://graph.microsoft.com/v1.0/me/messages?$select=id,parentFolderId&$top=100&$filter=' + encodeURIComponent("from/emailAddress/address eq '" + email.replace(/'/g, "''") + "'");
    while (url && ids.length < 20000) {
      j = await apiJson(a, url);
      j.value.forEach(function (m) { if (!del || m.parentFolderId !== del) ids.push(m.id); });
      url = j['@odata.nextLink'] || null;
    }
  }
  return ids;
}
function filtersActive() { var f = S.f; return !!(f.q.trim() || f.news || f.unread || f.date !== 'all' || f.acct !== 'all'); }
async function planSenders(keys, scopeAll, onProg) {
  var by = {}, n = 0;
  function add(aid, mid) { (by[aid] = by[aid] || new Set()).add(mid); }
  keys.forEach(function (k) {
    (scopeAll ? (S.byKey.get(k) || []) : (gOf(k) ? gOf(k).mails : [])).forEach(function (m) { add(m.acct, m.mid); });
  });
  if (scopeAll) {
    var jobs = []; keys.forEach(function (k) { S.accounts.forEach(function (a) { jobs.push([k, a]); }); });
    var done = 0, fail = [];
    await pool(jobs, 4, async function (j) {
      try { (await serverIdsBySender(j[1], j[0])).forEach(function (id) { add(j[1].id, id); }); } catch (e) { fail.push(j[1].email); }
      done++; onProg && onProg(done, jobs.length);
    });
    if (fail.length) by._fail = Array.from(new Set(fail));
  }
  var out = { byAcct: {}, total: 0, fail: by._fail || [] };
  Object.keys(by).forEach(function (aid) { if (aid === '_fail') return; out.byAcct[aid] = Array.from(by[aid]); out.total += by[aid].size; });
  return out;
}
function planMails(ids) {
  var out = { byAcct: {}, total: 0, fail: [] };
  ids.forEach(function (id) { var m = S.byId.get(id); if (!m) return; (out.byAcct[m.acct] = out.byAcct[m.acct] || []).push(m.mid); out.total++; });
  return out;
}
async function execDelete(plan, onProg) {
  var removed = new Set(), errs = [], done = 0;
  var accts = Object.keys(plan.byAcct);
  for (var ai = 0; ai < accts.length; ai++) {
    var a = acctById(accts[ai]), ids = plan.byAcct[a.id], i;
    try {
      if (a.provider === 'google') {
        for (i = 0; i < ids.length; i += 1000) {
          var ch = ids.slice(i, i + 1000);
          await apiOk(a, 'https://gmail.googleapis.com/gmail/v1/users/me/messages/batchModify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: ch, addLabelIds: ['TRASH'], removeLabelIds: ['INBOX', 'UNREAD'] }) });
          ch.forEach(function (x) { removed.add(a.id + '|' + x); }); done += ch.length; onProg(done);
        }
      } else {
        var chunks = []; for (i = 0; i < ids.length; i += 20) chunks.push(ids.slice(i, i + 20));
        await pool(chunks, 3, async function (c) {
          var body = { requests: c.map(function (id, k) { return { id: String(k), method: 'POST', url: '/me/messages/' + encodeURIComponent(id) + '/move', headers: { 'Content-Type': 'application/json' }, body: { destinationId: 'deleteditems' } }; }) };
          var j = await apiJson(a, 'https://graph.microsoft.com/v1.0/$batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          (j.responses || []).forEach(function (rp) { if (rp.status < 300 || rp.status === 404) removed.add(a.id + '|' + c[Number(rp.id)]); });
          done += c.length; onProg(done);

}

async function startSenderDelete(keys) {

/* ===== Marquer comme lu ===== */
async function serverUnreadIds(a, email) {
  var ids = [], j;
  if (a.provider === 'google') {
    var pt = '';
    do {
      j = await apiJson(a, 'https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=500&q=' + encodeURIComponent('from:' + email + ' is:unread') + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''));
      (j.messages || []).forEach(function (m) { ids.push(m.id); }); pt = j.nextPageToken || '';
    } while (pt && ids.length < 20000);
  } else {
    var url = 'https://graph.microsoft.com/v1.0/me/messages?$select=id&$top=100&$filter=' + encodeURIComponent("isRead eq false and from/emailAddress/address eq '" + email.replace(/'/g, "''") + "'");
    while (url && ids.length < 20000) { j = await apiJson(a, url); j.value.forEach(function (m) { ids.push(m.id); }); url = j['@odata.nextLink'] || null; }
  }
  return ids;
}
async function markSendersRead(keys) {

  keys.forEach(function (k) { (S.byKey.get(k) || []).forEach(function (m) { if (m.unread) add(m.acct, m.mid); }); });
  setProg('Recherche des mails non lus…', 0, 0);
  var jobs = []; keys.forEach(function (k) { S.accounts.forEach(function (a) { jobs.push([k, a]); }); });
  await pool(jobs, 4, async function (j) { try { (await serverUnreadIds(j[1], j[0])).forEach(function (id) { add(j[1].id, id); }); } catch (e) { /* on garde les mails déjà chargés */ } });
  var done = new Set(), errs = [], total = 0;
  Object.keys(by).forEach(function (aid) { total += by[aid].size; });
  var n = 0;
  for (var ai = 0; ai < Object.keys(by).length; ai++) {
    var aid = Object.keys(by)[ai], a = acctById(aid), ids = Array.from(by[aid]), i;
    try {
      if (a.provider === 'google') {
        for (i = 0; i < ids.length; i += 1000) {

          await apiOk(a, 'https://gmail.googleapis.com/gmail/v1/users/me/messages/batchModify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: ch, removeLabelIds: ['UNREAD'] }) });
          ch.forEach(function (x) { done.add(a.id + '|' + x); }); n += ch.length; setProg('Marquage comme lu : ' + nf(n) + ' / ' + nf(total), n, total);
        }
      } else {
        var chunks = []; for (i = 0; i < ids.length; i += 20) chunks.push(ids.slice(i, i + 20));
        await pool(chunks, 3, async function (c) {
          var body = { requests: c.map(function (id, k) { return { id: String(k), method: 'PATCH', url: '/me/messages/' + encodeURIComponent(id), headers: { 'Content-Type': 'application/json' }, body: { isRead: true } }; }) };
          var j = await apiJson(a, 'https://graph.microsoft.com/v1.0/$batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          (j.responses || []).forEach(function (rp) { if (rp.status < 300 || rp.status === 404) done.add(a.id + '|' + c[Number(rp.id)]); });
          n += c.length; setProg('Marquage comme lu : ' + nf(n) + ' / ' + nf(total), n, total);
        });

  if (changed.length) await idbPut(changed).catch(function () { });
  setProg(null); refresh(true);
  if (errs.length) toast('Erreurs : ' + errs.join(' · '), true); else toast(nf(done.size) + ' ' + plural(done.size, 'mail marqué', 'mails marqués') + ' comme lu' + (done.size > 1 ? 's' : ''));
}

/* ===== Lecture d'un mail ===== */
function b64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
}
function dec(bytes, ct) {
  var cs = (/charset="?([\w-]+)"?/i.exec(ct || '') || [])[1] || 'utf-8';
  try { return new TextDecoder(cs).decode(bytes); } catch (e) { return new TextDecoder('utf-8').decode(bytes); }
}
function walkGmail(p, out) {
  var h = {}; (p.headers || []).forEach(function (x) { h[x.name.toLowerCase()] = x.value; });
  if (p.filename) out.files.push(p.filename);
  else if (p.body && p.body.data) {
    var t = dec(b64u(p.body.data), h['content-type']);
    if (/^text\/html/i.test(p.mimeType)) out.html += t; else if (/^text\/plain/i.test(p.mimeType)) out.text += t;
  }
  (p.parts || []).forEach(function (c) { walkGmail(c, out); });
}
async function fetchBody(m) {
  var a = acctById(m.acct);
  if (a.provider === 'google') {
    var j = await apiJson(a, 'https://gmail.googleapis.com/gmail/v1/users/me/messages/' + m.mid + '?format=full');
    var out = { html: '', text: '', files: [], to: '' };
    walkGmail(j.payload || {}, out);
    ((j.payload && j.payload.headers) || []).forEach(function (x) { if (x.name.toLowerCase() === 'to') out.to = decodeMime(x.value); });
    return out;
  }
  var g = await apiJson(a, 'https://graph.microsoft.com/v1.0/me/messages/' + encodeURIComponent(m.mid) + '?$select=body,toRecipients,hasAttachments', { headers: { Prefer: 'outlook.body-content-type="html"' } });
  var isHtml = g.body && /html/i.test(g.body.contentType);
  return { html: isHtml ? g.body.content : '', text: isHtml ? '' : (g.body && g.body.content) || '', files: g.hasAttachments ? ['(pièces jointes)'] : [], to: (g.toRecipients || []).map(function (r) { return r.emailAddress.address; }).join(', ') };
}

  var inner = b.html || '<pre class="t">' + esc(b.text || '(mail vide)') + '</pre>';

  catch (e) {
    return fatal(e.message === 'NOUSER'
      ? '<h2>Accès non configuré</h2><p>Aucun utilisateur n\'a <code>' + APP_FILE + '</code> dans <code>user_apps.app_ids</code>.<br>Ajoutez-le depuis le catalogue L.O.G.A.N.</p>'
      : '<h2>Connexion impossible</h2><p>' + esc(e.message) + '</p>');
  }
  try { await idbOpen(); S.mails = (await idbAll()).map(prep); } catch (e) { S.mails = []; toast('Cache local indisponible', true); }
  await Promise.all([loadAccounts(), loadUnsubs(), loadClients()]);
  reindex();
  $('#boot').hidden = true;
  if (!S.accounts.length) { openWelcome(); return; }     /* premier lancement : pas d'interface vide */
  $('#app').hidden = false; refresh();
  syncAll(true);
}
init();
})();
</script>
</body>
</html>
